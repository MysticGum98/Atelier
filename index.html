.gap-buy+.gap-link{margin-top:8px}
.clear-facets{align-self:flex-start;font-size:13px}

@media (min-width:560px){.trial-grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:760px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .you-grid{grid-template-columns:1fr 1fr}
  .you-card.span{grid-column:span 2}
  .you-fields{grid-template-columns:1fr 1fr}
  .tk-body{grid-template-columns:1fr 132px}
  .tk-body .reasons{grid-column:1/-1}
  .page-head h1{font-size:44px}
  .facet{flex-direction:row;align-items:flex-start;gap:12px}
  .facet-label{min-width:52px;padding-top:8px;font-weight:600}
}
@media (hover:none) and (pointer:coarse){
  input:not([type=range]):not([type=color]):not([type=file]),select,textarea{font-size:17px !important}
  .searchbar input{font-size:17px}
  .colour-pick .mono{width:118px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* accounts (3 Oct 2026) */
/* 4 Oct: the sheet body takes the same 22px sides as every other sheet (his screenshot: text ran to the card edge) */
.signin-body{padding:4px 22px 22px}
.signin input{width:100%;box-sizing:border-box}
.signin .primary{width:100%;margin-top:12px;justify-content:center}
.signin-text{font-size:14px;line-height:1.5;color:var(--steel);margin:0 0 14px}
.code-input{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:22px;letter-spacing:.3em;text-align:center}
.signin-alt{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:13px}
.signin-err{font-size:13px;color:var(--warn);margin:12px 0 0}
.signin-offline{display:block;margin-top:14px;font-size:13px}
.account-email{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 4px;overflow-wrap:anywhere}
.account-delete{display:block;margin-top:16px;font-size:14px;color:var(--warn)}
.build-line{display:block;background:none;border:0;padding:0;margin-top:10px;font-size:13px;color:var(--steel);text-align:left}
/* Together (4 Oct 2026): the You card, the Style row, the page, the pair card, the piece sheet */
.partner-block{margin-top:16px}
.partner-code{display:block;font-size:22px;letter-spacing:.08em;color:var(--ink);margin-bottom:4px}
.partner-row{display:flex;gap:8px;align-items:stretch}
.partner-row input{flex:1;min-width:0}
.together-line{margin-top:-8px}
.together-line.first{margin:14px 0 0}
.tg-back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;margin-bottom:12px;color:var(--cream-dim);font-size:13px;font-weight:600}
.tg-link{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.tg-avatars{display:flex;flex:none}
.tg-av{width:38px;height:38px;border-radius:50%;border:1px solid var(--brass-dim);background:var(--shell-2);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;overflow:hidden}
.tg-av+.tg-av{margin-left:-10px}
.tg-av img{width:100%;height:100%;object-fit:cover}
.tg-linkmeta{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-linkmeta b{font-size:17px;font-weight:600;color:var(--cream);overflow-wrap:anywhere}
.tg-linkmeta small{font-size:13px;color:var(--cream-dim)}
.tg-stale{margin:0 0 14px}
.tg-starts{margin:0 0 10px}
.tg-brief{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tg-pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:2px 8px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:11px 14px;color:var(--cream);text-align:left}
.tg-pick .label{grid-column:1/-1;margin:0}
.tg-val{font-size:22px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-pick svg{color:var(--brass-t);margin-bottom:7px}
.tg-toggles{margin-bottom:12px}
.tg-toggles .chip:disabled{opacity:.5}
.tg-around{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px dashed var(--line-dark);border-radius:12px;padding:12px 14px;color:var(--cream);text-align:left;margin-bottom:16px}
.tg-around-body{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-around-body b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.tg-around-body small{font-size:13px;color:var(--cream-dim)}
.tg-around svg{color:var(--brass-t);flex:none}
.tg-none{margin-bottom:18px}
.tg-dealt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.tg-dealt h2{font-size:22px;font-style:italic;color:var(--cream)}
.tg-tap{margin:0 0 14px}
.pair-card{background:linear-gradient(160deg,#F8F3E8,#EFE7D6);border-radius:12px;padding:16px;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pair-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pair-scorebox{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.pair-score{font-size:34px;line-height:1;color:var(--brass-dim-t)}
.pair-cap{font-size:13px;color:var(--steel)}
.pair-card .icon{width:34px;height:34px;border-color:var(--line);color:var(--ink)}
.pair-sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair-side{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);text-align:left}
.pair-who{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px}
.pair-who b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair-who .mono{font-size:11px;color:var(--steel)}
.pair-strip{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair-ph{aspect-ratio:1;border-radius:6px;overflow:hidden;display:block;min-width:0;border:1px solid rgba(36,27,18,.08)}
.pair-ph img{width:100%;height:100%;object-fit:cover;display:block}
.pair-names{font-size:13px;line-height:1.4;color:var(--steel)}
.pair-side.gone{justify-content:center}
.pair-why{margin:12px 0 0;font-size:13px;line-height:1.4;color:var(--ink)}
.pair-caution{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--warn)}
.pair-pick-group{margin-bottom:14px}
.pair-pick-list{display:flex;flex-wrap:wrap;gap:8px}
.pair-pick{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink);text-align:left}
.pair-pick.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.pair-pick span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 16px 0;padding:10px 14px;border:1px solid var(--line-dark);border-radius:12px;background:var(--shell-2);font-size:13px;color:var(--cream-dim)}
</style>
