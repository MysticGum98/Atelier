<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier: your wardrobe</title>
<meta name="description" content="A private wardrobe that styles you from colour theory, proportion and register.">
<meta name="theme-color" content="#1E1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon.png">
<link rel="manifest" href='data:application/manifest+json,{"name":"Atelier","short_name":"Atelier","start_url":"./","display":"standalone","background_color":"%231E1510","theme_color":"%231E1510","icons":[{"src":"icon.png","sizes":"512x512","type":"image/png"}]}'>
<style>html,body{margin:0;background:#1E1510}#root{min-height:100vh}body{padding-bottom:env(safe-area-inset-bottom)}</style>
<style>#boot{position:fixed;inset:0;background:#1E1510;display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .45s ease}#boot span{font-family:'Bodoni Moda',Didot,serif;font-style:italic;font-size:30px;color:#EDE5D3;letter-spacing:.02em}#boot.gone{opacity:0;pointer-events:none}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"><style id="atelier">
:root{
  --sat:env(safe-area-inset-top,0px);
  --shell:#1E1510;          /* walnut, near-black */
  --shell-2:#2A1E15;        /* lifted walnut for surfaces on the shell */
  --shell-3:#38281B;        /* borders / hover on the shell */
  --grain:linear-gradient(180deg,#231810 0%,#1E1510 40%,#191009 100%);
  --card:#F6F1E6;           /* cream / marble */
  --card-2:#EFE9DA;         /* deeper cream for wells inside cards */
  --ink:#241B12;            /* espresso text on cream */
  /* 2 Oct 2026 (audit 5): muted text was one grey for both surfaces, 4.2:1 on cream and
     3.8:1 on walnut; no single grey can pass 4.5 on both. Walnut is the default here;
     cream surfaces re-point the same tokens below, and inheritance does the rest. */
  --steel:#A6987F;          /* muted text: walnut value; cream surfaces override */
  --cream:#EDE5D3;          /* text on walnut */
  --cream-dim:#A6987F;      /* muted text on walnut */
  --line:#DCD3BF;           /* hairline on cream */
  --line-dark:#3E2E1F;      /* hairline on walnut */
  --brass:#B08D52;
  --brass-dim:#8A6E42;
  --brass-t:var(--brass);   /* brass as TEXT: walnut value; cream surfaces override */
  --brass-dim-t:var(--brass);
  --glow:0 0 24px rgba(255,186,110,.14);
  --good:#4E6B45;--warn:#9A4A31;
  --ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box}
html{background:var(--shell)}
/* cream surfaces: the same muted and brass-text tokens, dark enough for cream (>= 4.86:1 on every cream in use) */
:is(.garment,.verdict,.warn-box,.note,.look-card,.dislike-row,.trip-head,.pick-card,.occ-cov,.buy-row,.oi-row,.cam-opt,.ps-swap,.tour-cap,.tour-card,.selbar,.cap-fix,.wear-rating,.wear-note,.log-tile,.log-cell,.idea-brief,.idea-empty,.idea-tip,.idea-img,.log-take,.wear-take,.log-live,.ticket,.tk-addphoto,.tk-tips,.tk-toggle,.wear-row,.wear-item,.gap,.cap-row,.rule,.you-card,.you-add,.drop,.garment-menu,.frag-card,.usage>div,.diag,.modal,.toast,.backup-bar,.today,.banner,.garment-cat,.garment-actions .icon,.tk-hero-swap,.sel-mark,.reading,.why-gap,.why-add,.g-top,.g-strong,.g-ok,.g-weak,.g-solid,.cap-tag,.foot-tile,.log-search,.idea-prompt,.idea-look,.trial-mode.on,.pair-card){--steel:#675F52;--cream-dim:#675F52;--brass-dim:#775F39;--brass-t:#775F39;--brass-dim-t:#775F39}
/* dark wells inside cream (inputs, selected chips, stat boxes) go back to the walnut values */
:is(.garment,.verdict,.warn-box,.note,.look-card,.dislike-row,.trip-head,.pick-card,.occ-cov,.buy-row,.oi-row,.cam-opt,.ps-swap,.tour-cap,.tour-card,.selbar,.cap-fix,.wear-rating,.wear-note,.log-tile,.log-cell,.idea-brief,.idea-empty,.idea-tip,.idea-img,.log-take,.wear-take,.log-live,.ticket,.tk-addphoto,.tk-tips,.tk-toggle,.wear-row,.wear-item,.gap,.cap-row,.rule,.you-card,.you-add,.drop,.garment-menu,.frag-card,.usage>div,.diag,.modal,.toast,.backup-bar,.today,.banner,.garment-cat,.garment-actions .icon,.tk-hero-swap,.sel-mark,.reading,.why-gap,.why-add,.g-top,.g-strong,.g-ok,.g-weak,.g-solid,.cap-tag,.foot-tile,.log-search,.idea-prompt,.idea-look,.trial-mode.on,.pair-card) :is(.facets,.empty,select,input:not([type=range]):not([type=color]):not([type=file]),textarea,.floor-note,.weather-chip,.trial-mode:not(.on),.drawers.inner .drawer,.pick,.pack-row,.cand,.rate-cta,.rate-line,.cover-bar,.tour-pill,.searchbar,.undo-bar,.frontdoor,.occ:not(.on),.crop-box,.cal-day,.log-cell.on,.foot-tile.on,.pack-stat,.pack-day,.drawer,.banner.pinned,.wear-occ,.you-card .chips .chip.on,.backup-nudge,.ticket .icon.on,.modal .occ.on){--steel:#A6987F;--cream-dim:#A6987F;--brass-dim:#8A6E42;--brass-t:var(--brass);--brass-dim-t:var(--brass)}
.app{min-height:100vh;background:var(--grain);color:var(--cream);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.55}
.display{font-family:'Bodoni Moda',Didot,serif;font-weight:400;letter-spacing:-0.01em;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.label{font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--steel);margin-bottom:6px;display:block}
.hint{color:var(--steel);font-size:13px}
/* 2 Oct (audit 1): helper text inside a label is its own line, sentence case, not the label's mono caps */
.label .hint{display:block;margin-top:3px;font-family:Inter,system-ui,sans-serif;font-size:13px;letter-spacing:0;text-transform:none;line-height:1.4}
/* 2 Oct (audit 7): every tappable thing answers within 44x44 even when drawn smaller;
   the ::after grows only the short side(s), never shrinks, and draws nothing */
:where(button,[role=button],a){position:relative}
:where(button,[role=button],a)::after{content:"";position:absolute;top:min(0px,calc((100% - 44px) / 2));bottom:min(0px,calc((100% - 44px) / 2));left:min(0px,calc((100% - 44px) / 2));right:min(0px,calc((100% - 44px) / 2))}
/* 4 Oct: a tappable CARD holding its own buttons (the closet card, the bottle card) is far
   past 44x44 and needs no layer, and its layer sat ON TOP of those buttons: every tap on
   wash, edit, the ⋯ or a bottle's ✕ landed on the card instead (his screenshot: tapping the
   buttons pinned the piece). Containers with controls inside draw no layer. */
:where([role=button],a):has(button,a,[role=button],input,select,textarea)::after{content:none}
button{font:inherit;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease)}
button:active{transform:scale(.975)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(30,21,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-dark)}
.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1.5px solid var(--brass-dim);background:var(--shell-2);color:var(--cream-dim);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--glow)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.on{border-color:var(--brass);color:var(--brass-t)}
.wordmark{display:flex;flex-direction:column;align-items:center;gap:3px}
.wordmark .display{font-size:22px;font-style:italic;color:var(--cream);letter-spacing:.02em}
.wordmark-rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.topbar-right{display:flex;align-items:center;gap:10px}
.save-state{font-size:11px;color:var(--cream-dim)}
.save-state.bad{color:#D98A6B}
.add-btn{background:var(--shell-2);border-color:var(--line-dark);color:var(--cream)}
.add-btn:hover{border-color:var(--brass-dim);color:var(--brass-t)}

/* ── main + page motion ── */
.main{max-width:1060px;margin:0 auto;padding:22px 16px calc(130px + env(safe-area-inset-bottom));width:100%}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-anim{animation:pageIn .55s var(--ease)}
.page-head{margin-bottom:22px;max-width:640px}
.page-head h1{font-size:34px;line-height:1.05;margin-bottom:8px;color:var(--cream)}
.lede{color:var(--cream-dim);font-size:14px;margin:0}
.section-title,.shelf-title{font-family:'Bodoni Moda',serif;font-weight:400;font-size:22px;margin:26px 0 12px;display:flex;align-items:center;gap:12px;color:var(--cream)}
.section-title .count,.shelf-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cream-dim)}
.shelf-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-dark),transparent)}
.shelf:first-of-type .shelf-title{margin-top:8px}

/* ── buttons ── */
.primary{background:var(--brass);color:#20160D;border:1px solid var(--brass);padding:10px 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.primary:hover{box-shadow:var(--glow)}
.primary:disabled{opacity:.5;cursor:default}
.primary.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.primary.full{justify-content:center;width:100%}
.ghost{background:transparent;color:var(--cream);border:1px solid var(--line-dark);padding:10px 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px}
.ghost:hover{border-color:var(--brass-dim);color:var(--brass-t)}
.ghost.small{padding:6px 10px;font-size:13px;color:var(--cream-dim)}
.ghost.on{border-color:var(--brass);color:var(--brass-t)}
.link{background:none;border:0;padding:0;color:var(--brass-t);text-decoration:underline;cursor:pointer}
.icon{background:transparent;border:1px solid var(--line-dark);width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--cream-dim);padding:0}
.icon:hover{color:var(--brass-t);border-color:var(--brass-dim)}

/* cream context: cards flip the palette */
.card-ui,.garment,.ticket,.look-card,.gap,.cap-row,.you-card,.wear-row,.facets,.rule,.modal,.note,.warn-box,.empty{color:var(--ink)}
.card-ui .label,.garment .label,.ticket .label,.you-card .label{color:var(--steel)}
.card-ui .icon,.ticket .icon,.garment .icon,.modal .icon,.you-card .icon{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.6)}
.ticket .icon.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* ── chips / facets ── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-dark);background:transparent;padding:7px 13px;border-radius:999px;font-size:13px;color:var(--cream-dim)}
.chip:hover{color:var(--cream);border-color:var(--brass-dim)}
.chip.on{background:var(--cream);border-color:var(--cream);color:var(--ink);font-weight:500}
.facets{background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;margin-bottom:8px;color:var(--cream)}
.facets{padding:0;gap:0;overflow:hidden}
.facets.active{border-color:var(--brass-dim)}
.facets-row{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 12px 9px 9px;color:var(--cream-dim);text-align:left}
.facets.active .facets-row{color:var(--cream)}
.facets-what{flex:1;font-size:13px}
.facet-badge{width:38px;height:38px;flex:none}
.fb-rim{fill:none;stroke:var(--brass-dim);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.1 8.08;transition:stroke .3s var(--ease)}
.fb-core{fill:var(--shell-2);stroke:var(--line-dark);stroke-width:1;transition:fill .3s var(--ease)}
.facet-badge text{font-family:'Bodoni Moda',serif;font-size:13px;fill:var(--ink)}
.facets.active .fb-rim{stroke:var(--brass)}
.facets.active .fb-core{fill:var(--cream);stroke:var(--cream)}
.facets.open .drawer-chev{transform:rotate(90deg);color:var(--brass-t)}
.facets-body{display:flex;flex-direction:column;gap:12px;padding:4px 14px 14px;border-top:1px solid var(--line-dark)}
.facet-foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:2px}
.wash-toggle{gap:5px;padding:0 9px;width:auto}
.wash-toggle .mono{font-size:11px}
.facet{display:flex;flex-direction:column;gap:6px}
.facet-label{font-size:13px;color:var(--cream-dim);font-weight:600}

/* ── garment cards (cream on walnut shelves) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.garment{background:var(--card);border:1px solid rgba(0,0,0,.25);border-radius:12px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.garment:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.45),var(--glow)}
.garment.selected{outline:2px solid var(--brass)}
.garment-color{height:110px;position:relative}
.garment-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.garment-dot{position:absolute;top:8px;left:8px;width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 2px var(--card)}
.garment-cat{position:absolute;left:8px;bottom:8px;background:rgba(246,241,230,.92);padding:2px 7px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.garment-body{padding:10px 12px 12px}
.garment-name{font-family:'Bodoni Moda',serif;font-size:17px;line-height:1.15;margin-bottom:3px;color:var(--ink)}
.garment-meta{font-size:11px;color:var(--steel);display:flex;gap:5px;flex-wrap:wrap}
.garment-wear{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--line);border-radius:6px;color:var(--steel)}
/* 2 Oct (audit 10, mockup): nothing sits on the photo. Actions are a row under the body,
   and the category pill is dropped on a shelf, where the shelf heading already says it. */
.garment-actions{display:flex;gap:6px;justify-content:flex-end;padding:0 10px 10px;margin-top:-2px}
.shelf .garment-cat{display:none}
.garment-actions .icon{width:32px;height:32px;background:transparent;border-color:var(--line);color:var(--ink)}
@media (hover:hover){.garment-actions{opacity:0;transition:opacity .3s}.garment:hover .garment-actions,.garment:focus-within .garment-actions{opacity:1}}
.empty{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:28px;border:1px dashed var(--line-dark);border-radius:12px;background:var(--shell-2);color:var(--cream-dim)}
.danger-zone{margin-top:34px;padding-top:16px;border-top:1px solid var(--line-dark);display:flex;gap:8px}

/* ── style page ── */
.controls{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.controls>div{min-width:150px;flex:1 1 40%}
select,input:not([type=range]):not([type=color]):not([type=file]),textarea{width:100%;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:6px;padding:10px 11px;font:inherit;color:var(--cream)}
.modal select,.modal input:not([type=range]):not([type=color]),.modal textarea,.you-card input,.you-card textarea{background:#fff;border-color:var(--line);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--brass)}
input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:2px}
.controls>.span-controls{flex:1 1 100%;min-width:100%}
.surprise-row{margin-top:2px}
.surprise-row .surprise{padding:13px 12px;font-size:14px;border-style:solid;border-color:var(--brass-dim)}
.floor{margin-top:14px;background:none;border:0;border-radius:0;padding:0}
.floor-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--cream-dim);margin-bottom:3px}
.floor-head b{color:var(--brass-dim-t);font-size:13px;font-weight:500}
.floor input[type=range]{width:100%;display:block;height:18px;background:none;-webkit-appearance:none;appearance:none}
.floor input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:6px;background:var(--brass-dim);opacity:.5}
.floor input[type=range]::-moz-range-track{height:3px;border-radius:6px;background:var(--brass-dim);opacity:.5}
.floor input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:var(--brass-dim);border:0}
.floor input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--brass-dim);border:0}
.floor-foot{display:flex;justify-content:space-between;gap:8px;margin-top:2px;font-size:11px;color:var(--steel)}
.floor-foot .warn{color:#D98A6B}
.floor-note{background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:10px 13px;margin:0 0 12px;font-size:13px;color:var(--cream-dim)}
.floor-note .link{margin-left:8px}
.surprise{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--brass-dim);background:transparent;padding:10px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--brass-t)}
.surprise:hover{background:var(--brass);color:#20160D;border-style:solid;box-shadow:var(--glow)}
.indoor-chip{margin-top:6px}
.weather-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-dark);background:var(--shell-2);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--cream);width:100%;text-align:left}
.weather-chip.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.pick-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.brief-line{text-align:center;font-size:13px;color:var(--cream-dim);margin:18px 0 14px;line-height:1.5}
.rings{display:flex;justify-content:center;gap:14px;margin-bottom:16px}
.dot-row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:-6px 0 18px}
.dot-toggle{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:84px;background:none;border:0;padding:0;color:var(--cream);opacity:.6;transition:opacity .25s var(--ease);-webkit-tap-highlight-color:transparent;cursor:pointer}
.dot-toggle.on{opacity:1}
.dot-toggle:disabled{opacity:.25;cursor:default}
.dot-ring{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid rgba(237,229,211,.3);background:rgba(237,229,211,.05);transition:border-color .25s var(--ease),background .25s var(--ease),transform .25s var(--ease)}
.dot-toggle.on .dot-ring{border-color:var(--gold,#B08D5C);background:rgba(176,141,92,.18);box-shadow:0 0 0 3px rgba(176,141,92,.12)}
.dot-toggle:not(:disabled):active .dot-ring{transform:scale(.94)}
.dot-label{font-size:11px;letter-spacing:.02em}
.dot-sub{font-size:11px;text-align:center;line-height:1.2;max-width:84px}
.season-dot select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.season-dot{opacity:1}
.ring{position:relative;width:136px;height:136px;background:none;border:0;padding:0;color:var(--cream);-webkit-tap-highlight-color:transparent}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-beads{fill:none;stroke:var(--brass);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:.1 15.05;transition:stroke .4s var(--ease)}
.ring-ticks{fill:none;stroke:var(--brass-dim);stroke-width:11;stroke-dasharray:1 6.85;opacity:.55}
.ring-core{fill:var(--shell-2);stroke:var(--line-dark);stroke-width:1;transition:fill .4s var(--ease),stroke .4s var(--ease)}
.ring-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.ring-body svg{position:static;width:18px;height:18px;color:var(--brass-t)}
.ring-name{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.1}
.ring-body small{font-size:11px;color:var(--cream-dim);max-width:70px;line-height:1.15;text-align:center}
.ring-body em{font-style:normal;font-size:11px;color:var(--brass-dim-t);letter-spacing:.04em}
.ring.set .ring-core{fill:var(--cream);stroke:var(--cream)}
.ring.set .ring-body{color:var(--ink)}
.ring.set .ring-body svg{color:var(--ink)}
.ring.set .ring-body small{color:#8A6A2E;font-weight:500}
.ring:active .ring-beads{stroke:var(--cream)}

.cover-untagged{margin:-6px 0 14px}
.cover-fields{display:flex;flex-direction:column;gap:10px}
.cf-row{display:flex;flex-direction:column;gap:5px}
.cf-row>span:first-child{font-size:13px;color:var(--steel);font-weight:600}
.banner{cursor:pointer;padding:0;text-align:left;font:inherit;color:inherit;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.banner:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.ps-hero{height:210px;margin:0 22px;border-radius:12px;overflow:hidden}
.ps-hero img{width:100%;height:100%;object-fit:cover;display:block}
.ps-list{margin:14px 22px 0;display:grid;gap:0}
.ps-list>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ps-list dt{font-size:13px;color:var(--steel);margin:0;font-weight:600}
.ps-list dd{margin:0;font-size:13px;color:var(--ink);text-align:right}
.ps-swaps{display:flex;flex-direction:column;gap:7px;padding:12px 22px 0}
.ps-swap{display:flex;align-items:center;gap:11px;background:var(--card-2);border:1px solid transparent;border-radius:12px;padding:9px 11px;text-align:left}
.ps-swap:hover{border-color:var(--brass);background:#fff}
.ps-swap-img{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none}
.ps-swap-img img{width:100%;height:100%;object-fit:cover;display:block}
.ps-swap-body{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.ps-swap-name{font-family:'Bodoni Moda',serif;font-size:17px;color:var(--ink)}
.ps-swap-sub{font-size:11px;color:var(--steel)}
.ps-swap-score{display:flex;flex-direction:column;align-items:flex-end;color:var(--steel)}
.ps-swap-score b{font-size:22px;line-height:1;color:var(--ink)}
.ps-swap-score small{font-size:11px}
.ps-swap-score.up b,.ps-swap-score.up small{color:#3D5C35}
.ps-swap-score.down small{color:var(--warn)}

/* walkthrough */
.tour{position:fixed;inset:0;z-index:120;pointer-events:none}
.tour-shade{position:absolute;background:rgba(18,12,8,.78);pointer-events:auto;touch-action:pan-y;will-change:top,left,width,height}
.tour-ring{position:absolute;border:2px solid var(--brass);border-radius:12px;box-shadow:0 0 0 4px rgba(176,141,82,.25),var(--glow);pointer-events:none;opacity:0;will-change:top,left,width,height}
.tour-cap{position:absolute;left:14px;right:14px;background:var(--card);color:var(--ink);border-radius:12px;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.55);pointer-events:auto;max-width:520px;margin:0 auto;transition:top .35s var(--ease)}
.tour-cap.compact .tour-dots,.tour-cap.compact p,.tour-cap.compact .tour-skips{display:none}
.tour-cap.compact{padding:10px 14px}
.tour-cap.compact h3{font-size:17px;margin:0 0 4px}
.tour-cap.docked::before{display:none}
.tour-cap.below::before,.tour-cap.above::before{content:'';position:absolute;left:28px;border:8px solid transparent}
.tour-cap.below::before{top:-16px;border-bottom-color:var(--card)}
.tour-cap.above::before{bottom:-16px;border-top-color:var(--card)}
.tour-dots{display:flex;gap:5px;margin-bottom:8px}
.tour-dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-dots span.done{background:var(--brass-dim)}
.tour-dots span.on{background:var(--brass);width:18px;border-radius:6px}
.tour-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:130;background:var(--ink);color:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:92vw;pointer-events:none;animation:pageIn .3s var(--ease)}
.tour-pill-dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none}
.tour-skips{margin-left:auto;display:flex;gap:12px}
.tour-skips .link{font-size:13px;color:var(--steel);text-decoration:none;border-bottom:1px solid var(--line)}
.tour-cap h3{font-size:22px;margin:4px 0 6px}
.tour-cap p{margin:0 0 12px;font-size:13px;line-height:1.55;color:#4A4034}
.tour-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tour-gate{font-size:13px;color:var(--steel);display:inline-flex;align-items:center;gap:5px;font-weight:600}
.tour-gate.ok{color:var(--good)}
.tour-skip{margin-left:auto;font-size:13px;color:var(--steel)}
.tour-modal{position:fixed;inset:0;z-index:120;background:rgba(18,12,8,.9);display:flex;align-items:center;justify-content:center;padding:20px;animation:pageIn .5s var(--ease)}
.tour-card{background:var(--card);color:var(--ink);border-radius:12px;padding:28px 26px;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.tour-mark{display:block;font-style:italic;font-size:22px;color:var(--brass-dim-t);margin-bottom:10px}
.tour-card h2{font-size:28px;line-height:1.1;margin:0 0 12px}
.tour-card p{margin:0 0 12px;font-size:14px;line-height:1.6;color:#4A4034}
.tour-card .primary{margin-top:6px}
.tour-card .ghost{color:var(--ink);border-color:rgba(0,0,0,.35)}
.tour-card .ghost:disabled{opacity:.45}
.help-body{padding:12px 22px 22px;display:flex;flex-direction:column;gap:14px}
.help-row b{display:block;font-size:17px;font-weight:400;color:var(--ink);margin-bottom:3px}
.help-row p{margin:0 0 8px;font-size:13px;line-height:1.55;color:#4A4034}

/* search + selection */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:8px 10px;margin-bottom:14px;color:var(--cream-dim)}
.searchbar input{flex:1;background:none;border:0;padding:4px 0;color:var(--cream);font-size:14px}
.searchbar input::placeholder{color:var(--cream-dim)}
.searchbar .icon.on{background:var(--brass);color:#20160D;border-color:var(--brass)}
.sel-mark{position:absolute;left:8px;top:8px;z-index:2;width:28px;height:28px;border-radius:6px;background:rgba(246,241,230,.92);display:flex;align-items:center;justify-content:center;color:var(--steel)}
.sel-mark.on{background:var(--brass);color:#20160D}
.garment.checked{outline:2px solid var(--brass);outline-offset:1px}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:58;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:pageIn .35s var(--ease)}
.selbar-count{font-weight:600;font-size:13px;margin-right:auto}
.selbar .ghost{border-color:var(--line);color:var(--ink);padding:7px 10px}
.selbar .icon{border-color:var(--line);color:var(--ink)}
.undo-bar{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:59;background:var(--ink);color:var(--card);border-radius:999px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:pageIn .3s var(--ease)}
.undo-bar .link{color:var(--brass-t);display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-weight:600}
/* today card */
.today{background:linear-gradient(160deg,#F8F3E8,#EFE7D6);border-radius:12px;padding:16px;margin-bottom:20px;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.45);animation:cardIn .6s var(--ease)}
.today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.today-head h2{font-size:22px;line-height:1.2;margin-top:2px}
.today-head .label{color:var(--brass-dim-t)}
.today-score{font-size:34px;line-height:1;color:var(--brass-dim-t)}
.today-scorebox{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.today-grade{font-size:11px}
.today-why{margin:6px 0 12px;font-size:13px;line-height:1.4;color:var(--ink-soft,#5b4d3f);font-style:italic}
.about-card{margin:0 0 18px;padding:14px 16px;border:1px dashed rgba(176,141,82,.45);border-radius:12px;background:rgba(176,141,82,.06)}
.about-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.about-q{display:block;font-size:22px;margin:6px 0 2px}
.about-why{margin:0 0 10px}
.about-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.about-sub{font-size:13px;opacity:.7;font-weight:600}
.tour-q{display:block;margin:14px 0 6px}
.tour-chips{justify-content:center}
.tour-fork{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.tour-returning{margin:14px 0 0;font-size:13px;color:var(--steel)}
.or-build{display:flex;align-items:center;gap:12px;margin:6px 0 16px;color:var(--cream-dim);font-size:13px;font-weight:600}
.or-build::before,.or-build::after{content:"";flex:1;height:1px;background:rgba(237,229,211,.14)}
.today-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin:12px 0 8px}
.today-ph{aspect-ratio:1;border-radius:12px;overflow:hidden;display:block;min-width:0}
.today-ph img{width:100%;height:100%;object-fit:cover;display:block}
.today-names{margin:0 0 12px;font-size:13px;color:var(--steel)}
.today-actions{display:flex;gap:8px;flex-wrap:wrap}
.today-actions .ghost{border-color:var(--line);color:var(--ink);padding:9px 12px}
.today-actions .primary{padding:9px 14px}

.frontdoor{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--shell-2);border:1px dashed var(--brass-dim);border-radius:12px;padding:16px 18px;margin-bottom:20px;color:var(--brass-t)}
.frontdoor h3{font-size:17px;margin:0 0 3px;color:var(--cream)}
.frontdoor>div{flex:1;min-width:180px}
.frontdoor .primary{flex:none}

/* occasions */
.occasions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.occ{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:10px 4px 9px;color:var(--cream-dim);text-align:center}
.occ svg{color:var(--brass-dim-t);transition:color .4s var(--ease)}
.occ-label{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.1;color:var(--cream)}
.occ-note{display:none;font-size:11px;line-height:1.35}
@media (min-width:560px){.occ{align-items:flex-start;text-align:left;padding:11px 13px;gap:3px}.occ-note{display:block}.occ-label{font-size:17px}}
.occ.on{background:var(--cream);border-color:var(--cream)}
/* On a cream sheet the dark page-style chip reads as "selected" even when it
   isn't. Invert: quiet outline at rest, ink when chosen. */
.modal .occ{background:transparent;border-color:var(--line);color:var(--steel)}
.modal .occ .occ-label{color:var(--ink)}
.modal .occ.on{background:var(--ink);border-color:var(--ink)}
.modal .occ.on .occ-label,.modal .occ.on svg{color:var(--cream)}
.modal .occ.on .occ-note{color:var(--cream-dim)}
.wash-nudge{margin:0 22px 8px;font-size:13px;color:var(--steel)}
.wash-nudge.due{color:var(--brass-dim-t);font-weight:500}
.modal,.sheet{overscroll-behavior:contain}
.occ.on svg,.occ.on .occ-label{color:var(--ink)}
.occ.on .occ-note{color:var(--steel)}
/* crop */
.crop-box{position:relative;width:100%;aspect-ratio:1;background:#2A1E15;border-radius:12px;overflow:hidden;cursor:grab;touch-action:none}
.crop-box img{position:absolute;left:50%;top:50%;max-width:none;height:100%;user-select:none;-webkit-user-drag:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent 33.3%,rgba(255,255,255,.16) 33.3%,rgba(255,255,255,.16) 33.5%,transparent 33.5%,transparent 66.6%,rgba(255,255,255,.16) 66.6%,rgba(255,255,255,.16) 66.8%,transparent 66.8%),
  linear-gradient(to bottom,transparent 33.3%,rgba(255,255,255,.16) 33.3%,rgba(255,255,255,.16) 33.5%,transparent 33.5%,transparent 66.6%,rgba(255,255,255,.16) 66.6%,rgba(255,255,255,.16) 66.8%,transparent 66.8%)}
.crop-zoom{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--steel)}
.dupe{display:flex;align-items:flex-start;gap:6px;margin:6px 0 0;font-size:13px;color:#8A6A1F}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.cal-dow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--cream-dim);text-align:center;padding-bottom:2px}
.cal-day{position:relative;aspect-ratio:1;border-radius:6px;border:1px solid var(--line-dark);background:var(--shell-2);color:var(--cream-dim);font-size:11px;overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center}
.cal-day img{width:100%;height:100%;object-fit:cover}
.cal-day.has{border-color:var(--brass-dim)}
.cal-day.on{outline:2px solid var(--brass);outline-offset:1px}
.cal-day.today{border-color:var(--brass);color:var(--cream)}
.cal-day.today .cal-num{font-weight:600}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:420px;margin-bottom:10px}
.cal-range{font-size:14px;color:var(--cream)}
.cal-day:disabled{opacity:.45}
.wear-row-tall{flex-direction:column;align-items:stretch;gap:8px}
.look-group{margin-bottom:10px}
.cap-wrap{display:flex;flex-direction:column}
.cap-wrap.open .cap-row{border-bottom-left-radius:0;border-bottom-right-radius:0;border-color:var(--brass-dim)}
.cap-fix{background:var(--card);color:var(--ink);border:1px solid var(--brass-dim);border-top:0;border-radius:0 0 12px 12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.cap-fix .label{margin-bottom:2px}
.cap-fix .ghost{align-self:flex-start;border-color:var(--line);color:var(--ink)}
.look-group-body{padding:2px 10px 12px}
.wear-row-top{display:flex;align-items:center;gap:10px}
.wear-row-actions{display:flex;gap:8px;flex-wrap:wrap}
.wear-rating{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--card-2);color:var(--ink)}
.wear-score{font-size:28px;line-height:1;color:var(--brass-dim-t);min-width:44px}
.reasons.compact{border-top:0;padding-top:0}
.reasons.compact p{margin:2px 0;font-size:13px}
.wear-note{padding:10px 12px;border-radius:12px;background:var(--card-2);color:var(--ink);font-size:14px;line-height:1.45}
.wear-note p{margin:0 0 8px}.wear-note p:last-child{margin:0}
.wear-row .read-err{margin:0}
.wear-item.wear-item{cursor:default}
/* the log sheet */
.log-sheet{display:flex;flex-direction:column;overflow:hidden}
.log-rings{justify-content:center;margin:2px 0 14px}
.log-sheet .ring.set .ring-core{fill:var(--ink);stroke:var(--ink)}
.log-sheet .ring.set .ring-body{color:var(--cream)}
.log-sheet .ring.set .ring-body svg{color:var(--brass-t)}
.log-sheet .ring.set .ring-body small{color:var(--brass-t);font-weight:500}
.log-sheet .modal-head{flex:none}
.log-sheet .modal-foot{flex:none;border-top:1px solid var(--line)}
.log-body{padding:0 22px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.log-photo{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.log-photo img{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.log-tile{position:relative;overflow:hidden;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);color:var(--ink);cursor:pointer;padding:0}
.log-tile span{font-size:11px;letter-spacing:.02em;color:var(--steel)}
.log-tile:disabled{opacity:.55}
.log-tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.log-thumb{padding:0;border:0;background:none;cursor:zoom-in;line-height:0}
.log-readline{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-dim-t);margin:-4px 0 10px}
.log-viewer{position:fixed;inset:0;background:rgba(18,12,8,.94);display:flex;align-items:center;justify-content:center;z-index:90;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.log-viewer img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
.log-viewer .icon{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.12);color:var(--cream)}
.log-picked{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.log-picked .wear-item{cursor:pointer;border:1px solid var(--line)}
.log-search{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin:0 0 10px}
.log-groups{padding-bottom:8px}
.log-group{margin-bottom:8px}
.log-drawer{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left;cursor:pointer;color:var(--ink)}
.log-drawer .log-group-title{font-size:13px;color:var(--steel);margin:0;flex:none;font-weight:600}
.log-drawer .log-strip{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden}
.log-drawer .log-strip>span{width:26px;height:26px;border-radius:6px;overflow:hidden;flex:none;border:1px solid var(--line)}
.log-drawer .log-strip img,.log-drawer .log-strip .log-swatch{width:100%;height:100%;object-fit:cover;display:block;border-radius:0;aspect-ratio:auto}
.log-drawer .log-count{font-size:11px;color:var(--steel);flex:none}
.log-drawer .log-picked-n{font-size:11px;color:var(--brass-dim-t);font-weight:500;flex:none}
.log-drawer .shelf-chev{color:var(--steel)}
.log-group.shut .shelf-chev{transform:rotate(-90deg)}
.log-group .log-grid{margin:0 0 6px}
.log-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.log-cell{display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:6px;border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);text-align:left;min-width:0}
.log-cell img,.log-swatch{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.log-name{font-size:11px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.log-cell.on{border-color:var(--ink);background:var(--ink);color:var(--cream)}
/* style this piece */
/* piece-sheet footer: four tiles that always fit a phone width */
.modal-foot.piece-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;justify-content:stretch}
.foot-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;min-height:60px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:11px;letter-spacing:.01em;cursor:pointer;min-width:0}
.foot-tile span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.foot-tile.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.foot-tile.primary{background:var(--brass);border-color:var(--brass);color:#20160D;font-weight:600}
.idea-sheet{display:flex;flex-direction:column;overflow:hidden}
.idea-sheet .modal-head{flex:none;align-items:flex-start}
.idea-title{display:flex;gap:12px;align-items:center;min-width:0}
.idea-piece{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line);display:block}
.idea-tabs{flex:none;display:flex;gap:0;padding:0 22px;border-bottom:1px solid var(--line)}
.idea-tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px 12px;font-size:13px;color:var(--steel);cursor:pointer;margin-bottom:-1px}
.idea-tab.on{color:var(--ink);border-bottom-color:var(--brass);font-weight:500}
.idea-body{padding:14px 22px 22px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.idea-body .label{margin-top:14px}
.idea-cost{font-size:11px;letter-spacing:.06em;color:var(--brass-dim-t);white-space:nowrap}
.idea-prompt{width:100%;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.4;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);resize:vertical;margin:0 0 10px}
.idea-brief{padding:10px 12px;border-radius:12px;background:var(--card-2);margin:0 0 12px;font-size:13px;line-height:1.45}
.idea-brief p{margin:0}.idea-brief p+p{margin-top:6px}
.idea-settings{font-size:13px;color:var(--brass-dim-t);font-weight:600}
.idea-results{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.idea-look{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.idea-score{grid-row:1/3;font-size:28px;line-height:1;color:var(--brass-dim-t)}
.idea-names{font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.idea-thumbs{display:flex;gap:4px}
.idea-thumbs img,.idea-thumbs .idea-swatch{width:22px;height:22px;border-radius:6px;object-fit:cover;display:block;border:1px solid var(--line)}
.idea-empty{padding:10px 12px;border-radius:12px;background:var(--card-2);color:var(--steel);font-size:13px;margin-top:12px}
.idea-tips{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.idea-tip{padding:10px 12px;border-radius:12px;background:var(--card-2);font-size:13px;line-height:1.45}
.idea-tip strong{font-weight:500;display:flex;align-items:baseline;gap:8px;margin-bottom:4px;color:var(--ink)}
.idea-num{font-size:11px;color:var(--brass-dim-t);letter-spacing:.06em}
.idea-tip p{margin:0;color:#4A4034}
.idea-wear{font-weight:500;color:var(--ink)!important}
.idea-why{font-size:13px;color:var(--steel)!important;margin-top:3px!important}
.idea-srclabel{font-size:13px;color:var(--steel);margin:10px 0 4px;font-weight:600}
.idea-more{margin-top:10px}
.idea-more summary{font-size:13px;color:var(--steel);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:6px 0}
.idea-more summary::before{content:'';width:6px;height:6px;border-right:1px solid var(--steel);border-bottom:1px solid var(--steel);transform:rotate(-45deg);transition:transform .2s;flex:none}
.idea-more[open] summary::before{transform:rotate(45deg)}
.idea-more summary .mono{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass-dim-t)}
/* the running stitch */
.thread{margin:16px 0 8px;height:38px;color:#A1855F}
.thread svg{display:block;width:100%;height:38px}
.modal .thread,.card-ui .thread,.today .thread{color:#9A7A52}
.idea-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.idea-sources a{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--brass-dim-t);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff}
/* price tiers: one row, always — compact pills that fit a phone */
.idea-sources.tiers{flex-wrap:nowrap;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.idea-sources.tiers::-webkit-scrollbar{display:none}
.idea-sources.tiers a{font-size:11px;padding:3px 9px;flex:none;letter-spacing:.01em}
.idea-missing{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.idea-missing-row{display:flex;flex-direction:column;gap:4px}
.idea-missing-name{font-size:13px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.idea-dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex:none}
.idea-gain.up{color:var(--good)}.idea-gain.down{color:var(--warn)}
.idea-gain{font-size:11px;letter-spacing:.06em;color:var(--brass-dim-t);font-weight:400;margin-left:2px}
.idea-upload{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.idea-upload .ghost{position:relative;overflow:hidden}
.idea-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.idea-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0 12px}
.idea-img{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card-2);aspect-ratio:3/4;cursor:pointer}
.idea-img img{width:100%;height:100%;object-fit:cover;display:block}
.idea-grid.looks{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* a lookbook, not a results list: the photograph is the whole tile */
.idea-img.tall{aspect-ratio:3/4;border-color:transparent;background:var(--card-2)}
.idea-img.tall img{width:100%;height:100%;object-fit:cover;display:block}
.garment-actions .icon.idea{color:var(--brass-dim-t)}
.log-take,.wear-take{padding:8px 12px;border-radius:12px;background:var(--card-2);margin:0 0 12px;font-size:13px;line-height:1.4}
.wear-take{margin:0}
.log-take p,.wear-take p{margin:0;padding-left:14px;position:relative;color:var(--ink)}
.log-take p+p,.wear-take p+p{margin-top:4px}
.log-take p::before,.wear-take p::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.log-take p.soft::before,.wear-take p.soft::before{background:var(--steel)}
.log-take p.soft,.wear-take p.soft{color:var(--steel)}
.wear-take p.mine{color:var(--ink);font-style:italic}.wear-take p.mine::before{background:var(--brass-dim)}
.log-live{flex:none;display:flex;align-items:center;gap:14px;padding:10px 22px;border-top:1px solid var(--line);background:var(--card-2)}
.log-live-score{font-size:28px;line-height:1;color:var(--brass-dim-t);min-width:46px}
.log-live-lines p{margin:0;font-size:13px;line-height:1.35;color:var(--ink)}
.log-live-lines p.soft{color:var(--steel)}
.cal-badge{position:absolute;right:3px;bottom:3px;background:var(--brass);color:#20160D;font-size:11px;border-radius:6px;padding:0 4px}
/* packing + trial */
.pack-controls{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.pack-out{margin-top:20px}
.pack-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:14px;text-align:center;font-size:11px;color:var(--cream-dim)}
.pack-stat b{display:block;font-size:28px;color:var(--brass-t);line-height:1.1;margin-bottom:2px}
.pack-stat .up b{color:#8FBF7A}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.pack-item{display:flex;flex-direction:column;gap:5px}
.pack-img{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden}
.pack-img img{width:100%;height:100%;object-fit:cover;display:block}
.pack-name{font-size:11px;color:var(--cream-dim);line-height:1.3}
.pack-days{display:flex;flex-direction:column;gap:7px}
.pack-day{display:flex;align-items:baseline;gap:10px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:10px 12px}
.pack-daynum{font-size:11px;letter-spacing:.1em;color:var(--brass-dim-t);min-width:44px}
.pack-daylist{flex:1;font-size:13px;color:var(--cream)}
.pack-dayscore{font-size:11px;color:var(--cream-dim)}
.trial-grid{display:grid;grid-template-columns:1fr;gap:12px}
.trial-out{margin-top:18px}

/* picker drawers */
.pinned-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pinned-row .pinned{display:inline-flex;align-items:center;gap:8px;background:var(--cream);color:var(--ink);border:0;padding:7px 11px 7px 7px;border-radius:999px;font-size:13px;font-weight:500}
.pinned-row .pinned img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.pinned-row .pinned.away{background:var(--card-2);color:var(--steel);text-decoration:line-through}
.drawers{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.drawer{border:1px solid var(--line-dark);border-radius:12px;overflow:hidden;background:var(--shell-2);transition:border-color .4s var(--ease)}
.drawer.open{border-color:var(--brass-dim)}
.drawer-head{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:13px 14px;color:var(--cream);text-align:left}
.drawer-name{font-family:'Bodoni Moda',serif;font-size:17px;flex:1}
.drawer-meta{font-size:11px;color:var(--cream-dim)}
.drawer-chev{display:flex;color:var(--cream-dim);transform:rotate(-90deg);transition:transform .45s var(--ease)}
.drawer.open .drawer-chev{transform:rotate(90deg);color:var(--brass-t)}
@keyframes drawerIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.drawer-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;padding:2px 12px 14px;animation:drawerIn .4s var(--ease)}
.ptile{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--cream)}
.ptile-img{position:relative;display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1.5px solid transparent;transition:all .4s var(--ease)}
.ptile-img img{width:100%;height:100%;object-fit:cover;display:block}
.ptile.on .ptile-img{border-color:var(--brass);box-shadow:0 0 0 3px rgba(176,141,82,.25)}
.ptile-check{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--brass);color:#20160D;display:flex;align-items:center;justify-content:center}
.ptile-name{font-size:11px;line-height:1.25;color:var(--cream-dim)}
.ptile.on .ptile-name{color:var(--cream)}
/* shelves */
.shelf-title{width:100%;background:none;border:0;text-align:left;padding:0;cursor:pointer}
.shelf-strip{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;margin:0 8px}
.shelf-strip>span{width:30px;height:30px;border-radius:6px;overflow:hidden;flex:none;border:1px solid var(--line-dark)}
.shelf-strip img{width:100%;height:100%;object-fit:cover;display:block}
.shelf-more{width:auto !important;border:0 !important;font-size:11px;color:var(--cream-dim);padding-left:2px}
.shelf-chev{display:inline-flex;color:var(--cream-dim);transform:rotate(90deg);transition:transform .45s var(--ease)}
.shelf.shut .shelf-chev{transform:rotate(-90deg)}
.shelf.shut .shelf-title{opacity:.72}
.closet-tools{display:flex;gap:8px;margin-top:22px}

/* ── the deck ── */
@keyframes deckIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes deckOut{to{opacity:0;transform:translateY(60px) scale(.96)}}
.deck{position:fixed;inset:0;z-index:70;backdrop-filter:blur(10px);display:flex;flex-direction:column;transition:background .3s linear}
.deck-inner{flex:1;display:flex;flex-direction:column;min-height:0;animation:deckIn .5s var(--ease)}
.deck.closing .deck-inner{animation:deckOut .26s var(--ease) forwards}
.deck-grab{display:flex;justify-content:center;padding:10px 0 2px}
.deck-grab span{width:42px;height:4px;border-radius:6px;background:var(--line-dark)}
.deck-card{transition:opacity .45s var(--ease),transform .45s var(--ease)}
.deck-tip{text-align:center;color:var(--cream-dim);font-size:11px;margin:0 0 calc(10px + env(safe-area-inset-bottom))}
.deck-top{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px}
.deck-close{background:none;border:0;color:var(--cream);display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:6px 8px}
.deck-count{color:var(--cream-dim);font-size:11px}
.deck-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.deck-track::-webkit-scrollbar{display:none}
.deck-slide{flex:0 0 100%;scroll-snap-align:center;padding:6px 14px 10px;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.deck-card{margin:auto 0;width:100%;max-width:560px;align-self:center}
.deck-dots{display:flex;justify-content:center;gap:7px;padding:8px 0 6px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-dark);border:0;padding:0;transition:all .4s var(--ease)}
.dot.on{background:var(--brass);width:20px;border-radius:6px}

/* ── outfit ticket (cream card) ── */
.tickets{display:flex;flex-direction:column;gap:16px}
.ticket{background:var(--card);border:1px solid rgba(0,0,0,.25);border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.tk-head{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px 10px}
.tk-title{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;gap:10px}
.tk-num{margin-left:10px;font-family:'Bodoni Moda',serif;font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1}
.tk-rank{display:flex;align-items:center;gap:10px}
.tk-rank .label{margin:0}
.tk-stretch{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#8A6A2E;background:rgba(201,164,92,.16);border:1px solid rgba(201,164,92,.45);border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.today-stretch-row{margin:8px 0 0}
.today-stretch{margin:0;display:inline-flex;max-width:100%;white-space:normal;line-height:1.3}
.try-this{margin-bottom:6px}
.try-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.try-head .tk-stretch{margin:0}
.try-names{margin:0;font-size:13px;color:var(--cream);line-height:1.5}
.try-names b{font-size:22px;margin-right:10px;color:var(--brass-t)}
.tk-grade{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid}
.g-top{color:#3D5C35;border-color:#3D5C35;background:#E8EFE2}
.g-strong{color:var(--brass-dim-t);border-color:var(--brass-dim);background:#F1E9D6}
.g-solid{color:var(--steel);border-color:var(--line);background:var(--card-2)}
.g-ok{color:#8A6A1F;border-color:#C9A961;background:#F5EDD8}
.g-weak{color:var(--warn);border-color:#D9A28B;background:#F6E3D9}
.tk-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-right .tk-grade{margin-right:auto}
.tk-right .icon{width:34px;height:34px}
.tk-score{display:flex;align-items:baseline;gap:5px}
.tk-score .display{font-size:34px;line-height:1;color:var(--ink)}
.tk-hero{position:relative;margin:0 16px 12px;border-radius:12px;overflow:hidden;max-height:300px}
.tk-hero img{width:100%;height:100%;max-height:300px;object-fit:cover;display:block}
.tk-hero-swap{position:absolute;right:8px;bottom:8px;background:rgba(246,241,230,.92)}
.tk-addphoto{display:inline-flex;align-items:center;gap:8px;margin:0 16px 12px;background:var(--card-2);border:1px dashed var(--line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--steel)}
.wear-shot{width:38px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.tk-tips{margin:0 16px 12px;background:var(--card-2);border-left:2px solid var(--brass);border-radius:0 12px 12px 0;padding:10px 12px}
.tk-tips .label{margin-bottom:5px}
.tk-tips p{margin:0 0 4px;font-size:13px;line-height:1.5;color:var(--ink)}
.tk-tips p:last-child{margin-bottom:0}
.tk-banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:0 16px 12px}
.banner{position:relative;display:flex;flex-direction:column;align-items:stretch;width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;padding:0;margin:0;appearance:none}
.banner.pinned{border-color:#8A6E42;background:#2A1E15;overflow:visible;margin-top:7px}
.banner.pinned .banner.pinned .banner-meta{background:linear-gradient(180deg,#2E2118,#241A12)}
.banner.pinned .banner-cat{color:#A88A55}
.banner.pinned .banner-name{color:#D8B778}
.banner.pinned .banner-sub{color:#A6987F}
.banner-img{position:relative;width:100%;height:84px;flex:none;overflow:hidden;background:inherit}
.banner-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.banner-pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;background:#B08D52;color:#20160D;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.banner-meta{padding:8px 9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.banner-cat{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.banner-name{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.22;color:var(--ink);overflow-wrap:break-word;hyphens:manual}
.banner-sub{font-size:11px;color:var(--steel)}
.tk-strip{display:flex;align-items:center;gap:10px;padding:0 16px 12px}
.tk-similar-row{padding:0 16px 12px}
.ps-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:6px 0 10px;padding:9px;border:0;border-top:1px solid var(--line);background:none;color:var(--brass-dim-t);font-size:13px;font-weight:600}
.ps-more svg{transition:transform .25s var(--ease)}
.tk-similar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--brass-dim);border-radius:12px;background:none;color:var(--ink);font-size:13px;font-weight:500}
.tk-similar .hint{font-weight:400;font-size:11px;color:var(--steel)}
.tk-strip>span:not(.tk-harmony){flex:1;height:7px;border-radius:6px}
.tk-harmony{flex:none;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--brass-dim-t);border:1px solid var(--brass-dim);padding:3px 8px;border-radius:6px}
.tk-tuck-row{padding:0 14px 10px}
.tk-tuck{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.tk-tuck.on{border-style:solid;border-color:var(--brass);opacity:1;color:var(--brass-t)}
.tk-toggle{width:100%;background:var(--card-2);border:0;border-top:1px solid var(--line);padding:12px;font:inherit;font-size:14px;color:var(--ink)}
.tk-toggle:hover{color:var(--ink)}
.tk-body{padding:14px 16px 16px;display:grid;grid-template-columns:1fr;gap:14px;border-top:1px solid var(--line)}
.tk-wheel{display:flex;justify-content:center}
.wheel circle[fill="var(--paper)"]{fill:var(--card)}
.tk-bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:88px 1fr 26px;align-items:center;gap:8px}
.bar-label{font-size:11px;color:var(--steel)}
.bar-track{height:5px;background:var(--card-2);border-radius:6px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--brass);border-radius:6px;transition:width .8s var(--ease)}
.bar-num{font-size:11px;color:var(--steel);text-align:right}
.reasons{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.reasons p{margin:0;font-size:13px;padding-left:14px;position:relative;color:var(--ink)}
.reasons p::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.reasons p.warn{color:var(--warn)}
.reasons p.warn::before{background:var(--warn)}

/* ── looks page ── */
.wear-list{display:flex;flex-direction:column;gap:8px}
.wear-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.wear-date{font-size:11px;color:var(--steel);min-width:86px}
.wear-occ{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--cream);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.wear-items{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.wear-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--card-2);padding:3px 8px 3px 4px;border-radius:999px;color:var(--ink)}
.wear-item img{width:18px;height:18px;border-radius:50%;object-fit:cover}

/* ── insights ── */
.tabs{display:flex;gap:0;justify-content:space-between;border-bottom:1px solid var(--line-dark);margin-bottom:18px;overflow-x:auto}
.tabs.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.tabs.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px);mask-image:linear-gradient(90deg,transparent,#000 44px)}
.tabs.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 6px;font-size:14px;color:var(--cream-dim);white-space:nowrap}
.tab.on{color:var(--brass-t);border-bottom-color:var(--brass);font-weight:500}
.gap-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.read-ok{margin:2px 0 0;font-size:13px;color:var(--good)}
.read-err{margin:2px 0 0;font-size:13px;color:var(--warn)}
.colour-editor{display:flex;flex-direction:column;gap:10px}
.frag-line{margin:0 16px 12px;padding:10px 12px;border:1px solid rgba(176,141,92,.35);border-radius:12px;background:rgba(176,141,92,.06)}
.frag-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.frag-k{font-size:11px;letter-spacing:.14em;color:var(--gold,#B08D5C)}
.frag-name{font-family:'Bodoni Moda',Didot,serif;font-size:17px}
.frag-meta{font-size:11px;opacity:.7}
.frag-why{margin:6px 0 0;font-size:13px;line-height:1.35;opacity:.85}
.frag-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.frag-list li button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:rgba(0,0,0,.12);border:1px solid transparent;border-radius:12px;padding:8px 10px;color:inherit;cursor:pointer}
.frag-list li.on button{border-color:var(--gold,#B08D5C)}
.frag-list .frag-name{font-size:14px}
.match-empty{padding:18px 0 22px}
.wear-block{margin:14px 0 18px}
.wear-block h2{font-size:17px;margin:0 0 8px}
/* 22 Sep: these four were .wear-row/.wear-note/.wear-occ/.wear-occ-pieces — the same
   names the calendar already used. The later rules won: the day card lost its cream,
   the WORK chip became a padding-less pill, and the stylist's reply picked up
   white-space:nowrap (the unwrapped grey bar). Insights gets its own prefix. */
.ww-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}

.wear-sw img{width:100%;height:100%;object-fit:cover;display:block}
.wear-name{flex:1;font-size:14px}
.ww-note{font-size:11px;opacity:.7;white-space:nowrap}
.ww-occ{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.ww-occ-pieces{font-size:13px;line-height:1.45;opacity:.9}
.garment-menu{position:absolute;right:8px;bottom:44px;z-index:5;display:flex;flex-direction:column;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.35);overflow:hidden}

.tag-pill{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(176,141,82,.14);color:var(--brass-dim-t);letter-spacing:.02em}
.chip.tag-chip.off{text-decoration:line-through;opacity:.55}
.floor-note.calm{color:var(--cream-dim)}
.chip .chip-sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.frag-editor{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:8px 22px}
.frag-editor>*{min-width:0}

.frag-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.frag-presets{padding:0 22px;margin:0 0 10px}
.frag-shelf .frag-tile{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(176,141,92,.35),rgba(30,21,16,.6))}
.frag-glyph{font-size:34px;color:var(--cream,#EDE5D3);opacity:.9}
.frag-card{position:relative;background:var(--card);border:1px solid rgba(0,0,0,.25);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);padding:0;text-align:left;color:inherit;font:inherit;width:100%}
.frag-x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);color:#EDE5D3;border:0;display:flex;align-items:center;justify-content:center}
.frag-add{border-style:dashed;opacity:.85}
.frag-chip-sw{background:rgba(176,141,92,.5)}
.frag-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(237,229,211,.08)}

.colours-row{display:flex;flex-direction:column;gap:6px;margin-top:8px}

.colour-dot{position:relative;display:inline-flex;align-items:center}
.colour-dot .dot{width:26px;height:26px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);cursor:pointer}
.colour-dot.primary .dot{box-shadow:0 0 0 2px var(--bg,#1E1510),0 0 0 4px var(--gold,#B08D5C)}
.colour-dot input[type=color]{position:absolute;inset:0;opacity:0;width:26px;height:26px;cursor:pointer}
.dot-x{width:16px;height:16px;border-radius:50%;border:0;font-size:11px;line-height:16px;padding:0;margin-left:2px;background:rgba(0,0,0,.35);color:#EDE5D3;cursor:pointer}

.presets{display:flex;gap:6px;flex-wrap:wrap}

.preset-sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.preset.on .preset-sw{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brass)}
.preset-name{font-size:11px;letter-spacing:.02em;opacity:.75;line-height:1}
.preset.on-legacy{outline:2px solid var(--brass);outline-offset:2px}
.hsl{display:grid;gap:6px}
.hsl label{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--steel)}
input[type=range].hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);height:8px;border-radius:6px;-webkit-appearance:none;appearance:none}
input[type=range].hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.usage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 10px;text-align:center}
.usage>div{background:var(--card-2);border-radius:12px;padding:12px 8px}
.usage-num{font-size:28px;color:var(--ink);display:block;line-height:1.1}

.loc-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-bottom:10px}
.diag{margin-top:10px;font-size:11px;line-height:1.5;background:var(--card-2);border-radius:12px;padding:8px 10px;word-break:break-word;color:var(--ink)}

/* ── modals ── */
.modal-back{position:fixed;inset:0;z-index:140;background:rgba(18,12,8,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));animation:pageIn .35s var(--ease)}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:620px;max-height:calc(100vh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.modal.small{max-width:400px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 10px}
.modal-head h2{font-size:28px;color:var(--ink)}
.form-grid{padding:8px 22px;display:grid;grid-template-columns:1fr;gap:16px}
.span2{grid-column:span 1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 22px}
.modal .ghost{border-color:var(--line);color:var(--ink)}
.modal p{color:#4A4034}

/* ── bottom nav ── */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:flex-end;justify-content:space-around;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(24,15,10,.82),rgba(22,14,9,.98) 45%);backdrop-filter:blur(18px);border-top:1px solid var(--line-dark)}
.bottomnav::before{content:'';position:absolute;top:-1px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(138,110,66,.75) 26%,rgba(138,110,66,.1) 38%,transparent 44%,transparent 56%,rgba(138,110,66,.1) 62%,rgba(138,110,66,.75) 74%,transparent);opacity:.85}
.tabbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--cream-dim);font-size:11px;letter-spacing:.03em;padding:6px 10px;border-radius:12px;min-width:58px}
.tabbtn.on{color:var(--brass-t)}
.tabbtn.on svg{filter:drop-shadow(0 0 8px rgba(255,186,110,.45))}
.style-fab{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--cream-dim);font-size:0;padding:0;margin-top:-26px;z-index:2}
.style-fab-ring{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#4A3524,#241809 78%);border:1.5px solid var(--brass-dim);display:flex;align-items:center;justify-content:center;color:var(--brass-t);box-shadow:0 0 0 5px rgba(24,15,10,.92),0 10px 26px rgba(0,0,0,.55),var(--glow);transition:transform .5s var(--ease),background .5s var(--ease),box-shadow .5s var(--ease)}
.style-fab-label{font-size:11px;letter-spacing:.06em;color:var(--cream-dim)}
.style-fab.on .style-fab-ring{background:radial-gradient(circle at 32% 26%,#D6AE6C,var(--brass) 80%);color:#20160D;border-color:#D8B778;box-shadow:0 0 0 5px rgba(24,15,10,.92),0 10px 28px rgba(0,0,0,.5),0 0 34px rgba(255,186,110,.4)}
.style-fab.on .style-fab-label{color:var(--brass-t)}
.style-fab:active .style-fab-ring{transform:scale(.93)}

/* misc */
.ai-wait{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:13px;z-index:150;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13px;z-index:75;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pageIn .4s var(--ease);max-width:88vw;text-align:center}
.backup-bar{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:55;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.backup-nudge{display:flex;align-items:center;gap:10px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--cream-dim)}

.storage-warn{background:#3A241A;border:1px solid #5C3826;color:#EFC3AC;padding:12px 14px;border-radius:12px;margin-bottom:18px;font-size:13px;line-height:1.5}
.storage-warn .link{color:#F3D3BF;margin-left:6px;font-weight:600}
.gap-buy+.gap-link{margin-top:8px}
.clear-facets{align-self:flex-start;font-size:13px}

@media (min-width:560px){.trial-grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:760px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .you-grid{grid-template-columns:1fr 1fr}
  .you-card.span{grid-column:span 2}
  .you-fields{grid-template-columns:1fr 1fr}
  .tk-body{grid-template-columns:1fr 132px}

}
@media (hover:none) and (pointer:coarse){
  input:not([type=range]):not([type=color]):not([type=file]),select,textarea{font-size:17px !important}

}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

.tg-starts{margin:0 0 10px}
.tg-brief{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tg-pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:2px 8px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:11px 14px;color:var(--cream);text-align:left}
.tg-pick .label{grid-column:1/-1;margin:0}
.tg-val{font-size:22px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-pick svg{color:var(--brass-t);margin-bottom:7px}
.tg-toggles{margin-bottom:12px}
.tg-toggles .chip:disabled{opacity:.5}
.tg-around{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px dashed var(--line-dark);border-radius:12px;padding:12px 14px;color:var(--cream);text-align:left;margin-bottom:16px}
.tg-around-body{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-around-body b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.tg-around-body small{font-size:13px;color:var(--cream-dim)}
.tg-around svg{color:var(--brass-t);flex:none}
.tg-none{margin-bottom:18px}
.tg-dealt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.tg-dealt h2{font-size:22px;font-style:italic;color:var(--cream)}
.tg-tap{margin:0 0 14px}
.pair-card{background:linear-gradient(160deg,#F8F3E8,#EFE7D6);border-radius:12px;padding:16px;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pair-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pair-scorebox{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.pair-score{font-size:34px;line-height:1;color:var(--brass-dim-t)}
.pair-cap{font-size:13px;color:var(--steel)}
.pair-card .icon{width:34px;height:34px;border-color:var(--line);color:var(--ink)}
.pair-sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair-side{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);text-align:left}
.pair-who{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px}
.pair-who b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair-who .mono{font-size:11px;color:var(--steel)}
.pair-strip{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair-ph{aspect-ratio:1;border-radius:6px;overflow:hidden;display:block;min-width:0;border:1px solid rgba(36,27,18,.08)}
.pair-ph img{width:100%;height:100%;object-fit:cover;display:block}
.pair-names{font-size:13px;line-height:1.4;color:var(--steel)}
.pair-side.gone{justify-content:center}
.pair-why{margin:12px 0 0;font-size:13px;line-height:1.4;color:var(--ink)}
.pair-caution{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--warn)}
.pair-pick-group{margin-bottom:14px}
.pair-pick-list{display:flex;flex-wrap:wrap;gap:8px}
.pair-pick{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink);text-align:left}
.pair-pick.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.pair-pick span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 16px 0;padding:10px 14px;border:1px solid var(--line-dark);border-radius:12px;background:var(--shell-2);font-size:13px;color:var(--cream-dim)}
</style>
</head>
