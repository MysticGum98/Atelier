.banner{position:relative;display:flex;flex-direction:column;align-items:stretch;width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;padding:0;margin:0;appearance:none}
.banner.pinned{border-color:#8A6E42;background:#2A1E15;overflow:visible;margin-top:7px}
.banner.pinned .banner.pinned .banner-meta{background:linear-gradient(180deg,#2E2118,#241A12)}
.banner.pinned .banner-cat{color:#A88A55}
.banner.pinned .banner-name{color:#D8B778}
.banner.pinned .banner-sub{color:#A6987F}
.banner-img{position:relative;width:100%;height:84px;flex:none;overflow:hidden;background:inherit}
.banner-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.banner-pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;background:#B08D52;color:#20160D;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:var(--track-wide);text-transform:uppercase;
  padding:3px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.banner-meta{padding:8px 9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.banner-cat{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--steel)}
.banner-name{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.22;color:var(--ink);overflow-wrap:break-word;hyphens:manual}
.banner-sub{font-size:11px;color:var(--steel)}
.tk-strip{display:flex;align-items:center;gap:10px;padding:0 var(--s4) var(--s3)}
.tk-similar-row{padding:0 var(--s4) var(--s3)}
.ps-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:6px 0 10px;padding:9px;border:0;border-top:1px solid var(--line);background:none;color:var(--brass-dim-t);font-size:13px;font-weight:600}
.ps-more svg{transition:transform var(--fast) var(--ease)}
.tk-similar{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;padding:10px 12px;border:1px solid var(--brass-dim);border-radius:12px;background:none;color:var(--ink);font-size:13px;font-weight:500}
.tk-similar .hint{font-weight:400;font-size:11px;color:var(--steel)}
.tk-strip>span:not(.tk-harmony){flex:1;height:7px;border-radius:6px}
.tk-harmony{flex:none;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:var(--track);color:var(--brass-dim-t);border:1px solid var(--brass-dim);padding:3px 8px;border-radius:6px}
.tk-tuck-row{padding:0 14px 10px}
.tk-tuck{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.tk-tuck.on{border-style:solid;border-color:var(--brass);opacity:1;color:var(--brass-t)}
.tk-toggle{width:100%;background:var(--card-2);border:0;border-top:1px solid var(--line);padding:var(--s3);font:inherit;font-size:14px;color:var(--ink)}
.tk-toggle:hover{color:var(--ink)}
.tk-body{padding:14px 16px 16px;display:grid;grid-template-columns:1fr;gap:14px;border-top:1px solid var(--line)}
.tk-wheel{display:flex;justify-content:center}
.wheel circle[fill="var(--paper)"]{fill:var(--card)}
.tk-bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:88px 1fr 26px;align-items:center;gap:var(--s2)}
.bar-label{font-size:11px;color:var(--steel)}
.bar-track{height:5px;background:var(--card-2);border-radius:6px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--brass);border-radius:6px;transition:width var(--slow) var(--ease)}
.bar-num{font-size:11px;color:var(--steel);text-align:right}
.reasons{border-top:1px solid var(--line);padding-top:var(--s3);display:grid;gap:6px}
.reasons p{margin:0;font-size:13px;padding-left:14px;position:relative;color:var(--ink)}
.reasons p::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.reasons p.warn{color:var(--warn)}
.reasons p.warn::before{background:var(--warn)}

/* ── looks page ── */
.wear-list{display:flex;flex-direction:column;gap:var(--s2)}
.wear-row{display:flex;align-items:center;gap:var(--s3);background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-lift)}
.wear-date{font-size:11px;color:var(--steel);min-width:86px}
.wear-occ{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--cream);font-weight:500;font-size:11px;letter-spacing:var(--track);text-transform:uppercase}
.wear-items{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.wear-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--card-2);padding:3px 8px 3px 4px;border-radius:999px;color:var(--ink)}
.wear-item img{width:18px;height:18px;border-radius:50%;object-fit:cover}

/* ── insights ── */
.tabs{display:flex;gap:0;justify-content:space-between;border-bottom:1px solid var(--line-dark);margin-bottom:18px;overflow-x:auto}
.tabs.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.tabs.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px);mask-image:linear-gradient(90deg,transparent,#000 44px)}
.tabs.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 6px;font-size:14px;color:var(--cream-dim);white-space:nowrap}
.tab.on{color:var(--brass-t);border-bottom-color:var(--brass);font-weight:500}
.gap-list{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.gap{background:var(--card);border-left:3px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow-card);display:flex;flex-direction:column}
.gap.sev-high{border-left-color:var(--warn)}.gap.sev-med{border-left-color:var(--brass)}.gap.sev-low{border-left-color:var(--line)}
.gap-sev{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--steel)}
.gap h3{font-size:22px;margin:4px 0 6px;color:var(--ink)}
.gap p{margin:0 0 10px;font-size:13px;color:#4A4034}
.gap-buy{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.gap-buy-label{font-size:13px;color:var(--brass-dim-t);font-weight:600}
.gap-buy-what{font-size:13px;color:var(--ink);font-weight:500}
.gap-dots{display:inline-flex;gap:5px;align-items:center}
.gap-dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.gap-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--brass-dim-t);margin-top:var(--s2);text-decoration:none;border-bottom:1px solid transparent}
.gap-link:hover{color:var(--brass-t);border-bottom-color:var(--brass)}
.capsule-list{display:flex;flex-direction:column;gap:var(--s2)}
.cap-row{display:flex;gap:var(--s3);align-items:center;background:var(--card);border:0;border-radius:12px;padding:10px;text-align:left;width:100%;box-shadow:var(--shadow-lift)}
.cap-row:hover{box-shadow:0 8px 22px rgba(0,0,0,.4),var(--glow)}
.cap-img{width:54px;height:54px;border-radius:12px;overflow:hidden;flex:none}
.cap-img img{width:100%;height:100%;object-fit:cover;display:block}
.cap-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cap-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.cap-name{font-family:'Bodoni Moda',serif;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:var(--track);text-transform:uppercase;padding:2px 7px;border-radius:6px;flex:none}
.cap-tag.good{background:#E8EFE2;color:#3D5C35}.cap-tag.mid{background:#F1E9D6;color:var(--brass-dim-t)}.cap-tag.low{background:#F6E3D9;color:var(--warn)}
.cap-bar{height:4px;background:var(--card-2);border-radius:6px;overflow:hidden}
.cap-bar span{display:block;height:100%;background:var(--brass)}
.cap-sub{font-size:11px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neglected{margin-top:var(--s5);padding-top:14px;border-top:1px solid var(--line-dark)}
.neglected.top{margin:0 0 24px;padding-top:0;border-top:0}
.chip.unworn{display:inline-flex;align-items:baseline;gap:var(--s2);color:var(--cream)}
.chip.unworn small{font-size:11px;color:var(--brass-dim-t);letter-spacing:.02em}
.theory{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
.rule{background:var(--card);border-radius:12px;padding:18px;box-shadow:var(--shadow-card)}
.rule h3{font-size:22px;margin:0 0 var(--s2);color:var(--ink)}
.rule p{margin:0;color:#4A4034;font-size:13px}

/* ── you + settings cards ── */
.you-grid{display:grid;grid-template-columns:1fr;gap:var(--s3);margin-bottom:24px}
.you-card{background:var(--card);border-radius:12px;padding:18px 18px;box-shadow:var(--shadow-card)}
.you-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.you-photos{display:flex;gap:var(--s2);flex-wrap:wrap;margin:10px 0 12px}
.you-photo{position:relative;width:72px;height:92px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.you-photo img{width:100%;height:100%;object-fit:cover}
.icon.tiny{position:absolute;top:4px;right:4px;width:20px;height:20px}
.you-add{width:72px;height:92px;border:1.5px dashed var(--line);border-radius:12px;background:var(--card-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);color:var(--steel);font-size:11px}
.you-head{display:flex;justify-content:space-between;align-items:baseline}
.you-fields{display:grid;grid-template-columns:1fr;gap:14px}
.you-card .chips .chip{border-color:var(--line);color:var(--steel);background:#fff}
.you-card .chips .chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.you-why{display:inline-flex;align-items:center;min-height:44px;font-size:14px;margin:-6px 0 6px}
.shop-trial{margin-top:var(--s5)}
.you-explain{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
.shoot{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:6px 22px 12px}
.drop{position:relative;height:140px;border:1.5px dashed var(--line);border-radius:12px;background:var(--card-2);display:flex;align-items:center;justify-content:center;color:var(--steel);overflow:hidden}
.drop.has{border-style:solid;background:#fff}
.drop img{width:100%;height:100%;object-fit:cover}
.reading{position:absolute;inset:0;background:rgba(246,241,230,.85);display:flex;align-items:center;justify-content:center;color:var(--brass-dim-t)}
.shoot-copy{display:flex;flex-direction:column;gap:6px}
.shoot-actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:6px}
.shoot-copy .ghost,.you-card .ghost{border-color:var(--line);color:var(--ink);background:#fff}
.shoot-copy .ghost:hover,.you-card .ghost:hover{border-color:var(--brass);color:var(--brass-dim-t)}
.read-ok{margin:2px 0 0;font-size:13px;color:var(--good)}
.read-err{margin:2px 0 0;font-size:13px;color:var(--warn)}
.colour-editor{display:flex;flex-direction:column;gap:10px}
.frag-line{margin:0 var(--s4) var(--s3);padding:10px 12px;border:1px solid rgba(176,141,92,.35);border-radius:12px;background:rgba(176,141,92,.06)}
.frag-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.frag-k{font-size:11px;letter-spacing:var(--track-wide);color:var(--gold,#B08D5C)}
.frag-name{font-family:'Bodoni Moda',Didot,serif;font-size:17px}
.frag-meta{font-size:11px;opacity:.7}
.frag-why{margin:6px 0 0;font-size:13px;line-height:1.35;opacity:.85}
.frag-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.frag-list li button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:rgba(0,0,0,.12);border:1px solid transparent;border-radius:12px;padding:8px 10px;color:inherit;cursor:pointer}
.frag-list li.on button{border-color:var(--gold,#B08D5C)}
.frag-list .frag-name{font-size:14px}
.match-empty{padding:18px 0 22px}
.wear-block{margin:14px 0 18px}
.wear-block h2{font-size:17px;margin:0 0 var(--s2)}
/* 22 Sep: these four were .wear-row/.wear-note/.wear-occ/.wear-occ-pieces — the same
   names the calendar already used. The later rules won: the day card lost its cream,
   the WORK chip became a padding-less pill, and the stylist's reply picked up
   white-space:nowrap (the unwrapped grey bar). Insights gets its own prefix. */
.ww-row{display:flex;align-items:center;gap:10px;width:100%;padding:var(--s2) 0;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}
.wear-sw{width:34px;height:34px;border-radius:6px;overflow:hidden;flex:none;border:1px solid rgba(0,0,0,.2)}
.wear-sw img{width:100%;height:100%;object-fit:cover;display:block}
.wear-name{flex:1;font-size:14px}
.ww-note{font-size:11px;opacity:.7;white-space:nowrap}
.ww-occ{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.ww-occ-pieces{font-size:13px;line-height:1.45;opacity:.9}
.garment-menu{position:absolute;right:8px;bottom:44px;z-index:5;display:flex;flex-direction:column;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.35);overflow:hidden}
.garment-menu button{display:flex;align-items:center;gap:var(--s2);padding:10px 12px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.garment-menu button:last-child{border-bottom:0}
.garment-menu button.danger{color:var(--warn)}
.garment-tags{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:6px}
.tag-pill{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(176,141,82,.14);color:var(--brass-dim-t);letter-spacing:.02em}
.chip.tag-chip.off{text-decoration:line-through;opacity:.55}
.floor-note.calm{color:var(--cream-dim)}
.chip .chip-sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.frag-editor{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:var(--s2) var(--s5)}
.frag-editor>*{min-width:0}
.frag-editor .label{margin-bottom:6px}
.frag-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s3)}
.frag-presets{padding:0 var(--s5);margin:0 0 10px}
.frag-shelf .frag-tile{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(176,141,92,.35),rgba(30,21,16,.6))}
.frag-glyph{font-size:34px;color:var(--cream,#EDE5D3);opacity:.9}
.frag-card{position:relative;background:var(--card);border:1px solid rgba(0,0,0,.25);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow-card);padding:0;text-align:left;color:inherit;font:inherit;width:100%}
.frag-x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);color:#EDE5D3;border:0;display:flex;align-items:center;justify-content:center}
.frag-add{border-style:dashed;opacity:.85}
.frag-chip-sw{background:rgba(176,141,92,.5)}
.frag-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:var(--s2) 0;border-bottom:1px solid rgba(237,229,211,.08)}
.frag-row .frag-meta{white-space:nowrap}
.pc-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:start}
.pc-chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.cchip{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 14px 0 8px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.6);font-size:14px;color:var(--ink)}
.cchip.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cchip.add{padding:0 14px;border-style:dashed;border-color:var(--steel);background:none;gap:6px}
.cchip-sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.cchip-main{font-size:11px;font-weight:600;color:var(--steel)}
.pattern-frame{display:block;flex:none;padding:6px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid var(--line);box-shadow:0 2px 8px rgba(34,26,20,.12)}
.pattern-swatch{display:block;width:64px;height:64px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(34,26,20,.18)}
.pc-hint{margin:0 0 10px}
.pc-tip{margin:var(--s2) 0 0}
.pc-panel{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.pc-acts{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-top:var(--s3)}
.pc-acts .ghost.small{min-height:44px;color:var(--ink);border-color:var(--line);font-size:14px}
.pc-acts .pc-remove{color:var(--warn)}
.pc-cancel{display:inline-flex;align-items:center;min-height:44px;font-size:14px;margin-left:auto}
.pc-panel>.pc-cancel{margin:6px 0 0}
.another-sw{display:flex;align-items:center;justify-content:center;border-style:dashed;border-color:var(--steel);color:var(--steel);background:none}
.colours-row{display:flex;flex-direction:column;gap:6px;margin-top:var(--s2)}
.colours-dots{display:flex;gap:10px;align-items:center}
.colour-dot{position:relative;display:inline-flex;align-items:center}
.colour-dot .dot{width:26px;height:26px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);cursor:pointer}
.colour-dot.primary .dot{box-shadow:0 0 0 2px var(--bg,#1E1510),0 0 0 4px var(--gold,#B08D5C)}
.colour-dot input[type=color]{position:absolute;inset:0;opacity:0;width:26px;height:26px;cursor:pointer}
.dot-x{width:16px;height:16px;border-radius:50%;border:0;font-size:11px;line-height:16px;padding:0;margin-left:2px;background:rgba(0,0,0,.35);color:#EDE5D3;cursor:pointer}
.dot.add{background:transparent;border:1px dashed rgba(237,229,211,.5);color:#EDE5D3;font-size:17px;line-height:24px}
.colour-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.colour-pick .mono{width:104px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px;background:none;border:0;cursor:pointer;padding:0;color:inherit}
.preset-sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.preset.on .preset-sw{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brass)}
.preset-name{font-size:11px;letter-spacing:.02em;opacity:.75;line-height:1}
.preset.on-legacy{outline:2px solid var(--brass);outline-offset:2px}
.hsl{display:grid;gap:6px}
.hsl label{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--steel)}
input[type=range].hue::-webkit-slider-runnable-track{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);height:8px}
input[type=range].hue::-moz-range-track{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);height:8px}
input[type=range].hue::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
input[type=range].hue::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.usage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 10px;text-align:center}
.usage>div{background:var(--card-2);border-radius:12px;padding:var(--s3) var(--s2)}
.usage-num{font-size:28px;color:var(--ink);display:block;line-height:1.1}
.usage .label{margin:var(--s1) 0 0}
.loc-find{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:center;margin-top:6px}
.used-today{margin-top:6px;color:var(--ink)}
.settings-foot{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.settings-foot .build-line{margin-top:6px}
.settings-clear{margin-top:0}
.loc-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:var(--s2);margin-bottom:10px}
.diag{margin-top:10px;font-size:11px;line-height:1.5;background:var(--card-2);border-radius:12px;padding:8px 10px;word-break:break-word;color:var(--ink)}

/* ── modals ── */
.modal-back{position:fixed;inset:0;z-index:140;background:rgba(18,12,8,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));animation:pageIn var(--move) var(--ease)}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:620px;max-height:calc(100vh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;box-shadow:var(--shadow-sheet)}
.modal.small{max-width:400px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 10px}
.modal-head h2{font-size:28px;color:var(--ink)}
.form-grid{padding:var(--s2) var(--s5);display:grid;grid-template-columns:1fr;gap:var(--s4)}
.form-fold{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fold-head{width:100%;min-height:48px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;text-align:left;color:var(--ink)}
.fold-title{font-size:14px;font-weight:600}
.fold-sum{font-size:13px;color:var(--steel);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-chev{color:var(--steel);transition:transform var(--fast) var(--ease)}
.form-fold.open .fold-chev{transform:rotate(180deg)}
.form-grid.fold-body{padding:4px 14px 16px}
.form-grid.fold-body[hidden],.colour-fine[hidden]{display:none}
.colour-now{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.colour-sw{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);flex:none}
.colour-name{font-size:14px;color:var(--ink);flex:1;min-width:0}
.fine-toggle{font-size:14px;min-height:44px}
.colour-fine{margin-top:var(--s3)}
.span2{grid-column:span 1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:var(--s4) var(--s5) var(--s5)}
.modal .ghost{border-color:var(--line);color:var(--ink)}
.modal p{color:#4A4034}

/* ── bottom nav ── */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:flex-end;justify-content:space-around;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(24,15,10,.82),rgba(22,14,9,.98) 45%);backdrop-filter:blur(18px);border-top:1px solid var(--line-dark)}
.bottomnav::before{content:'';position:absolute;top:-1px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(138,110,66,.75) 26%,rgba(138,110,66,.1) 38%,transparent 44%,transparent 56%,rgba(138,110,66,.1) 62%,rgba(138,110,66,.75) 74%,transparent);opacity:.85}
.tabbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:var(--s1);color:var(--cream-dim);font-size:11px;letter-spacing:.03em;padding:6px 10px;border-radius:12px;min-width:58px}
.tabbtn.on{color:var(--brass-t)}
.tabbtn.on svg{filter:drop-shadow(0 0 8px rgba(255,186,110,.45))}
.style-fab{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--cream-dim);font-size:0;padding:0;margin-top:-26px;z-index:2}
.style-fab-ring{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#4A3524,#241809 78%);border:1.5px solid var(--brass-dim);display:flex;align-items:center;justify-content:center;color:var(--brass-t);box-shadow:0 0 0 5px rgba(24,15,10,.92),0 10px 26px rgba(0,0,0,.55),var(--glow);transition:transform var(--move) var(--ease),background var(--move) var(--ease),box-shadow var(--move) var(--ease)}
.style-fab-label{font-size:11px;letter-spacing:var(--track);color:var(--cream-dim)}
.style-fab.on .style-fab-ring{background:radial-gradient(circle at 32% 26%,#D6AE6C,var(--brass) 80%);color:#20160D;border-color:#D8B778;box-shadow:0 0 0 5px rgba(24,15,10,.92),0 10px 28px rgba(0,0,0,.5),0 0 34px rgba(255,186,110,.4)}
.style-fab.on .style-fab-label{color:var(--brass-t)}
.style-fab:active .style-fab-ring{transform:scale(.93)}

/* misc */
.ai-wait{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:13px;z-index:150;box-shadow:var(--shadow-float);max-width:88vw;text-align:center;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13px;z-index:150;pointer-events:none;box-shadow:var(--shadow-float);animation:pageIn var(--move) var(--ease);max-width:88vw;text-align:center}
.backup-bar{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:55;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);font-size:13px;box-shadow:var(--shadow-float)}
.backup-nudge{display:flex;align-items:center;gap:10px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:10px 14px;margin-bottom:var(--s4);font-size:13px;color:var(--cream-dim)}
.backup-nudge .link{margin-left:auto;white-space:nowrap;font-weight:500}
.storage-warn{background:#3A241A;border:1px solid #5C3826;color:#EFC3AC;padding:12px 14px;border-radius:12px;margin-bottom:18px;font-size:13px;line-height:1.5}
.storage-warn .link{color:#F3D3BF;margin-left:6px;font-weight:600}
.gap-buy+.gap-link{margin-top:var(--s2)}
.clear-facets{align-self:flex-start;font-size:13px}

@media (min-width:560px){.trial-grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:760px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .you-grid{grid-template-columns:1fr 1fr}
  .you-card.span{grid-column:span 2}
  .you-fields{grid-template-columns:1fr 1fr}
  .tk-body{grid-template-columns:1fr 132px}
  .tk-body .reasons{grid-column:1/-1}
  .page-head h1{font-size:44px}
  .facet{flex-direction:row;align-items:flex-start;gap:var(--s3)}
  .facet-label{min-width:52px;padding-top:var(--s2);font-weight:600}
}
@media (hover:none) and (pointer:coarse){
  input:not([type=range]):not([type=color]):not([type=file]),select,textarea{font-size:17px !important}
  .searchbar input{font-size:17px}
  .colour-pick .mono{width:118px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* accounts (3 Oct 2026) */
/* 4 Oct: the sheet body takes the same 22px sides as every other sheet (his screenshot: text ran to the card edge) */
.signin-body{padding:var(--s1) var(--s5) var(--s5)}
.signin input{width:100%;box-sizing:border-box}
.signin .primary{width:100%;margin-top:var(--s3);justify-content:center}
.signin-text{font-size:14px;line-height:1.5;color:var(--steel);margin:0 0 14px}
.code-input{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:22px;letter-spacing:.3em;text-align:center}
.signin-alt{display:flex;justify-content:space-between;gap:var(--s3);margin-top:14px;font-size:13px}
.signin-err{font-size:13px;color:var(--warn);margin:var(--s3) 0 0}
.signin-offline{display:block;margin-top:14px;font-size:13px}
.account-email{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 var(--s1);overflow-wrap:anywhere}
.account-delete{display:block;margin-top:var(--s4);font-size:14px;color:var(--warn-t)}
.build-line{display:block;background:none;border:0;padding:0;margin-top:10px;font-size:13px;color:var(--steel);text-align:left}
/* Together (4 Oct 2026): the You card, the Style row, the page, the pair card, the piece sheet */
.partner-block{margin-top:var(--s4)}
.partner-code{display:block;font-size:22px;letter-spacing:var(--track);color:var(--ink);margin-bottom:var(--s1)}
.partner-row{display:flex;gap:var(--s2);align-items:stretch}
.partner-row input{flex:1;min-width:0}
.together-line{margin-top:-8px}
.together-line.first{margin:14px 0 0}
.tg-back{display:inline-flex;align-items:center;gap:var(--s1);background:none;border:0;padding:0;margin-bottom:var(--s3);color:var(--cream-dim);font-size:13px;font-weight:600}
.tg-link{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.tg-avatars{display:flex;flex:none}
.tg-av{width:38px;height:38px;border-radius:50%;border:1px solid var(--brass-dim);background:var(--shell-2);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;overflow:hidden}
.tg-av+.tg-av{margin-left:-10px}
.tg-av img{width:100%;height:100%;object-fit:cover}
.tg-linkmeta{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-linkmeta b{font-size:17px;font-weight:600;color:var(--cream);overflow-wrap:anywhere}
.tg-linkmeta small{font-size:13px;color:var(--cream-dim)}
.tg-stale{margin:0 0 14px}
.tg-starts{margin:0 0 10px}
.tg-brief{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:var(--s3)}
.tg-pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:2px 8px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:11px 14px;color:var(--cream);text-align:left}
.tg-pick .label{grid-column:1/-1;margin:0}
.tg-val{font-size:22px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-pick svg{color:var(--brass-t);margin-bottom:7px}
.tg-toggles{margin-bottom:var(--s3)}
.tg-toggles .chip:disabled{opacity:.5}
.tg-around{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px dashed var(--line-dark);border-radius:12px;padding:12px 14px;color:var(--cream);text-align:left;margin-bottom:var(--s4)}
.tg-around-body{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-around-body b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.tg-around-body small{font-size:13px;color:var(--cream-dim)}
.tg-around svg{color:var(--brass-t);flex:none}
.tg-none{margin-bottom:18px}
.tg-dealt{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:6px}
.tg-dealt h2{font-size:22px;font-style:italic;color:var(--cream)}
.tg-tap{margin:0 0 14px}
.pair-card{background:linear-gradient(160deg,#F8F3E8,#EFE7D6);border-radius:12px;padding:var(--s4);color:var(--ink);box-shadow:var(--shadow-float)}
.pair-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.pair-scorebox{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.pair-score{font-size:34px;line-height:1;color:var(--brass-dim-t)}
.pair-cap{font-size:13px;color:var(--steel)}
.pair-card .icon{width:34px;height:34px;border-color:var(--line);color:var(--ink)}
.pair-sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair-side{display:flex;flex-direction:column;gap:var(--s2);min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);text-align:left}
.pair-who{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);font-size:13px}
.pair-who b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair-who .mono{font-size:11px;color:var(--steel)}
.pair-strip{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair-ph{aspect-ratio:1;border-radius:6px;overflow:hidden;display:block;min-width:0;border:1px solid rgba(36,27,18,.08)}
.pair-ph img{width:100%;height:100%;object-fit:cover;display:block}
.pair-names{font-size:13px;line-height:1.4;color:var(--steel)}
.pair-side.gone{justify-content:center}
.pair-why{margin:var(--s3) 0 0;font-size:13px;line-height:1.4;color:var(--ink)}
.pair-caution{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--warn)}
.pair-pick-group{margin-bottom:14px}
.pair-pick-list{display:flex;flex-wrap:wrap;gap:var(--s2)}
.pair-pick{display:inline-flex;align-items:center;gap:var(--s2);max-width:100%;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink);text-align:left}
.pair-pick.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.pair-pick span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:10px 16px 0;padding:10px 14px;border:1px solid var(--line-dark);border-radius:12px;background:var(--shell-2);font-size:13px;color:var(--cream-dim)}
