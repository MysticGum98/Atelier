.tg-av{width:38px;height:38px;border-radius:50%;border:1px solid var(--brass-dim);background:var(--shell-2);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;overflow:hidden}
.tg-av+.tg-av{margin-left:-10px}
.tg-av img{width:100%;height:100%;object-fit:cover}
.tg-linkmeta{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-linkmeta b{font-size:17px;font-weight:500;color:var(--cream);overflow-wrap:anywhere}
.tg-linkmeta small{font-size:13px;color:var(--cream-dim)}
.tg-stale{margin:0 0 14px}
.tg-starts{margin:0 0 10px}
.tg-brief{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:var(--s3)}
.tg-pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:2px 8px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:11px 14px;color:var(--cream);text-align:left}
.tg-pick .label{grid-column:1/-1;margin:0}
.tg-val{font-size:22px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-pick svg{color:var(--brass-t);margin-bottom:7px}
.tg-toggles{margin-bottom:var(--s3)}
.tg-toggles .chip:disabled{opacity:.5}
.tg-around{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px dashed var(--line-dark);border-radius:12px;padding:12px 14px;color:var(--cream);text-align:left;margin-bottom:var(--s4)}
.tg-around-body{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-around-body b{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tg-around-body small{font-size:13px;color:var(--cream-dim)}
.tg-around svg{color:var(--brass-t);flex:none}
.tg-none{margin-bottom:18px}
.tg-dealt{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:6px}
.tg-dealt h2{font-size:22px;font-style:italic;color:var(--cream)}
.tg-tap{margin:0 0 14px}
.pair-card{background:var(--card);border-radius:12px;padding:var(--s4);color:var(--ink);box-shadow:var(--shadow-float)}
.pair-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.pair-scorebox{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.pair-score{font-size:34px;line-height:1;color:var(--brass-dim-t)}
.pair-cap{font-size:13px;color:var(--steel)}
.pair-card .icon{width:34px;height:34px;border-color:var(--line);color:var(--ink)}
.pair-sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair-side{display:flex;flex-direction:column;gap:var(--s2);min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);text-align:left}
.pair-who{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);font-size:13px}
.pair-who b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair-who .mono{font-size:11px;color:var(--steel)}
.pair-strip{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair-ph{aspect-ratio:1;border-radius:6px;overflow:hidden;display:block;min-width:0;border:1px solid rgba(36,27,18,.08)}
.pair-ph img{width:100%;height:100%;object-fit:cover;display:block}
.pair-names{font-size:13px;line-height:1.4;color:var(--steel)}
.pair-side.gone{justify-content:center}
.pair-why{margin:var(--s3) 0 0;font-size:13px;line-height:1.4;color:var(--ink)}
.pair-caution{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--warn)}
.pair-pick-group{margin-bottom:14px}
.pair-pick-list{display:flex;flex-wrap:wrap;gap:var(--s2)}
.pair-pick{display:inline-flex;align-items:center;gap:var(--s2);max-width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink);text-align:left}
.pair-pick.on{border-color:var(--on-accent);background:var(--ink);color:var(--on-accent)}
.pair-pick span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-bar{display:flex;align-items:center;justify-content:center;gap:var(--s2);margin:6px 16px 0;padding:0;font-size:13px;color:var(--cream-dim)}
/* 23 Oct 2026: Settings and You on the ground, like every other page (Mystic: "fix the boxes issues but
   leave You and the Settings separate"). A section is a Bodoni 22 title, an optional Inter 13 helper line,
   then its controls; sections, the fields inside them and the rows are divided by a hairline. No card
   fill, no shadow, no radius on the wrappers. .you-card stays on them for the tests and the tour. */
.set-sec,.you-sec{background:none;box-shadow:none;border-radius:0;padding:var(--s5) 0 var(--s5);border-top:1px solid var(--line-dark)}
.you-grid .label{font-size:14px;font-weight:400;color:var(--ink);margin-bottom:var(--s2)}
.label.sec-title{font-family:'Bodoni Moda',Didot,serif;font-size:22px;font-weight:400;line-height:1.2;letter-spacing:-0.01em;font-variation-settings:"opsz" 22;color:var(--cream);margin:0 0 var(--s1)}
.sec-title .hint{font-variation-settings:normal;margin-top:var(--s1);color:var(--steel)}
.sec-lede{margin:0 0 var(--s3);font-size:13px;line-height:1.45;color:var(--steel)}
.sec-title+.chips,.sec-title+.set-row,.you-head+.you-fields{margin-top:var(--s3)}
.sec-field{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line-dark)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:44px;box-sizing:border-box;padding:var(--s2) 0;border-top:1px solid var(--line-dark)}
.set-row-l{flex:1;min-width:0}
.set-row .account-email{font-size:14px;font-weight:400;margin:0}
.set-row .hint{margin:2px 0 0}
.set-row .account-delete{margin:0;min-height:44px}
.set-sec>:last-child,.you-sec>:last-child{margin-bottom:0}
.settings-foot .settings-clear{margin:0;min-height:44px}
.settings-foot .legal-links{margin:0}
.settings-foot .build-line{margin-top:var(--s2);min-height:44px}
.you-numbers>div{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:56px;box-sizing:border-box;padding:var(--s2) 0;border-top:1px solid var(--line-dark)}
.you-numbers .label{margin:0}
.you-grid .you-numbers input:not([type=range]):not([type=color]):not([type=file]){width:112px;flex:none}
.you-fields+.sec-field{margin-top:0}
.you-fields>div{padding:var(--s3) 0 var(--s4);border-top:1px solid var(--line-dark)}
.you-grid .chips{gap:var(--s2)}
.you-grid .chips .chip{min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;padding:0 16px;font-size:14px;background:transparent;border-color:var(--line-dark);color:var(--steel)}
.you-grid .chips .chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.you-grid .ghost,.you-grid .primary{min-height:44px;box-sizing:border-box}
.you-grid .ghost:not(.danger){background:var(--card);border-color:var(--line-dark);color:var(--ink)}
.you-grid .ghost.small{padding:0 16px;font-size:14px}
.you-grid input:not([type=range]):not([type=color]):not([type=file]),.you-grid textarea{background:var(--card);border-color:var(--line-dark);color:var(--ink);min-height:44px;box-sizing:border-box}
.you-grid .read-ok,.you-grid .dest-ok{color:var(--good-t)}
.you-grid .read-err{color:var(--warn-t)}
@media (min-width:760px){.you-grid{column-gap:var(--s6)}}
</style>
</head>
