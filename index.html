@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#E6E7E1;--paper:#F7F7F3;--ink:#17181A;--steel:#6B6F74;--line:#CBCDC5;--indigo:#2E3A8C;--indigo-soft:#E1E4F3;--good:#2F6B3F;--warn:#9A3B2C;}
*{box-sizing:border-box}
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;display:grid;grid-template-columns:224px 1fr;line-height:1.5}
.display{font-family:'Bodoni Moda',Didot,'Times New Roman',serif;font-weight:400;letter-spacing:-0.01em;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.label{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:6px}
.hint{color:var(--steel);font-size:12px}
.rail{background:var(--paper);border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand-name{font-size:34px;line-height:1;font-style:italic}
.rail nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;gap:10px;align-items:center;padding:9px 10px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;border-radius:4px;text-align:left}
.nav.on{background:var(--ink);color:#fff}
.nav:hover:not(.on){background:#ECECE6}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:16px}
.inventory{font-size:12px;color:var(--steel);border-top:1px solid var(--line);padding-top:12px}
.inventory div{display:flex;justify-content:space-between;padding:2px 0}
.main{padding:40px 48px 80px;max-width:1120px;width:100%}
.page-head{margin-bottom:28px;max-width:640px}
.page-head h1{font-size:44px;line-height:1.05;margin-bottom:10px}
.lede{color:var(--steel);font-size:15px;margin:0}
button{font:inherit;cursor:pointer}
.primary{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:10px 16px;border-radius:4px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.primary:disabled{opacity:.5;cursor:default}
.primary.full{justify-content:center;width:100%}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:4px}
.ghost.small{padding:6px 10px;font-size:12px;color:var(--steel)}
.link{background:none;border:0;padding:0;color:var(--indigo);text-decoration:underline}
.icon{background:var(--paper);border:1px solid var(--line);width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon:hover{background:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--ink)}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.filter{margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.garment{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s}
.garment:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(23,24,26,.08)}
.garment.selected{outline:2px solid var(--indigo)}
.garment-color{height:92px;position:relative;border-bottom:1px solid rgba(0,0,0,.08)}
.garment-cat{position:absolute;left:10px;bottom:8px;background:var(--paper);padding:2px 7px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.garment-body{padding:12px 12px 14px}
.garment-name{font-family:'Bodoni Moda',serif;font-size:19px;line-height:1.15;margin-bottom:4px}
.garment-meta{font-size:12px;color:var(--steel);display:flex;gap:5px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--line);border-radius:3px;color:var(--steel)}
.garment-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.garment:hover .garment-actions,.garment:focus-within .garment-actions{opacity:1}
@media (hover:none){.garment-actions{opacity:1}.garment-actions .icon{width:34px;height:34px;background:rgba(247,247,243,.94)}}
.empty{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:40px;border:1px dashed var(--line);border-radius:8px;background:var(--paper)}
.danger-zone{margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.controls{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.controls>div{min-width:180px}
select,input:not([type=range]):not([type=color]){width:100%;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font:inherit;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--indigo)}
input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--paper);padding:2px}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:32px}
.pick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);padding:7px 12px 7px 8px;border-radius:999px;font-size:13px;color:var(--ink)}
.pick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.swatch{display:inline-block;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.results-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.results-head h2{font-size:28px;font-style:italic}
.note{background:var(--indigo-soft);border-left:3px solid var(--indigo);padding:16px 18px;border-radius:0 6px 6px 0;margin-bottom:20px;max-width:760px}
.note p{margin:0;font-size:14.5px;line-height:1.6}
.warn-box{background:var(--paper);border:1px solid var(--line);padding:14px 16px;border-radius:6px;color:var(--warn)}
.tickets{display:flex;flex-direction:column;gap:16px}
.ticket{display:grid;grid-template-columns:172px 1fr;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ticket-left{padding:18px 16px;border-right:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;background:#F0F0EB}
.ticket-score{display:flex;align-items:baseline;gap:8px}
.ticket-score .big{font-size:40px;line-height:1}
.ticket-score .label{margin:0}
.ticket-harmony{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-align:center;color:var(--indigo);border:1px solid var(--indigo);padding:3px 8px;border-radius:3px}
.ticket-right{padding:18px 22px}
.ticket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ticket-head .label{margin:0}
.strip{display:flex;height:10px;width:120px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.strip span{flex:1}
.pieces{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:5px}
.pieces li{display:flex;align-items:center;gap:10px}
.piece-cat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);width:84px;flex:none}
.piece-name{font-family:'Bodoni Moda',serif;font-size:18px}
.pin{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;background:var(--ink);color:#fff;padding:2px 6px;border-radius:3px;margin-left:4px}
.reasons{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:5px}
.reasons p{margin:0;font-size:13px;padding-left:14px;position:relative;color:var(--ink)}
.reasons p::before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.reasons p.warn{color:var(--warn)}
.reasons p.warn::before{background:var(--warn)}
.theory{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rule{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px}
.rule h3{font-size:22px;margin-bottom:8px}
.rule p{margin:0;color:#3A3C40;font-size:13.5px}
.modal-back{position:fixed;inset:0;background:rgba(23,24,26,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.small{max-width:420px}
.primary.danger{background:var(--warn);border-color:var(--warn)}
.modal{background:var(--paper);border-radius:8px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px}
.modal-head h2{font-size:30px}
