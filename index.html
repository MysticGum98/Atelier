<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier — your wardrobe</title>
<meta name="description" content="A private wardrobe that styles you from colour theory, proportion and register.">
<meta name="theme-color" content="#1E1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon.png">
<link rel="manifest" href='data:application/manifest+json,{"name":"Atelier","short_name":"Atelier","start_url":"./","display":"standalone","background_color":"%231E1510","theme_color":"%231E1510","icons":[{"src":"icon.png","sizes":"512x512","type":"image/png"}]}'>
<style>html,body{margin:0;background:#1E1510}#root{min-height:100vh}body{padding-bottom:env(safe-area-inset-bottom)}</style>
<style>#boot{position:fixed;inset:0;background:#1E1510;display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .45s ease}#boot span{font-family:'Bodoni Moda',Didot,serif;font-style:italic;font-size:30px;color:#EDE5D3;letter-spacing:.02em}#boot.gone{opacity:0;pointer-events:none}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"><style id="atelier">
:root{
  --shell:#1E1510;          /* walnut, near-black */
  --shell-2:#2A1E15;        /* lifted walnut for surfaces on the shell */
  --shell-3:#38281B;        /* borders / hover on the shell */
  --grain:linear-gradient(180deg,#231810 0%,#1E1510 40%,#191009 100%);
  --card:#F6F1E6;           /* cream / marble */
  --card-2:#EFE9DA;         /* deeper cream for wells inside cards */
  --ink:#241B12;            /* espresso text on cream */
  --steel:#7C7263;          /* muted text on cream */
  --cream:#EDE5D3;          /* text on walnut */
  --cream-dim:#A6987F;      /* muted text on walnut */
  --line:#DCD3BF;           /* hairline on cream */
  --line-dark:#3E2E1F;      /* hairline on walnut */
  --brass:#B08D52;
  --brass-dim:#8A6E42;
  --glow:0 0 24px rgba(255,186,110,.14);
  --good:#4E6B45;--warn:#9A4A31;
  --ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box}
html{background:var(--shell)}
.app{min-height:100vh;background:var(--grain);color:var(--cream);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.55}
.display{font-family:'Bodoni Moda',Didot,serif;font-weight:400;letter-spacing:-0.01em;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin-bottom:6px;display:block}
.hint{color:var(--steel);font-size:12.5px}
button{font:inherit;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease)}
button:active{transform:scale(.975)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(30,21,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-dark)}
.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1.5px solid var(--brass-dim);background:var(--shell-2);color:var(--cream-dim);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--glow)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.on{border-color:var(--brass);color:var(--brass)}
.wordmark{display:flex;flex-direction:column;align-items:center;gap:3px}
.wordmark .display{font-size:22px;font-style:italic;color:var(--cream);letter-spacing:.02em}
.wordmark-rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.topbar-right{display:flex;align-items:center;gap:10px}
.save-state{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim)}
.save-state.bad{color:#D98A6B}
.add-btn{background:var(--shell-2);border-color:var(--line-dark);color:var(--cream)}
.add-btn:hover{border-color:var(--brass-dim);color:var(--brass)}

/* ── main + page motion ── */
.main{max-width:1060px;margin:0 auto;padding:22px 16px calc(130px + env(safe-area-inset-bottom));width:100%}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-anim{animation:pageIn .55s var(--ease)}
.page-head{margin-bottom:22px;max-width:640px}
.page-head h1{font-size:36px;line-height:1.05;margin-bottom:8px;color:var(--cream)}
.lede{color:var(--cream-dim);font-size:14px;margin:0}
.section-title,.shelf-title{font-family:'Bodoni Moda',serif;font-weight:400;font-size:22px;margin:26px 0 12px;display:flex;align-items:center;gap:12px;color:var(--cream)}
.section-title .count,.shelf-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cream-dim)}
.shelf-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-dark),transparent)}
.shelf:first-of-type .shelf-title{margin-top:8px}

/* ── buttons ── */
.primary{background:var(--brass);color:#20160D;border:1px solid var(--brass);padding:10px 16px;border-radius:6px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.primary:hover{box-shadow:var(--glow)}
.primary:disabled{opacity:.5;cursor:default}
.primary.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.primary.full{justify-content:center;width:100%}
.ghost{background:transparent;color:var(--cream);border:1px solid var(--line-dark);padding:10px 16px;border-radius:6px;display:inline-flex;align-items:center;gap:8px}
.ghost:hover{border-color:var(--brass-dim);color:var(--brass)}
.ghost.small{padding:6px 10px;font-size:12px;color:var(--cream-dim)}
.ghost.on{border-color:var(--brass);color:var(--brass)}
.link{background:none;border:0;padding:0;color:var(--brass);text-decoration:underline;cursor:pointer}
.icon{background:transparent;border:1px solid var(--line-dark);width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--cream-dim);padding:0}
.icon:hover{color:var(--brass);border-color:var(--brass-dim)}

/* cream context: cards flip the palette */
.card-ui,.garment,.ticket,.look-card,.gap,.cap-row,.you-card,.wear-row,.facets,.rule,.modal,.note,.warn-box,.empty{color:var(--ink)}
.card-ui .label,.garment .label,.ticket .label,.you-card .label{color:var(--steel)}
.card-ui .icon,.ticket .icon,.garment .icon,.modal .icon,.you-card .icon{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.6)}
.ticket .icon.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* ── chips / facets ── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-dark);background:transparent;padding:7px 13px;border-radius:999px;font-size:13px;color:var(--cream-dim)}
.chip:hover{color:var(--cream);border-color:var(--brass-dim)}
.chip.on{background:var(--cream);border-color:var(--cream);color:var(--ink);font-weight:500}
.facets{background:var(--shell-2);border:1px solid var(--line-dark);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;margin-bottom:8px;color:var(--cream)}
.facets{padding:0;gap:0;overflow:hidden}
.facets.active{border-color:var(--brass-dim)}
.facets-row{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 12px 9px 9px;color:var(--cream-dim);text-align:left}
.facets.active .facets-row{color:var(--cream)}
.facets-what{flex:1;font-size:13px}
.facet-badge{width:38px;height:38px;flex:none}
.fb-rim{fill:none;stroke:var(--brass-dim);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.1 8.08;transition:stroke .3s var(--ease)}
.fb-core{fill:var(--shell-2);stroke:var(--line-dark);stroke-width:1;transition:fill .3s var(--ease)}
.facet-badge text{font-family:'Bodoni Moda',serif;font-size:12px;fill:var(--ink)}
.facets.active .fb-rim{stroke:var(--brass)}
.facets.active .fb-core{fill:var(--cream);stroke:var(--cream)}
.facets.open .drawer-chev{transform:rotate(90deg);color:var(--brass)}
.facets-body{display:flex;flex-direction:column;gap:12px;padding:4px 14px 14px;border-top:1px solid var(--line-dark)}
.facet-foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:2px}
.wash-toggle{gap:5px;padding:0 9px;width:auto}
.wash-toggle .mono{font-size:11px}
.facet{display:flex;flex-direction:column;gap:6px}
.facet-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim)}

/* ── garment cards (cream on walnut shelves) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.garment{background:var(--card);border:1px solid rgba(0,0,0,.25);border-radius:10px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.garment:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.45),var(--glow)}
.garment.selected{outline:2px solid var(--brass)}
.garment-color{height:110px;position:relative}
.garment-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.garment-dot{position:absolute;top:8px;left:8px;width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 2px var(--card)}
.garment-cat{position:absolute;left:8px;bottom:8px;background:rgba(246,241,230,.92);padding:2px 7px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.garment-body{padding:10px 12px 12px}
.garment-name{font-family:'Bodoni Moda',serif;font-size:17px;line-height:1.15;margin-bottom:3px;color:var(--ink)}
.garment-meta{font-size:11.5px;color:var(--steel);display:flex;gap:5px;flex-wrap:wrap}
.garment-wear{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--steel);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--line);border-radius:3px;color:var(--steel)}
.garment-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.garment-actions .icon{width:32px;height:32px;background:rgba(246,241,230,.92);border-color:transparent}
@media (hover:hover){.garment-actions{opacity:0;transition:opacity .3s}.garment:hover .garment-actions,.garment:focus-within .garment-actions{opacity:1}}
.empty{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:28px;border:1px dashed var(--line-dark);border-radius:10px;background:var(--shell-2);color:var(--cream-dim)}
.danger-zone{margin-top:34px;padding-top:16px;border-top:1px solid var(--line-dark);display:flex;gap:8px}

/* ── style page ── */
.controls{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.controls>div{min-width:150px;flex:1 1 40%}
select,input:not([type=range]):not([type=color]):not([type=file]),textarea{width:100%;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:6px;padding:10px 11px;font:inherit;color:var(--cream)}
.modal select,.modal input:not([type=range]):not([type=color]),.modal textarea,.you-card input,.you-card textarea{background:#fff;border-color:var(--line);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--brass)}
input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px}
.controls>.span-controls{flex:1 1 100%;min-width:100%}
.surprise-row{margin-top:2px}
.surprise-row .surprise{padding:13px 12px;font-size:14px;border-style:solid;border-color:var(--brass-dim)}
.floor{margin-top:14px;background:none;border:0;border-radius:0;padding:0}
.floor-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--cream-dim);margin-bottom:3px}
.floor-head b{color:var(--brass-dim);font-size:12px;font-weight:500}
.floor input[type=range]{width:100%;display:block;height:18px;background:none;-webkit-appearance:none;appearance:none}
.floor input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:var(--brass-dim);opacity:.5}
.floor input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--brass-dim);opacity:.5}
.floor input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:var(--brass-dim);border:0}
.floor input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--brass-dim);border:0}
.floor-foot{display:flex;justify-content:space-between;gap:8px;margin-top:2px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--steel)}
.floor-foot .warn{color:#D98A6B}
.floor-note{background:var(--shell-2);border:1px solid var(--line-dark);border-radius:8px;padding:10px 13px;margin:0 0 12px;font-size:12.5px;color:var(--cream-dim)}
.floor-note .link{margin-left:8px}
.surprise{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--brass-dim);background:transparent;padding:10px 12px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--brass)}
.surprise:hover{background:var(--brass);color:#20160D;border-style:solid;box-shadow:var(--glow)}
.indoor-chip{margin-top:6px}
.weather-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-dark);background:var(--shell-2);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--cream);width:100%;text-align:left}
.weather-chip.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.pick-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.brief-line{text-align:center;font-size:13px;color:var(--cream-dim);margin:18px 0 14px;line-height:1.5}
.rings{display:flex;justify-content:center;gap:14px;margin-bottom:16px}
.ring{position:relative;width:136px;height:136px;background:none;border:0;padding:0;color:var(--cream);-webkit-tap-highlight-color:transparent}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-beads{fill:none;stroke:var(--brass);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:.1 15.05;transition:stroke .4s var(--ease)}
.ring-ticks{fill:none;stroke:var(--brass-dim);stroke-width:11;stroke-dasharray:1 6.85;opacity:.55}
.ring-core{fill:var(--shell-2);stroke:var(--line-dark);stroke-width:1;transition:fill .4s var(--ease),stroke .4s var(--ease)}
.ring-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.ring-body svg{position:static;width:18px;height:18px;color:var(--brass)}
.ring-name{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.1}
.ring-body small{font-size:10px;color:var(--cream-dim);max-width:70px;line-height:1.15;text-align:center}
.ring-body em{font-style:normal;font-size:8.5px;color:var(--brass-dim);letter-spacing:.04em}
.ring.set .ring-core{fill:var(--cream);stroke:var(--cream)}
.ring.set .ring-body{color:var(--ink)}
.ring.set .ring-body svg{color:var(--ink)}
.ring.set .ring-body small{color:#8A6A2E;font-weight:500}
.ring:active .ring-beads{stroke:var(--cream)}
.front-surprise{padding:13px 12px;font-size:14px;border-style:solid;border-color:var(--brass-dim);margin-bottom:22px}
.trial-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.trial-mode{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:10px;padding:12px 12px 11px;color:var(--cream-dim);text-align:left}
.trial-mode svg{color:var(--brass-dim);margin-bottom:3px}
.trial-mode b{font-size:13.5px;font-weight:500;color:var(--cream)}
.trial-mode em{font-style:normal;font-size:11.5px;line-height:1.3}
.trial-mode.on{background:var(--cream);border-color:var(--cream);color:var(--steel)}
.trial-mode.on b,.trial-mode.on svg{color:var(--ink)}
.trial-check .idea-upload{margin-bottom:12px}
.trial-check .idea-missing-name{color:var(--cream)}
.trial-check .idea-missing-row{margin-bottom:10px}
.verdict{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:0 10px 10px 0;padding:12px 14px;margin:6px 0 12px}
.verdict.buy{border-left-color:#3B6D11}.verdict.repeat{border-left-color:var(--brass-dim)}.verdict.skip{border-left-color:#A32D2D}.verdict.maybe{border-left-color:#BA7517}
.verdict-kind{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:2px}
.verdict b{display:block;font-size:19px;margin-bottom:4px}
.verdict p{margin:0 0 4px;font-size:13px;line-height:1.5;color:var(--steel)}
.pack-names mark{background:none;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--brass)}
.window-line{margin:6px 0 4px;text-align:center}
.window-btn{background:none;border:1px dashed var(--line);border-radius:999px;padding:7px 14px;font-size:11px;letter-spacing:.06em;color:var(--brass);cursor:pointer}
.window-edit{margin:10px auto 0;max-width:380px;display:flex;flex-direction:column;gap:8px;align-items:center}
.window-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.window-row select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.learned-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:-4px 0 14px;font-size:12px;color:var(--cream-dim);line-height:1.5}
.learned-line b{color:var(--cream);font-weight:500}
.learned-line .link{flex:none;color:var(--brass-dim)}
.idea-body .rings{margin:6px 0 18px}
.first-door{margin:8px 0 26px;text-align:center}
.first-door .front-surprise{padding:18px 12px;font-size:16px;background:var(--brass);color:#20160D;border-color:var(--brass);margin-bottom:12px}
.first-door .hint{max-width:300px;margin:0 auto}
.modal-back.wheel-back{background:rgba(30,21,16,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:wheelBack .22s var(--ease)}
.modal.wheel-sheet{background:rgba(30,21,16,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(201,164,92,.22);box-shadow:0 30px 80px rgba(0,0,0,.55);max-width:360px;padding:0 0 16px;animation:wheelIn .32s var(--ease);transform-origin:50% 50%}
.wheel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 4px}
.wheel-head .label{color:var(--brass-dim)}
.modal.wheel-sheet .icon{border-color:rgba(201,164,92,.35);background:transparent;color:var(--cream)}
@keyframes wheelBack{from{opacity:0}to{opacity:1}}
@keyframes wheelIn{from{opacity:0;transform:scale(.72)}60%{opacity:1}to{opacity:1;transform:scale(1)}}
.wheel>svg{animation:wheelSpin .5s var(--ease)}
@keyframes wheelSpin{from{transform:rotate(-14deg)}to{transform:rotate(0)}}
.wheel{position:relative;width:300px;height:300px;margin:6px auto 0}
.wheel>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wheel-slice-fill{fill:var(--shell-2);stroke:rgba(30,21,16,.9);stroke-width:2;cursor:pointer;transition:fill .25s var(--ease)}
.wheel-hub{fill:rgba(30,21,16,.85)}
.wheel-slice-fill.on{fill:var(--brass)}
.wheel-rim{fill:none;stroke:var(--brass);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:.1 16.2;pointer-events:none}
.wheel-hub{fill:var(--ink);stroke:var(--brass-dim);stroke-width:1;cursor:pointer}
.wheel-slice{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--cream);pointer-events:none}
.wheel-slice svg{color:var(--brass)}
.wheel-slice span{font-family:'Bodoni Moda',serif;font-size:12.5px;line-height:1.05;white-space:pre-line;text-align:center}
.wheel-slice.on{color:var(--ink)}
.wheel-slice.on svg{color:#3A2A0E}

.oi-shot{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:10px}

.rate-top{display:flex;gap:14px;padding:0 22px;align-items:flex-start}

/* walkthrough */
.tour{position:fixed;inset:0;z-index:120;pointer-events:none}
.tour-shade{position:absolute;background:rgba(18,12,8,.78);pointer-events:auto;touch-action:pan-y;will-change:top,left,width,height}
.tour-ring{position:absolute;border:2px solid var(--brass);border-radius:12px;box-shadow:0 0 0 4px rgba(176,141,82,.25),var(--glow);pointer-events:none;opacity:0;will-change:top,left,width,height}
.tour-cap{position:absolute;left:14px;right:14px;background:var(--card);color:var(--ink);border-radius:14px;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.55);pointer-events:auto;max-width:520px;margin:0 auto;transition:top .35s var(--ease)}
.tour-cap.compact .tour-dots,.tour-cap.compact p,.tour-cap.compact .tour-skips{display:none}
.tour-cap.compact{padding:10px 14px}
.tour-cap.compact h3{font-size:16px;margin:0 0 4px}
.tour-cap.docked::before{display:none}
.tour-cap.below::before,.tour-cap.above::before{content:'';position:absolute;left:28px;border:8px solid transparent}
.tour-cap.below::before{top:-16px;border-bottom-color:var(--card)}
.tour-cap.above::before{bottom:-16px;border-top-color:var(--card)}
.tour-dots{display:flex;gap:5px;margin-bottom:8px}
.tour-dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-dots span.done{background:var(--brass-dim)}
.tour-dots span.on{background:var(--brass);width:18px;border-radius:3px}
.tour-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:130;background:var(--ink);color:var(--card);border-radius:999px;padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:92vw;pointer-events:none;animation:pageIn .3s var(--ease)}
.tour-pill-dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none}
.tour-skips{margin-left:auto;display:flex;gap:12px}
.tour-skips .link{font-size:12px;color:var(--steel);text-decoration:none;border-bottom:1px solid var(--line)}
.tour-cap h3{font-size:22px;margin:4px 0 6px}
.tour-cap p{margin:0 0 12px;font-size:13.5px;line-height:1.55;color:#4A4034}
.tour-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tour-gate{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);display:inline-flex;align-items:center;gap:5px}
.tour-gate.ok{color:var(--good)}
.tour-skip{margin-left:auto;font-size:12px;color:var(--steel)}
.tour-modal{position:fixed;inset:0;z-index:120;background:rgba(18,12,8,.9);display:flex;align-items:center;justify-content:center;padding:20px;animation:pageIn .5s var(--ease)}
.tour-card{background:var(--card);color:var(--ink);border-radius:18px;padding:28px 26px;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.tour-mark{display:block;font-style:italic;font-size:22px;color:var(--brass-dim);margin-bottom:10px}
.tour-card h2{font-size:28px;line-height:1.1;margin:0 0 12px}
.tour-card p{margin:0 0 12px;font-size:14px;line-height:1.6;color:#4A4034}
.tour-card .primary{margin-top:6px}
.help-body{padding:12px 22px 22px;display:flex;flex-direction:column;gap:14px}
.help-row b{display:block;font-size:18px;font-weight:400;color:var(--ink);margin-bottom:3px}
.help-row p{margin:0 0 8px;font-size:13px;line-height:1.55;color:#4A4034}

/* search + selection */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:10px;padding:8px 10px;margin-bottom:14px;color:var(--cream-dim)}
.searchbar input{flex:1;background:none;border:0;padding:4px 0;color:var(--cream);font-size:14px}
.searchbar input::placeholder{color:var(--cream-dim)}
.searchbar .icon.on{background:var(--brass);color:#20160D;border-color:var(--brass)}
.sel-mark{position:absolute;left:8px;top:8px;z-index:2;width:28px;height:28px;border-radius:8px;background:rgba(246,241,230,.92);display:flex;align-items:center;justify-content:center;color:var(--steel)}
.sel-mark.on{background:var(--brass);color:#20160D}
.garment.checked{outline:2px solid var(--brass);outline-offset:1px}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:58;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:pageIn .35s var(--ease)}
.selbar-count{font-weight:600;font-size:13px;margin-right:auto}
.selbar .ghost{border-color:var(--line);color:var(--ink);padding:7px 10px}
.selbar .icon{border-color:var(--line);color:var(--ink)}
.undo-bar{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:59;background:var(--ink);color:var(--card);border-radius:999px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:pageIn .3s var(--ease)}
.undo-bar .link{color:var(--brass);display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-weight:600}
/* today card */
.today{background:linear-gradient(160deg,#F8F3E8,#EFE7D6);border-radius:14px;padding:16px;margin-bottom:20px;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.45);animation:cardIn .6s var(--ease)}
.today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.today-head h2{font-size:20px;line-height:1.2;margin-top:2px}
.today-head .label{color:var(--brass-dim)}
.today-score{font-size:34px;line-height:1;color:var(--brass-dim)}
.today-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin:12px 0 8px}
.today-ph{aspect-ratio:1;border-radius:8px;overflow:hidden;display:block;min-width:0}
.today-ph img{width:100%;height:100%;object-fit:cover;display:block}
.today-names{margin:0 0 12px;font-size:12px;color:var(--steel)}
.today-actions{display:flex;gap:8px;flex-wrap:wrap}
.today-actions .ghost{border-color:var(--line);color:var(--ink);padding:9px 12px}
.today-actions .primary{padding:9px 14px}

.frontdoor{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--shell-2);border:1px dashed var(--brass-dim);border-radius:12px;padding:16px 18px;margin-bottom:20px;color:var(--brass)}
.frontdoor h3{font-size:19px;margin:0 0 3px;color:var(--cream)}
.frontdoor>div{flex:1;min-width:180px}
.frontdoor .primary{flex:none}

/* occasions */
.occasions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.occ{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:9px;padding:10px 4px 9px;color:var(--cream-dim);text-align:center}
.occ svg{color:var(--brass-dim);transition:color .4s var(--ease)}
.occ-label{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.1;color:var(--cream)}
.occ-note{display:none;font-size:10.5px;line-height:1.35}
@media (min-width:560px){.occ{align-items:flex-start;text-align:left;padding:11px 13px;gap:3px}.occ-note{display:block}.occ-label{font-size:16px}}
.occ.on{background:var(--cream);border-color:var(--cream)}
/* On a cream sheet the dark page-style chip reads as "selected" even when it
   isn't. Invert: quiet outline at rest, ink when chosen. */
.modal .occ{background:transparent;border-color:var(--line);color:var(--steel)}
.modal .occ .occ-label{color:var(--ink)}
.modal .occ.on{background:var(--ink);border-color:var(--ink)}
.modal .occ.on .occ-label,.modal .occ.on svg{color:var(--cream)}
.modal .occ.on .occ-note{color:var(--cream-dim)}
.wash-nudge{margin:0 22px 8px;font-size:13px;color:var(--steel)}
.wash-nudge.due{color:var(--brass-dim);font-weight:500}
.modal,.sheet{overscroll-behavior:contain}
.occ.on svg,.occ.on .occ-label{color:var(--ink)}
.occ.on .occ-note{color:var(--steel)}
/* crop */
.crop-box{position:relative;width:100%;aspect-ratio:1;background:#2A1E15;border-radius:10px;overflow:hidden;cursor:grab;touch-action:none}
.crop-box img{position:absolute;left:50%;top:50%;max-width:none;height:100%;user-select:none;-webkit-user-drag:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent 33.3%,rgba(255,255,255,.16) 33.3%,rgba(255,255,255,.16) 33.5%,transparent 33.5%,transparent 66.6%,rgba(255,255,255,.16) 66.6%,rgba(255,255,255,.16) 66.8%,transparent 66.8%),
  linear-gradient(to bottom,transparent 33.3%,rgba(255,255,255,.16) 33.3%,rgba(255,255,255,.16) 33.5%,transparent 33.5%,transparent 66.6%,rgba(255,255,255,.16) 66.6%,rgba(255,255,255,.16) 66.8%,transparent 66.8%)}
.crop-zoom{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--steel)}
.dupe{display:flex;align-items:flex-start;gap:6px;margin:6px 0 0;font-size:12px;color:#8A6A1F}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.cal-dow{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--cream-dim);text-align:center;padding-bottom:2px}
.cal-day{position:relative;aspect-ratio:1;border-radius:8px;border:1px solid var(--line-dark);background:var(--shell-2);color:var(--cream-dim);font-size:11px;overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center}
.cal-day img{width:100%;height:100%;object-fit:cover}
.cal-day.has{border-color:var(--brass-dim)}
.cal-day.on{outline:2px solid var(--brass);outline-offset:1px}
.cal-day:disabled{opacity:.45}
.wear-row-tall{flex-direction:column;align-items:stretch;gap:8px}
.look-group{margin-bottom:10px}
.cap-wrap{display:flex;flex-direction:column}
.cap-wrap.open .cap-row{border-bottom-left-radius:0;border-bottom-right-radius:0;border-color:var(--brass-dim)}
.cap-fix{background:var(--card);color:var(--ink);border:1px solid var(--brass-dim);border-top:0;border-radius:0 0 12px 12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.cap-fix .label{margin-bottom:2px}
.cap-fix .ghost{align-self:flex-start;border-color:var(--line);color:var(--ink)}
.look-group-body{padding:2px 10px 12px}
.wear-row-top{display:flex;align-items:center;gap:10px}
.wear-row-actions{display:flex;gap:8px;flex-wrap:wrap}
.wear-rating{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--card-2);color:var(--ink)}
.wear-score{font-size:28px;line-height:1;color:var(--brass-dim);min-width:44px}
.reasons.compact{border-top:0;padding-top:0}
.reasons.compact p{margin:2px 0;font-size:13px}
.wear-note{padding:10px 12px;border-radius:10px;background:var(--card-2);color:var(--ink);font-size:14px;line-height:1.45}
.wear-note p{margin:0 0 8px}.wear-note p:last-child{margin:0}
.wear-row .read-err{margin:0}
.wear-item.wear-item{cursor:default}
/* the log sheet */
.log-sheet{display:flex;flex-direction:column;overflow:hidden}
.log-rings{justify-content:center;margin:2px 0 14px}
.log-sheet .ring.set .ring-core{fill:var(--ink);stroke:var(--ink)}
.log-sheet .ring.set .ring-body{color:var(--cream)}
.log-sheet .ring.set .ring-body svg{color:var(--brass)}
.log-sheet .ring.set .ring-body small{color:var(--brass);font-weight:500}
.log-sheet .modal-head{flex:none}
.log-sheet .modal-foot{flex:none;border-top:1px solid var(--line)}
.log-body{padding:0 22px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.log-photo{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.log-photo img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.log-tile{position:relative;overflow:hidden;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);color:var(--ink);cursor:pointer;padding:0}
.log-tile span{font-size:10.5px;letter-spacing:.02em;color:var(--steel)}
.log-tile:disabled{opacity:.55}
.log-tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.log-thumb{padding:0;border:0;background:none;cursor:zoom-in;line-height:0}
.log-readline{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-dim);margin:-4px 0 10px}
.log-viewer{position:fixed;inset:0;background:rgba(18,12,8,.94);display:flex;align-items:center;justify-content:center;z-index:90;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.log-viewer img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
.log-viewer .icon{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.12);color:var(--cream)}
.log-picked{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.log-picked .wear-item{cursor:pointer;border:1px solid var(--line)}
.log-search{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin:0 0 10px}
.log-groups{padding-bottom:8px}
.log-group{margin-bottom:8px}
.log-drawer{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left;cursor:pointer;color:var(--ink)}
.log-drawer .log-group-title{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin:0;flex:none}
.log-drawer .log-strip{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden}
.log-drawer .log-strip>span{width:26px;height:26px;border-radius:5px;overflow:hidden;flex:none;border:1px solid var(--line)}
.log-drawer .log-strip img,.log-drawer .log-strip .log-swatch{width:100%;height:100%;object-fit:cover;display:block;border-radius:0;aspect-ratio:auto}
.log-drawer .log-count{font-size:11px;color:var(--steel);flex:none}
.log-drawer .log-picked-n{font-size:11px;color:var(--brass-dim);font-weight:500;flex:none}
.log-drawer .shelf-chev{color:var(--steel)}
.log-group.shut .shelf-chev{transform:rotate(-90deg)}
.log-group .log-grid{margin:0 0 6px}
.log-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.log-cell{display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:9px;border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);text-align:left;min-width:0}
.log-cell img,.log-swatch{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.log-name{font-size:10.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.log-cell.on{border-color:var(--ink);background:var(--ink);color:var(--cream)}
/* style this piece */
/* piece-sheet footer: four tiles that always fit a phone width */
.modal-foot.piece-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;justify-content:stretch}
.foot-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;min-height:60px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:11.5px;letter-spacing:.01em;cursor:pointer;min-width:0}
.foot-tile span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.foot-tile.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.foot-tile.primary{background:var(--brass);border-color:var(--brass);color:#20160D;font-weight:600}
.idea-sheet{display:flex;flex-direction:column;overflow:hidden}
.idea-sheet .modal-head{flex:none;align-items:flex-start}
.idea-title{display:flex;gap:12px;align-items:center;min-width:0}
.idea-piece{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line);display:block}
.idea-tabs{flex:none;display:flex;gap:0;padding:0 22px;border-bottom:1px solid var(--line)}
.idea-tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px 12px;font-size:13.5px;color:var(--steel);cursor:pointer;margin-bottom:-1px}
.idea-tab.on{color:var(--ink);border-bottom-color:var(--brass);font-weight:500}
.idea-body{padding:14px 22px 22px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.idea-body .label{margin-top:14px}
.idea-cost{font-size:10.5px;letter-spacing:.06em;color:var(--brass-dim);white-space:nowrap}
.idea-prompt{width:100%;box-sizing:border-box;font:inherit;font-size:16px;line-height:1.4;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);resize:vertical;margin:0 0 10px}
.idea-brief{padding:10px 12px;border-radius:10px;background:var(--card-2);margin:0 0 12px;font-size:13.5px;line-height:1.45}
.idea-brief p{margin:0}.idea-brief p+p{margin-top:6px}
.idea-settings{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-dim)}
.idea-results{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.idea-look{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.idea-score{grid-row:1/3;font-size:26px;line-height:1;color:var(--brass-dim)}
.idea-names{font-size:12.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.idea-thumbs{display:flex;gap:4px}
.idea-thumbs img,.idea-thumbs .idea-swatch{width:22px;height:22px;border-radius:5px;object-fit:cover;display:block;border:1px solid var(--line)}
.idea-empty{padding:10px 12px;border-radius:10px;background:var(--card-2);color:var(--steel);font-size:13px;margin-top:12px}
.idea-tips{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.idea-tip{padding:10px 12px;border-radius:10px;background:var(--card-2);font-size:13.5px;line-height:1.45}
.idea-tip strong{font-weight:500;display:flex;align-items:baseline;gap:8px;margin-bottom:4px;color:var(--ink)}
.idea-num{font-size:10.5px;color:var(--brass-dim);letter-spacing:.06em}
.idea-tip p{margin:0;color:#4A4034}
.idea-wear{font-weight:500;color:var(--ink)!important}
.idea-why{font-size:12.5px;color:var(--steel)!important;margin-top:3px!important}
.idea-srclabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin:10px 0 4px}
.idea-more{margin-top:10px}
.idea-more summary{font-size:12.5px;color:var(--steel);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:6px 0}
.idea-more summary::before{content:'';width:6px;height:6px;border-right:1px solid var(--steel);border-bottom:1px solid var(--steel);transform:rotate(-45deg);transition:transform .2s;flex:none}
.idea-more[open] summary::before{transform:rotate(45deg)}
.idea-more summary .mono{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass-dim)}
/* the running stitch */
.thread{margin:16px 0 8px;height:38px;color:#A1855F}
.thread svg{display:block;width:100%;height:38px}
.modal .thread,.card-ui .thread,.today .thread{color:#9A7A52}
.idea-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.idea-sources a{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--brass-dim);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff}
/* price tiers: one row, always — compact pills that fit a phone */
.idea-sources.tiers{flex-wrap:nowrap;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.idea-sources.tiers::-webkit-scrollbar{display:none}
.idea-sources.tiers a{font-size:11px;padding:3px 9px;flex:none;letter-spacing:.01em}
.idea-missing{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.idea-missing-row{display:flex;flex-direction:column;gap:4px}
.idea-missing-name{font-size:12.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.idea-dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex:none}
.idea-gain{font-size:10.5px;letter-spacing:.06em;color:var(--brass-dim);font-weight:400;margin-left:2px}
.idea-upload{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.idea-upload .ghost{position:relative;overflow:hidden}
.idea-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.idea-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0 12px}
.idea-img{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card-2);aspect-ratio:3/4;cursor:pointer}
.idea-img img{width:100%;height:100%;object-fit:cover;display:block}
.idea-grid.looks{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* a lookbook, not a results list: the photograph is the whole tile */
.idea-img.tall{aspect-ratio:3/4;border-color:transparent;background:var(--card-2)}
.idea-img.tall img{width:100%;height:100%;object-fit:cover;display:block}
.garment-actions .icon.idea{color:var(--brass-dim)}
.log-take,.wear-take{padding:8px 12px;border-radius:10px;background:var(--card-2);margin:0 0 12px;font-size:13px;line-height:1.4}
.wear-take{margin:0}
.log-take p,.wear-take p{margin:0;padding-left:14px;position:relative;color:var(--ink)}
.log-take p+p,.wear-take p+p{margin-top:4px}
.log-take p::before,.wear-take p::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.log-take p.soft::before,.wear-take p.soft::before{background:var(--steel)}
.log-take p.soft,.wear-take p.soft{color:var(--steel)}
.wear-take p.mine{color:var(--ink);font-style:italic}.wear-take p.mine::before{background:var(--brass-dim)}
.log-live{flex:none;display:flex;align-items:center;gap:14px;padding:10px 22px;border-top:1px solid var(--line);background:var(--card-2)}
.log-live-score{font-size:30px;line-height:1;color:var(--brass-dim);min-width:46px}
.log-live-lines p{margin:0;font-size:12.5px;line-height:1.35;color:var(--ink)}
.log-live-lines p.soft{color:var(--steel)}
.cal-badge{position:absolute;right:3px;bottom:3px;background:var(--brass);color:#20160D;font-size:8.5px;border-radius:3px;padding:0 4px}
/* packing + trial */
.pack-controls{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.pack-out{margin-top:20px}
.pack-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:10px;padding:14px;text-align:center;font-size:11.5px;color:var(--cream-dim)}
.pack-stat b{display:block;font-size:26px;color:var(--brass);line-height:1.1;margin-bottom:2px}
.pack-stat .up b{color:#8FBF7A}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.pack-item{display:flex;flex-direction:column;gap:5px}
.pack-img{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden}
.pack-img img{width:100%;height:100%;object-fit:cover;display:block}
.pack-name{font-size:10.5px;color:var(--cream-dim);line-height:1.3}
.pack-days{display:flex;flex-direction:column;gap:7px}
.pack-day{display:flex;align-items:baseline;gap:10px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:8px;padding:10px 12px}
.pack-daynum{font-size:10px;letter-spacing:.1em;color:var(--brass-dim);min-width:44px}
.pack-daylist{flex:1;font-size:12.5px;color:var(--cream)}
.pack-dayscore{font-size:11px;color:var(--cream-dim)}
.trial-grid{display:grid;grid-template-columns:1fr;gap:12px}
.trial-out{margin-top:18px}

/* picker drawers */
.pinned-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pinned-row .pinned{display:inline-flex;align-items:center;gap:8px;background:var(--cream);color:var(--ink);border:0;padding:7px 11px 7px 7px;border-radius:999px;font-size:13px;font-weight:500}
.pinned-row .pinned img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.pinned-row .pinned.away{background:var(--card-2);color:var(--steel);text-decoration:line-through}
.drawers{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.drawer{border:1px solid var(--line-dark);border-radius:10px;overflow:hidden;background:var(--shell-2);transition:border-color .4s var(--ease)}
.drawer.open{border-color:var(--brass-dim)}
.drawer-head{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:13px 14px;color:var(--cream);text-align:left}
.drawer-name{font-family:'Bodoni Moda',serif;font-size:18px;flex:1}
.drawer-meta{font-size:10.5px;color:var(--cream-dim)}
.drawer-chev{display:flex;color:var(--cream-dim);transform:rotate(-90deg);transition:transform .45s var(--ease)}
.drawer.open .drawer-chev{transform:rotate(90deg);color:var(--brass)}
@keyframes drawerIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.drawer-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;padding:2px 12px 14px;animation:drawerIn .4s var(--ease)}
.ptile{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--cream)}
.ptile-img{position:relative;display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1.5px solid transparent;transition:all .4s var(--ease)}
.ptile-img img{width:100%;height:100%;object-fit:cover;display:block}
.ptile.on .ptile-img{border-color:var(--brass);box-shadow:0 0 0 3px rgba(176,141,82,.25)}
.ptile-check{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--brass);color:#20160D;display:flex;align-items:center;justify-content:center}
.ptile-name{font-size:11px;line-height:1.25;color:var(--cream-dim)}
.ptile.on .ptile-name{color:var(--cream)}
/* shelves */
.shelf-title{width:100%;background:none;border:0;text-align:left;padding:0;cursor:pointer}
.shelf-strip{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;margin:0 8px}
.shelf-strip>span{width:30px;height:30px;border-radius:6px;overflow:hidden;flex:none;border:1px solid var(--line-dark)}
.shelf-strip img{width:100%;height:100%;object-fit:cover;display:block}
.shelf-more{width:auto !important;border:0 !important;font-size:10px;color:var(--cream-dim);padding-left:2px}
.shelf-chev{display:inline-flex;color:var(--cream-dim);transform:rotate(90deg);transition:transform .45s var(--ease)}
.shelf.shut .shelf-chev{transform:rotate(-90deg)}
.shelf.shut .shelf-title{opacity:.72}
.closet-tools{display:flex;gap:8px;margin-top:22px}

/* ── the deck ── */
@keyframes deckIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes deckOut{to{opacity:0;transform:translateY(60px) scale(.96)}}
.deck{position:fixed;inset:0;z-index:70;backdrop-filter:blur(10px);display:flex;flex-direction:column;transition:background .3s linear}
.deck-inner{flex:1;display:flex;flex-direction:column;min-height:0;animation:deckIn .5s var(--ease)}
.deck.closing .deck-inner{animation:deckOut .26s var(--ease) forwards}
.deck-grab{display:flex;justify-content:center;padding:10px 0 2px}
.deck-grab span{width:42px;height:4px;border-radius:2px;background:var(--line-dark)}
.deck-card{transition:opacity .45s var(--ease),transform .45s var(--ease)}
.deck-tip{text-align:center;color:var(--cream-dim);font-size:11px;margin:0 0 calc(10px + env(safe-area-inset-bottom))}
.deck-top{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px}
.deck-close{background:none;border:0;color:var(--cream);display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:6px 8px}
.deck-count{color:var(--cream-dim);font-size:11px}
.deck-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.deck-track::-webkit-scrollbar{display:none}
.deck-slide{flex:0 0 100%;scroll-snap-align:center;padding:6px 14px 10px;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.deck-card{margin:auto 0;width:100%;max-width:560px;align-self:center}
.deck-dots{display:flex;justify-content:center;gap:7px;padding:8px 0 6px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-dark);border:0;padding:0;transition:all .4s var(--ease)}
.dot.on{background:var(--brass);width:20px;border-radius:4px}

/* ── outfit ticket (cream card) ── */
.tickets{display:flex;flex-direction:column;gap:16px}
.ticket{background:var(--card);border:1px solid rgba(0,0,0,.25);border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.tk-head{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px 10px}
.tk-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);display:flex;align-items:baseline;gap:10px}
.tk-dot{color:var(--steel)}
.tk-num{font-family:'Bodoni Moda',serif;font-size:18px;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1}
.tk-rank{display:flex;align-items:center;gap:10px}
.tk-rank .label{margin:0}
.tk-stretch{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#8A6A2E;background:rgba(201,164,92,.16);border:1px solid rgba(201,164,92,.45);border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.today-stretch-row{margin:8px 0 0}
.today-stretch{margin:0;display:inline-flex;max-width:100%;white-space:normal;line-height:1.3}
.try-this{margin-bottom:6px}
.try-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.try-head .tk-stretch{margin:0}
.try-names{margin:0;font-size:13.5px;color:var(--cream);line-height:1.5}
.try-names b{font-size:20px;margin-right:10px;color:var(--brass)}
.tk-grade{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid}
.g-top{color:#3D5C35;border-color:#3D5C35;background:#E8EFE2}
.g-strong{color:var(--brass-dim);border-color:var(--brass-dim);background:#F1E9D6}
.g-solid{color:var(--steel);border-color:var(--line);background:var(--card-2)}
.g-ok{color:#8A6A1F;border-color:#C9A961;background:#F5EDD8}
.g-weak{color:var(--warn);border-color:#D9A28B;background:#F6E3D9}
.tk-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-right .tk-grade{margin-right:auto}
.tk-right .icon{width:34px;height:34px}
.tk-score{display:flex;align-items:baseline;gap:5px}
.tk-score .display{font-size:34px;line-height:1;color:var(--ink)}
.tk-hero{position:relative;margin:0 16px 12px;border-radius:10px;overflow:hidden;max-height:300px}
.tk-hero img{width:100%;height:100%;max-height:300px;object-fit:cover;display:block}
.tk-hero-swap{position:absolute;right:8px;bottom:8px;background:rgba(246,241,230,.92)}
.tk-addphoto{display:inline-flex;align-items:center;gap:8px;margin:0 16px 12px;background:var(--card-2);border:1px dashed var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--steel)}
.wear-shot{width:38px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.tk-tips{margin:0 16px 12px;background:var(--card-2);border-left:2px solid var(--brass);border-radius:0 8px 8px 0;padding:10px 12px}
.tk-tips .label{margin-bottom:5px}
.tk-tips p{margin:0 0 4px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.tk-tips p:last-child{margin-bottom:0}
.tk-banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:0 16px 12px}
.banner{position:relative;display:flex;flex-direction:column;align-items:stretch;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;padding:0;margin:0;appearance:none}
.banner.pinned{border-color:#8A6E42;background:#2A1E15;overflow:visible;margin-top:7px}
.banner.pinned .banner.pinned .banner-meta{background:linear-gradient(180deg,#2E2118,#241A12)}
.banner.pinned .banner-cat{color:#A88A55}
.banner.pinned .banner-name{color:#D8B778}
.banner.pinned .banner-sub{color:#A6987F}
.banner-img{position:relative;width:100%;height:84px;flex:none;overflow:hidden;background:inherit}
.banner-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.banner-pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;background:#B08D52;color:#20160D;
  font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 9px;border-radius:3px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.banner-meta{padding:8px 9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.banner-cat{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.banner-name{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.22;color:var(--ink);overflow-wrap:break-word;hyphens:manual}
.banner-sub{font-size:10.5px;color:var(--steel)}
.tk-strip{display:flex;align-items:center;gap:10px;padding:0 16px 12px}
.tk-similar-row{padding:0 16px 12px}
.ps-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:6px 0 10px;padding:9px;border:0;border-top:1px solid var(--line);background:none;color:var(--brass-dim);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.ps-more svg{transition:transform .25s var(--ease)}
.tk-similar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--brass-dim);border-radius:8px;background:none;color:var(--ink);font-size:13.5px;font-weight:500}
.tk-similar .hint{font-weight:400;font-size:11px;color:var(--steel)}
.tk-strip>span:not(.tk-harmony){flex:1;height:7px;border-radius:2px}
.tk-harmony{flex:none;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--brass-dim);border:1px solid var(--brass-dim);padding:3px 8px;border-radius:3px}
.tk-tuck-row{padding:0 14px 10px}
.tk-tuck{width:100%;background:none;border:1px dashed var(--line);border-radius:9px;padding:9px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;color:var(--ink);opacity:.72;cursor:pointer}
.tk-tuck.on{border-style:solid;border-color:var(--brass);opacity:1;color:var(--brass)}
.tk-toggle{width:100%;background:var(--card-2);border:0;border-top:1px solid var(--line);padding:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.tk-toggle:hover{color:var(--ink)}
.tk-body{padding:14px 16px 16px;display:grid;grid-template-columns:1fr;gap:14px;border-top:1px solid var(--line)}
.tk-wheel{display:flex;justify-content:center}
.wheel circle[fill="var(--paper)"]{fill:var(--card)}
.tk-bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:88px 1fr 26px;align-items:center;gap:8px}
.bar-label{font-size:11px;color:var(--steel)}
.bar-track{height:5px;background:var(--card-2);border-radius:3px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--brass);border-radius:3px;transition:width .8s var(--ease)}
.bar-num{font-size:10px;color:var(--steel);text-align:right}
.reasons{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.reasons p{margin:0;font-size:12.5px;padding-left:14px;position:relative;color:var(--ink)}
.reasons p::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.reasons p.warn{color:var(--warn)}
.reasons p.warn::before{background:var(--warn)}

/* ── looks page ── */
.wear-list{display:flex;flex-direction:column;gap:8px}
.wear-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:8px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.wear-date{font-size:10.5px;color:var(--steel);min-width:86px}
.wear-occ{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--cream);font-weight:500;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.wear-items{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.wear-item{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--card-2);padding:3px 8px 3px 4px;border-radius:999px;color:var(--ink)}
.wear-item img{width:18px;height:18px;border-radius:50%;object-fit:cover}

/* ── insights ── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-dark);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:14px;color:var(--cream-dim);white-space:nowrap}
.tab.on{color:var(--brass);border-bottom-color:var(--brass);font-weight:500}
.gap-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.gap{background:var(--card);border-left:3px solid var(--line);border-radius:8px;padding:16px 18px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;flex-direction:column}
.gap.sev-high{border-left-color:var(--warn)}.gap.sev-med{border-left-color:var(--brass)}.gap.sev-low{border-left-color:var(--line)}
.gap-sev{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.gap h3{font-size:20px;margin:4px 0 6px;color:var(--ink)}
.gap p{margin:0 0 10px;font-size:13px;color:#4A4034}
.gap-buy{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.gap-buy-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim)}
.gap-buy-what{font-size:12.5px;color:var(--ink);font-weight:500}
.gap-dots{display:inline-flex;gap:5px;align-items:center}
.gap-dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.gap-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--brass-dim);margin-top:8px;text-decoration:none;border-bottom:1px solid transparent}
.gap-link:hover{color:var(--brass);border-bottom-color:var(--brass)}
.capsule-list{display:flex;flex-direction:column;gap:8px}
.cap-row{display:flex;gap:12px;align-items:center;background:var(--card);border:0;border-radius:8px;padding:10px;text-align:left;width:100%;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.cap-row:hover{box-shadow:0 8px 22px rgba(0,0,0,.4),var(--glow)}
.cap-img{width:54px;height:54px;border-radius:6px;overflow:hidden;flex:none}
.cap-img img{width:100%;height:100%;object-fit:cover;display:block}
.cap-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cap-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cap-name{font-family:'Bodoni Moda',serif;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;flex:none}
.cap-tag.good{background:#E8EFE2;color:#3D5C35}.cap-tag.mid{background:#F1E9D6;color:var(--brass-dim)}.cap-tag.low{background:#F6E3D9;color:var(--warn)}
.cap-bar{height:4px;background:var(--card-2);border-radius:3px;overflow:hidden}
.cap-bar span{display:block;height:100%;background:var(--brass)}
.cap-sub{font-size:11px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neglected{margin-top:22px;padding-top:14px;border-top:1px solid var(--line-dark)}
.neglected.top{margin:0 0 24px;padding-top:0;border-top:0}
.chip.unworn{display:inline-flex;align-items:baseline;gap:8px;color:var(--cream)}
.chip.unworn small{font-size:10.5px;color:var(--brass-dim);letter-spacing:.02em}
.theory{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rule{background:var(--card);border-radius:8px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.rule h3{font-size:20px;margin:0 0 8px;color:var(--ink)}
.rule p{margin:0;color:#4A4034;font-size:13px}

/* ── you + settings cards ── */
.you-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:24px}
.you-card{background:var(--card);border-radius:10px;padding:18px 18px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.you-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.you-photos{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.you-photo{position:relative;width:72px;height:92px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.you-photo img{width:100%;height:100%;object-fit:cover}
.icon.tiny{position:absolute;top:4px;right:4px;width:20px;height:20px}
.you-add{width:72px;height:92px;border:1.5px dashed var(--line);border-radius:6px;background:var(--card-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--steel);font-size:11px}
.you-head{display:flex;justify-content:space-between;align-items:baseline}
.you-fields{display:grid;grid-template-columns:1fr;gap:14px}
.you-card .chips .chip{border-color:var(--line);color:var(--steel);background:#fff}
.you-card .chips .chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.you-explain{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.shoot{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:6px 22px 12px}
.drop{position:relative;height:140px;border:1.5px dashed var(--line);border-radius:8px;background:var(--card-2);display:flex;align-items:center;justify-content:center;color:var(--steel);overflow:hidden}
.drop.has{border-style:solid;background:#fff}
.drop img{width:100%;height:100%;object-fit:cover}
.reading{position:absolute;inset:0;background:rgba(246,241,230,.85);display:flex;align-items:center;justify-content:center;color:var(--brass-dim)}
.shoot-copy{display:flex;flex-direction:column;gap:6px}
.shoot-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.shoot-copy .ghost,.you-card .ghost{border-color:var(--line);color:var(--ink);background:#fff}
.shoot-copy .ghost:hover,.you-card .ghost:hover{border-color:var(--brass);color:var(--brass-dim)}
.read-ok{margin:2px 0 0;font-size:12px;color:var(--good)}
.read-err{margin:2px 0 0;font-size:12px;color:var(--warn)}
.colour-editor{display:flex;flex-direction:column;gap:10px}
.colour-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.colour-pick .mono{width:104px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.preset.on{outline:2px solid var(--brass);outline-offset:2px}
.hsl{display:grid;gap:6px}
.hsl label{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:10px;font-size:12px;color:var(--steel)}
input[type=range].hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);height:8px;border-radius:4px;-webkit-appearance:none;appearance:none}
input[type=range].hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.usage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 10px;text-align:center}
.usage>div{background:var(--card-2);border-radius:8px;padding:12px 8px}
.usage-num{font-size:26px;color:var(--ink);display:block;line-height:1.1}
.usage .label{margin:4px 0 0}
.loc-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-bottom:10px}
.diag{margin-top:10px;font-size:10.5px;line-height:1.5;background:var(--card-2);border-radius:6px;padding:8px 10px;word-break:break-word;color:var(--ink)}

/* ── modals ── */
.modal-back{position:fixed;inset:0;background:rgba(18,12,8,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));z-index:80;animation:pageIn .35s var(--ease)}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:620px;max-height:calc(100vh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.modal.small{max-width:400px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 10px}
.modal-head h2{font-size:26px;color:var(--ink)}
.form-grid{padding:8px 22px;display:grid;grid-template-columns:1fr;gap:16px}
.span2{grid-column:span 1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 22px}
.modal .ghost{border-color:var(--line);color:var(--ink)}
.modal p{color:#4A4034}

/* ── bottom nav ── */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:flex-end;justify-content:space-around;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(24,15,10,.82),rgba(22,14,9,.98) 45%);backdrop-filter:blur(18px);border-top:1px solid var(--line-dark)}
.bottomnav::before{content:'';position:absolute;top:-1px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(138,110,66,.75) 26%,rgba(138,110,66,.1) 38%,transparent 44%,transparent 56%,rgba(138,110,66,.1) 62%,rgba(138,110,66,.75) 74%,transparent);opacity:.85}
.tabbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--cream-dim);font-size:9.5px;letter-spacing:.03em;padding:6px 10px;border-radius:10px;min-width:58px}
.tabbtn.on{color:var(--brass)}
.tabbtn.on svg{filter:drop-shadow(0 0 8px rgba(255,186,110,.45))}
.style-fab{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--cream-dim);font-size:0;padding:0;margin-top:-26px;z-index:2}
.style-fab-ring{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#4A3524,#241809 78%);border:1.5px solid var(--brass-dim);display:flex;align-items:center;justify-content:center;color:var(--brass);box-shadow:0 0 0 5px rgba(24,15,10,.92),0 10px 26px rgba(0,0,0,.55),var(--glow);transition:transform .5s var(--ease),background .5s var(--ease),box-shadow .5s var(--ease)}
.style-fab-label{font-size:9.5px;letter-spacing:.06em;color:var(--cream-dim)}
.style-fab.on .style-fab-ring{background:radial-gradient(circle at 32% 26%,#D6AE6C,var(--brass) 80%);color:#20160D;border-color:#D8B778;box-shadow:0 0 0 5px rgba(24,15,10,.92),0 10px 28px rgba(0,0,0,.5),0 0 34px rgba(255,186,110,.4)}
.style-fab.on .style-fab-label{color:var(--brass)}
.style-fab:active .style-fab-ring{transform:scale(.93)}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13px;z-index:75;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pageIn .4s var(--ease);max-width:88vw;text-align:center}
.backup-bar{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:55;background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.backup-nudge{display:flex;align-items:center;gap:10px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:var(--cream-dim)}
.backup-nudge .link{margin-left:auto;white-space:nowrap;font-weight:500}
.storage-warn{background:#3A241A;border:1px solid #5C3826;color:#EFC3AC;padding:12px 14px;border-radius:8px;margin-bottom:18px;font-size:13px;line-height:1.5}
.storage-warn .link{color:#F3D3BF;margin-left:6px;font-weight:600}
.gap-buy+.gap-link{margin-top:8px}
.clear-facets{align-self:flex-start;font-size:12px}

@media (min-width:560px){.trial-grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:760px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .you-grid{grid-template-columns:1fr 1fr}
  .you-card.span{grid-column:span 2}
  .you-fields{grid-template-columns:1fr 1fr}
  .tk-body{grid-template-columns:1fr 132px}
  .tk-body .reasons{grid-column:1/-1}
  .page-head h1{font-size:44px}
  .facet{flex-direction:row;align-items:flex-start;gap:12px}
  .facet-label{min-width:52px;padding-top:8px}
}
@media (hover:none) and (pointer:coarse){
  input:not([type=range]):not([type=color]):not([type=file]),select,textarea{font-size:16px !important}
  .searchbar input{font-size:16px}
  .colour-pick .mono{width:118px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
