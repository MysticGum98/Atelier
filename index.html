<style>#boot{position:fixed;inset:0;background:#141210;color:#F0EBE2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:200;transition:opacity .45s ease}html[data-theme=day] #boot{background:#F4F1EB;color:#141210}#boot svg{width:96px;height:96px;display:block}#boot span{font-family:'Bodoni Moda',Didot,serif;font-size:22px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase}#boot.gone{opacity:0;pointer-events:none}</style><style id="fonts">@font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:400 500;font-display:swap;src:url(./fonts/bodoni-moda.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}@font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:400;font-display:swap;src:url(./fonts/bodoni-moda-italic.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}@font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url(./fonts/inter.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/ibm-plex-mono-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/ibm-plex-mono-500.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152- /* 21 Oct 2026, the redesign: two worlds, Night and Day, that follow the clock. No cards: surfaces are
   tonal steps of the ground, the clothes are the only colour, the type does the hierarchy. The token
   names are the old ones so the rest of the stylesheet keeps reading; --card is a panel one step up from
   the ground, --ink is the text on it, --brass is the pill (the ink colour as a fill). Night is :root. */
:root{
  --sat:env(safe-area-inset-top,0px);
  --shell:#141210;          /* Night ground */
  --shell-2:#201E1B;        /* a panel on the ground, one visible step up (1.14:1) */
  --shell-3:#2A2724;        /* a well, a hover, the panel behind a dark garment */
  --shell-rgb:20,18,16;     /* the ground as numbers, for the translucent bars and the wheel */
  --card:#201E1B;           /* a panel (was cream) */
  --card-2:#2A2724;         /* a well inside a panel */
  --ink:#F0EBE2;            /* text on a panel */
  --cream:#F0EBE2;          /* text on the ground: titles, the numeral, the pill */
  --body:#C9C2B8;           /* running text on Night is grey, not white (Readwise; APCA Lc 75) */
  --label:#A8A299;          /* caps labels and nav labels (Lc 45 to 60) */
  --cream-rgb:240,235,226;
  --steel:#B8B2A8;          /* secondary text, APCA Lc 60 on the ground */
  --cream-dim:#B8B2A8;
  --line:#3A3631;           /* hairline on a panel (Lc 15 or more) */
  --line-dark:#3A3631;      /* hairline on the ground */
  --brass:#F0EBE2;          /* the pill: the ink colour as a fill */
  --brass-dim:#D6D0C6;
  --brass-t:#F0EBE2;        /* the accent as text */
  --brass-dim-t:#CFC9BF;
  --accent-rgb:240,235,226;
  --panel-rgb:32,30,27;      /* the panel as numbers, for the glass capsule */
  --glow:0 0 0 0 rgba(0,0,0,0);
  --metal:#B08D52;          /* the one metallic: an Exceptional score, the stitch, the harmony tag, the Style ring. Never a fill. */
  --on-accent:#141210;      /* text on the pill */
  --good:#4E6B45;--warn:#9A4A31;
  --warn-t:#E4A68C;
  --good-t:#A9C7A0;
  --ease:cubic-bezier(.22,.8,.26,1);
  --fast:.2s;--move:.4s;--slow:.8s;
  --track:.08em;--track-wide:.1em;
  --world-day:#F4F1EB;--world-night:#141210;   /* the Settings swatches of the two worlds: the same in both blocks */
  --shadow-cut:0 10px 18px rgba(0,0,0,.5);   /* the soft ground shadow under a cut-out, 22 Oct 2026 */
  --shadow-card:0 6px 18px rgba(0,0,0,.3);--shadow-lift:0 4px 12px rgba(0,0,0,.3);--shadow-float:0 10px 30px rgba(0,0,0,.5);--shadow-sheet:0 30px 80px rgba(0,0,0,.55);--shadow-inset:inset 0 0 0 1px rgba(0,0,0,.2);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:22px;--s6:32px;
}
[data-theme=day]{--shell:#F4F1EB;--shell-2:#E8E3D9;--shell-3:#E0DACF;--shell-rgb:244,241,235;--card:#E8E3D9;--card-2:#E0DACF;--ink:#141210;--cream:#141210;--body:#2A2724;--label:#5E5952;--cream-rgb:20,18,16;--steel:#5E5952;--cream-dim:#5E5952;--line:#CFC9BE;--line-dark:#CFC9BE;--brass:#141210;--brass-dim:#2A2724;--brass-t:#141210;--brass-dim-t:#2A2724;--accent-rgb:20,18,16;--panel-rgb:232,227,217;--metal:#6E5632;--on-accent:#F4F1EB;--warn-t:#8F4530;--good-t:#46613E;--shadow-card:0 6px 18px rgba(20,18,16,.08);--shadow-lift:0 4px 12px rgba(20,18,16,.08);--shadow-float:0 10px 30px rgba(20,18,16,.12);--shadow-sheet:0 30px 80px rgba(20,18,16,.18);--shadow-inset:inset 0 0 0 1px rgba(20,18,16,.08);--shadow-cut:0 8px 16px rgba(20,18,16,.22);--world-day:#F4F1EB;--world-night:#141210}
*{box-sizing:border-box}
html{background:var(--shell)}
.app{position:relative;min-height:100vh;background:var(--shell);isolation:isolate;color:var(--cream);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.55;font-synthesis-style:none}
.app em{font-style:normal;font-weight:500}
.display{font-family:'Bodoni Moda',Didot,serif;font-weight:400;letter-spacing:-0.01em;margin:0;font-variation-settings:"opsz" 22}
.mono{font-variant-numeric:tabular-nums}
.label{font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--steel);margin-bottom:6px;display:block}
.hint{color:var(--steel);font-size:13px}
/* 2 Oct (audit 1): helper text inside a label is its own line, sentence case, not the label's mono caps */
.label .hint{display:block;margin-top:3px;font-family:Inter,system-ui,sans-serif;font-size:13px;letter-spacing:0;text-transform:none;line-height:1.4}
/* 2 Oct (audit 7): every tappable thing answers within 44x44 even when drawn smaller;
   the ::after grows only the short side(s), never shrinks, and draws nothing */
:where(button,[role=button],a){position:relative}
:where(button,[role=button],a)::after{content:"";position:absolute;top:min(0px,calc((100% - 44px) / 2));bottom:min(0px,calc((100% - 44px) / 2));left:min(0px,calc((100% - 44px) / 2));right:min(0px,calc((100% - 44px) / 2))}
/* 4 Oct: a tappable CARD holding its own buttons (the closet card, the bottle card) is far
   past 44x44 and needs no layer, and its layer sat ON TOP of those buttons: every tap on
   wash, edit, the ⋯ or a bottle's ✕ landed on the card instead (his screenshot: tapping the
   buttons pinned the piece). Containers with controls inside draw no layer. */
:where([role=button],a):has(button,a,[role=button],input,select,textarea)::after{content:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background var(--move) var(--ease),color var(--move) var(--ease),border-color var(--move) var(--ease),transform var(--move) var(--ease),box-shadow var(--move) var(--ease)}
/* 23 Oct 2026: iOS paints a grey box over anything tappable on touch; Mystic saw it on the wheel's slices. Nothing in Zay uses it; each control has its own :active */
.app,.app *{-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.975)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(var(--shell-rgb),.9);backdrop-filter:blur(14px)}
.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;border:1px solid var(--line-dark);background:transparent;color:var(--cream-dim);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--glow)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.on{border-color:var(--brass);color:var(--brass-t)}
.topbar-right{display:flex;align-items:center;gap:10px}
.save-state{font-size:11px;color:var(--cream-dim)}
.save-state.bad{color:var(--warn-t)}
.add-btn{background:transparent;border-color:var(--line-dark);color:var(--cream);width:44px;height:44px;border-radius:50%}
.settings-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap}
.settings-head h1{flex:1 1 200px}
.add-btn:hover{border-color:var(--brass-dim);color:var(--brass-t)}

/* ── main + page motion ── */
.main{max-width:1060px;margin:0 auto;padding:22px 16px calc(130px + env(safe-area-inset-bottom));width:100%}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-anim{animation:pageIn var(--move) var(--ease)}
.page-head{margin-bottom:var(--s5);max-width:640px}
.page-head h1{font-size:34px;line-height:1.1;letter-spacing:-.01em;margin-bottom:var(--s2);color:var(--cream)}
.lede{color:var(--steel);font-size:14px;margin:0;text-wrap:pretty}
.section-title,.shelf-title{font-family:'Bodoni Moda',serif;font-weight:400;font-size:22px;margin:26px 0 12px;display:flex;align-items:center;gap:var(--s3);color:var(--cream)}
.section-title .count,.shelf-count{font-variant-numeric:tabular-nums;font-size:11px;color:var(--cream-dim)}
.shelf-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-dark),transparent)}
.shelf:first-of-type .shelf-title{margin-top:var(--s2)}

/* ── buttons ── */
.primary{background:var(--brass);color:var(--on-accent);border:1px solid var(--brass);padding:12px 20px;border-radius:999px;display:inline-flex;align-items:center;gap:var(--s2);font-weight:500}
.primary:hover{box-shadow:var(--glow)}
.primary:disabled{opacity:.5;cursor:default}
.primary.danger{background:var(--warn);border-color:var(--warn);color:#F4F1EB}
.primary.full{justify-content:center;width:100%}
.ghost{background:var(--card);color:var(--cream);border:1px solid var(--line-dark);padding:12px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:var(--s2)}
.ghost:hover{border-color:var(--brass-dim);color:var(--brass-t)}
.ghost.small{padding:6px 10px;font-size:13px;color:var(--cream-dim)}
.ghost.danger,.selbar .ghost.danger,.pc-acts .ghost.danger{color:var(--warn-t);border-color:var(--warn-t)}
.ghost.danger:hover{color:var(--warn-t);border-color:var(--warn-t)}
.link.danger{color:var(--warn-t)}
.ghost.on{border-color:var(--brass);color:var(--brass-t)}
.link{background:none;border:0;padding:0;color:var(--brass-t);text-decoration:underline;cursor:pointer}
.icon{background:transparent;border:1px solid var(--line-dark);width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--cream-dim);padding:0}
.icon:hover{color:var(--brass-t);border-color:var(--brass-dim)}

/* cream context: cards flip the palette */
.card-ui,.garment,.ticket,.look-card,.gap,.cap-row,.you-card,.wear-row,.facets,.rule,.modal,.note,.warn-box,.empty{color:var(--ink)}
.card-ui .label,.garment .label,.ticket .label,.you-card .label{color:var(--steel)}
.card-ui .icon,.ticket .icon,.garment .icon,.modal .icon,.you-card .icon{border-color:var(--line);color:var(--ink);background:var(--card-2)}
.ticket .icon.on{background:var(--ink);color:var(--on-accent);border-color:var(--on-accent)}

/* ── chips / facets ── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-dark);background:transparent;padding:7px 13px;border-radius:999px;font-size:13px;color:var(--cream-dim)}
.chip:hover{color:var(--cream);border-color:var(--brass-dim)}
.chip.on{background:var(--cream);border-color:var(--on-accent);color:var(--on-accent);font-weight:500}
.facets{background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:var(--s3);margin-bottom:var(--s2);color:var(--cream)}
.facets{padding:0;gap:0;overflow:hidden}
.facets.active{border-color:var(--brass-dim)}
.facets-row{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 12px 9px 9px;color:var(--cream-dim);text-align:left}
.facets.active .facets-row{color:var(--cream)}
.facets-what{flex:1;font-size:13px}
.facet-badge{width:38px;height:38px;flex:none}
.fb-rim{fill:none;stroke:var(--line-dark);stroke-width:1;transition:stroke .3s var(--ease)}
.fb-core{fill:var(--shell-2);stroke:var(--line-dark);stroke-width:1;transition:fill .3s var(--ease)}
.facet-badge text{font-family:'Bodoni Moda',serif;font-size:13px;fill:var(--ink)}
.facets.active .fb-rim{stroke:var(--brass)}
.facets.active .fb-core{fill:var(--cream);stroke:var(--cream)}
.facets.open .drawer-chev{transform:rotate(90deg);color:var(--brass-t)}
.facets-body{display:flex;flex-direction:column;gap:var(--s3);padding:4px 14px 14px;border-top:1px solid var(--line-dark)}
.facet-foot{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:2px}
.wash-toggle{gap:5px;padding:0 9px;width:auto}
.wash-toggle .mono{font-size:11px}
.facet{display:flex;flex-direction:column;gap:6px}
.facet-label{font-size:13px;color:var(--cream-dim);font-weight:500}

/* ── garment cards (cream on walnut shelves) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s3)}
.grid.lookbook{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px var(--s2);margin:0 var(--s1)}
/* 22 Oct 2026 (roadmap step four): a lookbook tile, not a card. The photo is a square on the panel
   tone (the lighter panel behind a dark piece), the name and one line sit on the ground under it,
   the dots sit beside the name; nothing sits on the photo. */
.garment{position:relative;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:var(--s1);background:transparent;border:0;border-radius:0}
.garment:hover .garment-photo{transform:scale(1.02)}
.garment.selected{outline:2px solid var(--brass)}
.garment-color{grid-column:1/-1;position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--card)}
.garment-color.dark{background:var(--shell-3)}
.garment-swatch{position:absolute;inset:18%;border-radius:6px;box-shadow:var(--shadow-inset)}
.garment-hit{position:absolute;inset:0;z-index:1;width:100%;height:100%;min-height:44px;margin:0;padding:0;background:transparent;border:0;border-radius:6px;cursor:pointer}
.garment-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform var(--move) var(--ease)}
.garment-body{padding:var(--s2) 0 0;min-width:0}
/* the name and the dots share a row; the one line runs under both */
.garment .garment-body{display:contents}
.garment .garment-name{grid-column:1;grid-row:2;margin-top:var(--s2)}
.garment .garment-meta{grid-column:1/-1}
.garment-name{font-family:'Bodoni Moda',serif;font-size:17px;line-height:1.2;color:var(--cream);font-variation-settings:"opsz" 11;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.garment-meta{font-size:13px;color:var(--steel);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:7px}
.tag{font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:var(--track);padding:2px 6px;border:1px solid var(--line);border-radius:6px;color:var(--steel)}
/* 2 Oct (audit 10, mockup): nothing sits on the photo. 22 Oct 2026: the tile face keeps the dots
   only, beside the name; wash and edit stay in the markup (the tests tap them) and in the dots'
   menu, and the tags and style chips live in the piece's sheet. */
.garment-actions{grid-column:2;grid-row:2;position:relative;z-index:2;display:flex;justify-content:flex-end;padding-top:var(--s2)}
.garment-actions:has(.garment-more) .icon:not(.garment-more),.garment .tags{display:none}
.garment-actions .icon{width:32px;height:32px;background:transparent;border-color:transparent;color:var(--steel)}
@media (hover:hover){.garment-actions{opacity:0;transition:opacity .3s}.garment:hover .garment-actions,.garment:focus-within .garment-actions{opacity:1}}
.empty{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;padding:28px;border:1px dashed var(--line-dark);border-radius:12px;background:var(--shell-2);color:var(--cream-dim)}
.danger-zone{margin-top:34px;padding-top:var(--s4);border-top:1px solid var(--line-dark);display:flex;gap:var(--s2)}

/* ── style page ── */
.controls{display:flex;gap:var(--s3);margin-bottom:20px;flex-wrap:wrap}
.controls>div{min-width:150px;flex:1 1 40%}
select,input:not([type=range]):not([type=color]):not([type=file]),textarea{width:100%;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:6px;padding:10px 11px;font:inherit;color:var(--cream)}
.modal select,.modal input:not([type=range]):not([type=color]),.modal textarea,.you-card input,.you-card textarea{background:var(--card-2);border-color:var(--line);color:var(--ink)}
/* 6 Oct 2026: every slider was 8 to 18px tall, so a thumb missed it and scrolled the page.
   The input is 44px tall and transparent; the track it draws stays thin. */
input[type=range]{width:100%;height:44px;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;accent-color:var(--brass);cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--line-dark)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--line-dark)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--brass);border:2px solid var(--shell)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--brass);border:2px solid var(--shell)}
input[type=range]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.modal input[type=range]::-webkit-slider-runnable-track,.you-card input[type=range]::-webkit-slider-runnable-track{background:var(--line)}
.modal input[type=range]::-moz-range-track,.you-card input[type=range]::-moz-range-track{background:var(--line)}
.modal input[type=range]::-webkit-slider-thumb,.you-card input[type=range]::-webkit-slider-thumb{border-color:var(--card)}
.modal input[type=range]::-moz-range-thumb,.you-card input[type=range]::-moz-range-thumb{border-color:var(--card)}
input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);padding:2px}

/* today card */
/* 21 Oct 2026: Today is a composition on the ground, not a card. The pieces as large photos in a
   three-column grid, the score as a numeral in the last cell, one sentence under, two pills. */
.today{margin:0 var(--s1) var(--s5)}
@keyframes tileIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.today-comp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:128px 104px 112px;gap:var(--s2);grid-template-areas:"a a b" "a a c" "d e n"}
.today-comp.n4{grid-template-areas:"a a b" "a a c" "d n n"}
.today-comp.n3{grid-template-areas:"a a b" "a a c" "n n n"}
.today-ph{display:block;min-width:0;border-radius:6px;overflow:hidden;background:var(--shell-2);box-shadow:inset 0 0 0 1px rgba(var(--cream-rgb),.08);animation:tileIn .32s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.today-ph.dark{background:var(--shell-3)}
.today-ph img{width:100%;height:100%;object-fit:cover;display:block}
/* 22 Oct 2026: a cut-out (PNG or WebP with alpha) is placed, not cropped: contain with a 6% margin on the panel tone */
:is(.today-ph,.garment-color,.ps-hero,.look-tile-ph,.wear-sw,.lc-ph,.cal-day,.ps-swap-img,.banner-img,.ptile-img) img[src^="data:image/png"],:is(.today-ph,.garment-color,.ps-hero,.look-tile-ph,.wear-sw,.lc-ph,.cal-day,.ps-swap-img,.banner-img,.ptile-img) img[src^="data:image/webp"]{object-fit:contain;box-sizing:border-box;padding:6%;filter:drop-shadow(var(--shadow-cut))}
.ph1{grid-area:a}.ph2{grid-area:b}.ph3{grid-area:c}.ph4{grid-area:d}.ph5{grid-area:e}
.today-scorebox{grid-area:n;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:var(--s2);min-width:0;animation:tileIn .32s var(--ease) both;animation-delay:.3s}
.today-score{font-size:72px;line-height:.8;letter-spacing:-.04em;color:var(--cream);margin-left:-.04em;font-variation-settings:"opsz" 32;font-variant-numeric:tabular-nums}
.today-score.exceptional,.lc-score.exceptional{color:var(--metal)}
.today-grade{font-size:11px;padding-left:2px;letter-spacing:var(--track);color:var(--label)}
.today-why{margin:var(--s2) 0 0;font-family:'Bodoni Moda',Didot,serif;font-style:italic;font-size:22px;line-height:1.3;color:var(--body);text-wrap:pretty}
.today-names{display:block;font-family:Inter,system-ui,sans-serif;font-style:normal;font-weight:400;font-size:13px;line-height:1.5;color:var(--steel);margin-bottom:var(--s2)}
.about-card{margin:0 0 18px;padding:16px 18px;border:1px solid var(--line-dark);border-radius:12px;background:var(--shell-2)}
.about-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.about-q{display:block;font-size:22px;margin:6px 0 2px}
.about-why{margin:0 0 10px}
.about-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.about-sub{font-size:13px;opacity:.7;font-weight:500}
.tour-q{display:block;margin:14px 0 6px}
.tour-chips{justify-content:center}
.tour-fork{display:flex;flex-direction:column;gap:var(--s2);margin-top:18px}
.tour-nudge{color:var(--warn)}
.tour-returning{margin:14px 0 0;font-size:13px;color:var(--steel)}
.or-build{display:flex;align-items:center;gap:var(--s3);margin:6px 0 16px;color:var(--cream-dim);font-size:13px;font-weight:500}
.or-build::before,.or-build::after{content:"";flex:1;height:1px;background:rgba(var(--cream-rgb),.14)}
.today-actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s5)}

.frontdoor{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--shell-2);border:1px dashed var(--brass-dim);border-radius:12px;padding:16px 18px;margin-bottom:20px;color:var(--brass-t)}
.frontdoor h3{font-size:17px;margin:0 0 3px;color:var(--cream)}
.frontdoor>div{flex:1;min-width:180px}
.frontdoor .primary{flex:none}

/* occasions */
.occasions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.occ{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:10px 4px 9px;color:var(--cream-dim);text-align:center}
.occ svg{color:var(--brass-dim-t);transition:color var(--move) var(--ease)}
.occ-label{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.1;color:var(--cream)}
.occ-note{display:none;font-size:11px;line-height:1.35}
@media (min-width:560px){.occ{align-items:flex-start;text-align:left;padding:11px 13px;gap:3px}.occ-note{display:block}.occ-label{font-size:17px}}
.occ.on{background:var(--cream);border-color:var(--on-accent)}
/* On a cream sheet the dark page-style chip reads as "selected" even when it
   isn't. Invert: quiet outline at rest, ink when chosen. */
.modal .occ{background:transparent;border-color:var(--line);color:var(--steel)}
.modal .occ .occ-label{color:var(--ink)}
.modal .occ.on{background:var(--ink);border-color:var(--on-accent)}
.modal .occ.on .occ-label,.modal .occ.on svg{color:var(--on-accent)}
.modal .occ.on .occ-note{color:var(--on-accent);opacity:.75}
.wash-nudge{margin:0 var(--s5) var(--s2);font-size:13px;color:var(--steel)}
.wash-nudge.due{color:var(--brass-dim-t);font-weight:500}
.modal,.sheet{overscroll-behavior:contain}
.occ.on svg,.occ.on .occ-label{color:var(--on-accent)}
.occ.on .occ-note{color:var(--on-accent);opacity:.75}
/* crop */
.crop-box{position:relative;width:100%;aspect-ratio:1;background:var(--shell-2);border-radius:12px;overflow:hidden;cursor:grab;touch-action:none}
.crop-box img{position:absolute;left:50%;top:50%;max-width:none;height:100%;user-select:none;-webkit-user-drag:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent 33.3%,rgba(255,255,255,.16) 33.3%,rgba(255,255,255,.16) 33.5%,transparent 33.5%,transparent 66.6%,rgba(255,255,255,.16) 66.6%,rgba(255,255,255,.16) 66.8%,transparent 66.8%),
  linear-gradient(to bottom,transparent 33.3%,rgba(255,255,255,.16) 33.3%,rgba(255,255,255,.16) 33.5%,transparent 33.5%,transparent 66.6%,rgba(255,255,255,.16) 66.6%,rgba(255,255,255,.16) 66.8%,transparent 66.8%)}
.crop-zoom{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px;margin-top:var(--s3);font-size:13px;color:var(--steel)}
.dupe{display:flex;align-items:flex-start;gap:6px;margin:6px 0 0;font-size:13px;color:var(--brass-dim-t)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:420px}   /* minmax(0,1fr): every column the same width whatever a cell holds (Mystic saw today's cell narrower on his phone) */
.cal-dow{font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:var(--track);color:var(--cream-dim);text-align:center;padding-bottom:2px}
.cal-day{position:relative;width:100%;min-width:0;aspect-ratio:1;border-radius:6px;border:1px solid var(--line-dark);background:var(--shell-2);color:var(--cream-dim);font-size:11px;overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center}
.cal-day img{width:100%;height:100%;object-fit:cover}
.cal-sw{position:absolute;inset:0;display:flex;flex-wrap:wrap}.cal-sw i{display:block;flex:1 1 50%;min-width:50%}
.cal-day.has{border-color:var(--brass-dim)}
.cal-day.on{outline:2px solid var(--brass);outline-offset:1px}
/* 23 Oct 2026 (Mystic: today read smaller): the number sits in a filled ink circle; a photo keeps a 2px ink ring */
/* 23 Oct 2026, Mystic: no circle; the whole box a step darker with the number in ink */
.cal-day.today{border-color:var(--cream);background:var(--shell-3);color:var(--cream)}
.cal-day.today .cal-num{font-size:13px;font-weight:500}
.cal-day.today:has(>img)::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1px var(--cream);pointer-events:none}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:420px;margin-bottom:10px}
.cal-head-c{display:flex;flex-direction:column;align-items:center;gap:2px}
.cal-range{font-size:14px;color:var(--cream)}
.cal-today-l{display:inline-flex;align-items:center;gap:6px}
.cal-today-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cream);color:var(--on-accent)}
.cal-day:disabled{opacity:.45}
.wear-row-tall{flex-direction:column;align-items:stretch;gap:var(--s2)}
.look-group{margin-bottom:var(--s2)}
/* 22 Oct 2026: an occasion is a Bodoni 22 head over its tiles, not a boxed drawer */
.drawer.look-group{border:0;border-radius:0;background:none;overflow:visible}
.look-group .drawer-head{padding:var(--s2) 0;min-height:44px}
.look-group .drawer-name{font-size:22px;font-variation-settings:"opsz" 22}
.cap-wrap{display:flex;flex-direction:column}
.cap-wrap.open .cap-row{border-bottom-color:transparent}
.cap-fix{background:var(--card);color:var(--ink);border:0;border-radius:6px;padding:12px 14px 14px;margin:0 0 var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.cap-fix .label{margin-bottom:2px}
.cap-fix .ghost{align-self:flex-start;border-color:var(--line);color:var(--ink)}
.look-group-body{padding:0 0 var(--s4)}
.look-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:24px var(--s2);margin:0 var(--s1)}
.look-tile{display:flex;flex-direction:column;align-items:stretch;min-width:0;padding:0;background:none;border:0;text-align:left;color:inherit}
.look-tile-comp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--s2);padding:var(--s2);aspect-ratio:1/1;min-height:0;overflow:hidden;border-radius:6px;background:var(--card)}
.look-tile-comp.n1{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.look-tile-comp.n2{grid-template-rows:minmax(0,1fr)}
.look-tile-comp.n3 .look-tile-ph:first-child{grid-row:span 2}
.look-tile-ph{min-height:0;border-radius:6px;overflow:hidden;background:var(--card-2)}
.look-tile-ph.dark{background:var(--shell-3)}
.look-tile-ph img{width:100%;height:100%;object-fit:cover;display:block}
.look-tile-name{margin-top:var(--s2);font-family:'Bodoni Moda',serif;font-size:17px;line-height:1.2;color:var(--cream);font-variation-settings:"opsz" 11}
.look-tile-meta{font-size:13px;color:var(--steel)}
.look-tile.on .look-tile-name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.look-tile-open{grid-column:1/-1}
.wear-row-top{display:flex;align-items:center;gap:10px}
.wear-row-actions{display:flex;gap:var(--s2);flex-wrap:wrap}
.wear-rating{display:flex;gap:var(--s3);align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--card-2);color:var(--ink)}
.wear-score{font-size:28px;line-height:1;color:var(--brass-dim-t);min-width:44px}
.reasons.compact{border-top:0;padding-top:0}
.reasons.compact p{margin:2px 0;font-size:13px}
.wear-note{padding:10px 12px;border-radius:12px;background:var(--card-2);color:var(--ink);font-size:14px;line-height:1.45}
.wear-note p{margin:0 0 var(--s2)}.wear-note p:last-child{margin:0}
.wear-row .read-err{margin:0}
.wear-item.wear-item{cursor:default}
/* the log sheet */
.log-sheet{display:flex;flex-direction:column;overflow:hidden}
.log-rings{justify-content:center;margin:2px 0 14px}
.log-sheet .ring.set .ring-core{fill:var(--ink);stroke:var(--ink)}
.log-sheet .ring.set .ring-body{color:var(--cream)}
.log-sheet .ring.set .ring-body svg{color:var(--brass-t)}
.log-sheet .ring.set .ring-body small{color:var(--brass-t);font-weight:500}
.log-sheet .modal-head{flex:none}
.log-sheet .modal-foot{flex:none;border-top:1px solid var(--line)}
.log-body{padding:0 var(--s5);overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.log-photo{display:flex;align-items:center;gap:10px;margin:0 0 var(--s3)}
.log-photo img{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.log-tile{position:relative;overflow:hidden;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);border:1px solid var(--line);border-radius:12px;background:var(--card-2);color:var(--ink);cursor:pointer;padding:0}
.log-tile span{font-size:11px;letter-spacing:.02em;color:var(--steel)}
.log-tile:disabled{opacity:.55}
.log-tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.log-thumb{padding:0;border:0;background:none;cursor:zoom-in;line-height:0}
.log-readline{font-size:11px;letter-spacing:var(--track);text-transform:uppercase;color:var(--brass-dim-t);margin:-4px 0 10px}
.log-viewer{position:fixed;inset:0;background:rgba(var(--shell-rgb),.96);display:flex;align-items:center;justify-content:center;z-index:90;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.log-viewer img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
.log-viewer .icon{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;background:var(--card);color:var(--cream)}
.log-picked{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.log-picked .wear-item{cursor:pointer;border:1px solid var(--line)}
.log-search{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);color:var(--ink);margin:0 0 10px}
.log-groups{padding-bottom:var(--s2)}
.log-group{margin-bottom:var(--s2)}
.log-drawer{width:100%;display:flex;align-items:center;gap:var(--s2);background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left;cursor:pointer;color:var(--ink)}
.log-drawer .log-group-title{font-size:13px;color:var(--steel);margin:0;flex:none;font-weight:500}
.log-drawer .log-strip{flex:1;display:flex;align-items:center;gap:var(--s1);overflow:hidden}
.log-drawer .log-strip>span{width:26px;height:26px;border-radius:6px;overflow:hidden;flex:none;border:1px solid var(--line)}
.log-drawer .log-strip img,.log-drawer .log-strip .log-swatch{width:100%;height:100%;object-fit:cover;display:block;border-radius:0;aspect-ratio:auto}
.log-drawer .log-count{font-size:11px;color:var(--steel);flex:none}
.log-drawer .log-picked-n{font-size:11px;color:var(--brass-dim-t);font-weight:500;flex:none}
.log-drawer .shelf-chev{color:var(--steel)}
.log-group.shut .shelf-chev{transform:rotate(-90deg)}
.log-group .log-grid{margin:0 0 6px}
.log-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.log-cell{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s1);border-radius:6px;border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);text-align:left;min-width:0}
.log-cell img,.log-swatch{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.log-name{font-size:11px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.log-cell.on{border-color:var(--on-accent);background:var(--ink);color:var(--on-accent)}
/* style this piece */
/* piece-sheet footer: four tiles that always fit a phone width */
.modal-foot.piece-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--s2);justify-content:stretch}
.foot-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;min-height:60px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);color:var(--ink);font-size:11px;letter-spacing:.01em;cursor:pointer;min-width:0}
.foot-tile span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.foot-tile.on{background:var(--ink);border-color:var(--on-accent);color:var(--on-accent)}
.foot-tile.primary{background:var(--brass);border-color:var(--brass);color:var(--on-accent);font-weight:500}
.idea-sheet{display:flex;flex-direction:column;overflow:hidden}
.idea-sheet .modal-head{flex:none;align-items:flex-start}
.idea-title{display:flex;gap:var(--s3);align-items:center;min-width:0}
.idea-piece{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line);display:block}
.idea-tabs{flex:none;display:flex;gap:0;padding:0 var(--s5);border-bottom:1px solid var(--line)}
.idea-tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px 12px;font-size:13px;color:var(--steel);cursor:pointer;margin-bottom:-1px}
.idea-tab.on{color:var(--ink);border-bottom-color:var(--brass);font-weight:500}
.idea-body{padding:14px 22px 22px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.idea-body .label{margin-top:14px}
.idea-cost{font-size:11px;letter-spacing:var(--track);color:var(--brass-dim-t);white-space:nowrap}
.idea-prompt{width:100%;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.4;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);color:var(--ink);resize:vertical;margin:0 0 10px}
.idea-brief{padding:10px 12px;border-radius:12px;background:var(--card-2);margin:0 0 var(--s3);font-size:13px;line-height:1.45}
.idea-brief p{margin:0}.idea-brief p+p{margin-top:6px}
.idea-settings{font-size:13px;color:var(--brass-dim-t);font-weight:500}
.idea-results{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.idea-look{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);cursor:pointer}
.idea-score{grid-row:1/3;font-size:28px;line-height:1;color:var(--brass-dim-t)}
.idea-names{font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.idea-thumbs{display:flex;gap:var(--s1)}
.idea-thumbs img,.idea-thumbs .idea-swatch{width:22px;height:22px;border-radius:6px;object-fit:cover;display:block;border:1px solid var(--line)}
.idea-empty{padding:10px 12px;border-radius:12px;background:var(--card-2);color:var(--steel);font-size:13px;margin-top:var(--s3)}
.idea-tips{display:flex;flex-direction:column;gap:var(--s2);margin:var(--s2) 0 var(--s1)}
.idea-tip{padding:10px 12px;border-radius:12px;background:var(--card-2);font-size:13px;line-height:1.45}
.idea-tip strong{font-weight:500;display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s1);color:var(--ink)}
.idea-num{font-size:11px;color:var(--brass-dim-t);letter-spacing:var(--track)}
.idea-tip p{margin:0;color:var(--ink)}
.idea-wear{font-weight:500;color:var(--ink)!important}
.idea-why{font-size:13px;color:var(--steel)!important;margin-top:3px!important}
.idea-srclabel{font-size:13px;color:var(--steel);margin:10px 0 4px;font-weight:500}
.idea-more{margin-top:10px}
.idea-more summary{font-size:13px;color:var(--steel);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:6px 0}
.idea-more summary::before{content:'';width:6px;height:6px;border-right:1px solid var(--steel);border-bottom:1px solid var(--steel);transform:rotate(-45deg);transition:transform .2s;flex:none}
.idea-more[open] summary::before{transform:rotate(45deg)}
.idea-more summary .mono{font-size:11px;letter-spacing:var(--track);text-transform:uppercase;color:var(--brass-dim-t)}
/* the section divider: a hairline (the stitch left on 23 Oct 2026) */
.thread{margin:var(--s5) 0;height:0;border-top:1px solid var(--line-dark)}
.modal .thread,.card-ui .thread,.idea-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.idea-sources a{display:inline-flex;align-items:center;gap:var(--s1);font-size:13px;color:var(--brass-dim-t);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card-2)}
/* price tiers: one row, always — compact pills that fit a phone */
.idea-sources.tiers{flex-wrap:nowrap;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.idea-sources.tiers::-webkit-scrollbar{display:none}
.idea-sources.tiers a{font-size:11px;padding:3px 9px;flex:none;letter-spacing:.01em}
.idea-missing{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s2)}
.idea-missing-row{display:flex;flex-direction:column;gap:var(--s1)}
.idea-missing-name{font-size:13px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.idea-dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex:none}
.idea-gain.up{color:var(--good)}.idea-gain.down{color:var(--warn)}
.idea-gain{font-size:11px;letter-spacing:var(--track);color:var(--brass-dim-t);font-weight:400;margin-left:2px}
.idea-upload{display:flex;gap:var(--s2);flex-wrap:wrap;margin:6px 0 10px}
.idea-upload .ghost{position:relative;overflow:hidden}
.idea-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.idea-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0 12px}
.idea-img{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card-2);aspect-ratio:3/4;cursor:pointer}
.idea-img img{width:100%;height:100%;object-fit:cover;display:block}
.idea-grid.looks{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
/* a lookbook, not a results list: the photograph is the whole tile */
.idea-img.tall{aspect-ratio:3/4;border-color:transparent;background:var(--card-2)}
.idea-img.tall img{width:100%;height:100%;object-fit:cover;display:block}
.garment-actions .icon.idea{color:var(--brass-dim-t)}
.log-take,.wear-take{padding:var(--s2) var(--s3);border-radius:12px;background:var(--card-2);margin:0 0 var(--s3);font-size:13px;line-height:1.4}
.wear-take{margin:0}
.log-take p,.wear-take p{margin:0;padding-left:14px;position:relative;color:var(--ink)}
.log-take p+p,.wear-take p+p{margin-top:var(--s1)}
.log-take p::before,.wear-take p::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.log-take p.soft::before,.wear-take p.soft::before{background:var(--steel)}
.log-take p.soft,.wear-take p.soft{color:var(--steel)}
.wear-take p.mine{color:var(--ink);font-style:italic}.wear-take p.mine::before{background:var(--brass-dim)}
.log-live{flex:none;display:flex;align-items:center;gap:14px;padding:10px 22px;border-top:1px solid var(--line);background:var(--card-2)}
.log-live.stale{opacity:.5}
.log-live-score{font-size:28px;line-height:1;color:var(--brass-dim-t);min-width:46px}
.log-live-lines p{margin:0;font-size:13px;line-height:1.35;color:var(--ink)}
.log-live-lines p.soft{color:var(--steel)}
.cal-badge{position:absolute;right:3px;bottom:3px;background:var(--brass);color:var(--on-accent);font-size:11px;border-radius:6px;padding:0 var(--s1)}
/* packing + trial */
.pack-controls{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.pack-out{margin-top:20px}
.pack-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:14px;text-align:center;font-size:11px;color:var(--cream-dim)}
.pack-stat b{display:block;font-size:28px;color:var(--brass-t);line-height:1.1;margin-bottom:2px}
.pack-stat .up b{color:#8FBF7A}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.pack-item{display:flex;flex-direction:column;gap:5px}
.pack-img{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden}
.pack-img img{width:100%;height:100%;object-fit:cover;display:block}
.pack-name{font-size:11px;color:var(--cream-dim);line-height:1.3}
.pack-days{display:flex;flex-direction:column;gap:7px}
.pack-day{display:flex;align-items:baseline;gap:10px;background:var(--shell-2);border:1px solid var(--line-dark);border-radius:12px;padding:10px 12px}
.pack-daynum{font-size:11px;letter-spacing:var(--track);color:var(--brass-dim-t);min-width:44px}
.pack-daylist{flex:1;font-size:13px;color:var(--cream)}
.pack-dayscore{font-size:11px;color:var(--cream-dim)}
.trial-grid{display:grid;grid-template-columns:1fr;gap:var(--s3)}
.trial-out{margin-top:18px}

/* picker drawers */
.pinned-row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:14px}
.pinned-row .pinned{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;background:var(--cream);color:var(--on-accent);border:0;padding:0 12px 0 16px;border-radius:999px;font-size:13px;font-weight:500}
.pinned-row .pinned-clear{min-height:44px;padding:0 var(--s2)}
.pick-lede{margin:-6px 0 var(--s3)}
.pinned-row .pinned.away{background:var(--card-2);color:var(--steel);text-decoration:line-through}
.drawers{display:flex;flex-direction:column;gap:var(--s2);margin-bottom:26px}
.drawer{border:1px solid var(--line-dark);border-radius:12px;overflow:hidden;background:var(--shell-2);transition:border-color var(--move) var(--ease)}
.drawer.open{border-color:var(--brass-dim)}
.drawer-head{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:13px 14px;color:var(--cream);text-align:left}
.drawer-name{font-family:'Bodoni Moda',serif;font-size:17px;flex:1}
.drawer-meta{font-size:11px;color:var(--cream-dim)}
.drawer-chev{display:flex;color:var(--cream-dim);transform:rotate(-90deg);transition:transform var(--move) var(--ease)}
.drawer.open .drawer-chev{transform:rotate(90deg);color:var(--brass-t)}
@keyframes drawerIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.drawer-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;padding:2px 12px 14px;animation:drawerIn .4s var(--ease)}
.ptile{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--cream)}
.ptile-img{position:relative;display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card-2);border:1.5px solid transparent;transition:all var(--move) var(--ease)}
.ptile-img img{width:100%;height:100%;object-fit:cover;display:block}
.ptile.on .ptile-img{border-color:var(--brass);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.25)}
.ptile-check{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--brass);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.ptile-name{font-size:11px;line-height:1.25;color:var(--cream-dim)}
.ptile.on .ptile-name{color:var(--cream)}
/* shelves */
.shelf-title{width:100%;background:none;border:0;text-align:left;padding:0;cursor:pointer}
.shelf-strip{flex:1;display:flex;align-items:center;gap:var(--s1);overflow:hidden;margin:0 var(--s2)}
.shelf-strip>span{width:30px;height:30px;border-radius:6px;overflow:hidden;flex:none;border:1px solid var(--line-dark)}
.shelf-strip img{width:100%;height:100%;object-fit:cover;display:block}
.shelf-more{width:auto !important;border:0 !important;font-size:11px;color:var(--cream-dim);padding-left:2px}
.shelf-chev{display:inline-flex;color:var(--cream-dim);transform:rotate(90deg);transition:transform var(--move) var(--ease)}
.shelf.shut .shelf-chev{transform:rotate(-90deg)}
.shelf.shut .shelf-title{opacity:.72}

/* ── the deck ── */
@keyframes deckIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes deckOut{to{opacity:0;transform:translateY(60px) scale(.96)}}
.deck{position:fixed;inset:0;z-index:70;backdrop-filter:blur(10px);display:flex;flex-direction:column;transition:background .3s linear}
.deck-inner{flex:1;display:flex;flex-direction:column;min-height:0;animation:deckIn .5s var(--ease)}
.deck.closing .deck-inner{animation:deckOut .26s var(--ease) forwards}
.deck-grab{display:flex;justify-content:center;padding:10px 0 2px}
.deck-grab span{width:42px;height:4px;border-radius:6px;background:var(--line-dark)}
.deck-card{transition:opacity var(--move) var(--ease),transform var(--move) var(--ease)}
.deck-tip{text-align:center;color:var(--cream-dim);font-size:11px;margin:0 0 calc(10px + env(safe-area-inset-bottom))}
.deck-top{display:flex;justify-content:space-between;align-items:center;padding:var(--s1) var(--s4) var(--s2)}
.deck-close{background:none;border:0;color:var(--cream);display:inline-flex;align-items:center;gap:var(--s1);font-size:14px;padding:6px 8px}
.deck-count{color:var(--cream-dim);font-size:11px}
.deck-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.deck-track::-webkit-scrollbar{display:none}
.deck-slide{flex:0 0 100%;scroll-snap-align:center;padding:6px 14px 10px;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.deck-card{margin:auto 0;width:100%;max-width:560px;align-self:center}
.deck-dots{display:flex;justify-content:center;gap:7px;padding:8px 0 6px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-dark);border:0;padding:0;transition:all var(--move) var(--ease)}
.dot.on{background:var(--brass);width:20px;border-radius:6px}

/* ── outfit ticket (cream card) ── */
.tickets{display:flex;flex-direction:column;gap:var(--s4)}
.ticket{background:var(--card);border:1px solid rgba(0,0,0,.25);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-float)}
.tk-head{display:flex;flex-direction:column;align-items:stretch;gap:var(--s2);padding:12px 16px 10px}
.tk-title{font-size:13px;font-weight:400;color:var(--steel);display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tk-num{margin:0 0 0 -.04em;font-family:'Bodoni Moda',serif;font-size:72px;letter-spacing:-.04em;text-transform:none;color:var(--ink);line-height:.8;font-variation-settings:"opsz" 32;font-variant-numeric:tabular-nums}
.tk-rank{display:flex;align-items:center;gap:10px}
.tk-rank .label{margin:0}
.tk-stretch{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink);background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.3);border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.today-stretch-row{margin:var(--s3) 0 0}
.today-thin{margin:var(--s2) 0 0;font-size:13px;line-height:1.5;color:var(--steel)}
.today-stretch{margin:0;display:inline-flex;max-width:100%;white-space:normal;line-height:1.3}
.try-this{margin-bottom:6px}
.try-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:nowrap;margin-bottom:6px}
/* 23 Oct 2026: the chip and the reason line hold one line each; the chip shrinks with an ellipsis rather than overflow */
.try-head .tk-stretch{margin:0;flex:0 1 auto;min-width:0;max-width:100%}
.tk-stretch-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.try-why{margin:4px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranked-lede{margin:0 0 var(--s4)}
.try-names{margin:0;font-size:13px;color:var(--cream);line-height:1.5}
.try-names b{font-size:22px;margin-right:10px;color:var(--brass-t)}
.tk-grade{font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:var(--track);text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid}
.g-top{color:var(--good-t);border-color:var(--good-t);background:rgba(78,107,69,.22)}
.g-strong{color:var(--brass-dim-t);border-color:var(--brass-dim);background:rgba(var(--accent-rgb),.12)}
.g-solid{color:var(--steel);border-color:var(--line);background:var(--card-2)}
.g-ok{color:var(--brass-dim-t);border-color:var(--brass-dim);background:rgba(var(--accent-rgb),.10)}
.g-weak{color:var(--warn);border-color:var(--warn-t);background:rgba(154,74,49,.18)}
.tk-right{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.tk-right .tk-grade{margin-right:auto}
.tk-right .icon{width:34px;height:34px}
.tk-score{display:flex;align-items:baseline;gap:5px}
.tk-score .display{font-size:72px;line-height:.8;letter-spacing:-.04em;color:var(--ink);font-variation-settings:"opsz" 32;font-variant-numeric:tabular-nums}
.tk-hero{position:relative;margin:0 var(--s4) var(--s3);border-radius:6px;overflow:hidden;max-height:360px;background:var(--shell-3)}
.tk-hero img{width:100%;height:100%;max-height:360px;object-fit:cover;display:block}
.tk-hero-swap{position:absolute;right:8px;bottom:8px;background:rgba(var(--cream-rgb),.92)}
.tk-addphoto{display:inline-flex;align-items:center;gap:var(--s2);margin:0 var(--s4) var(--s3);background:var(--card-2);border:1px dashed var(--line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--steel)}
.wear-shot{width:38px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.tk-tips{margin:0 var(--s4) var(--s3);background:var(--card-2);border-left:2px solid var(--brass);border-radius:0 12px 12px 0;padding:10px 12px}
.tk-tips .label{margin-bottom:5px}
.tk-tips p{margin:0 0 var(--s1);font-size:13px;line-height:1.5;color:var(--ink)}
.tk-tips p:last-child{margin-bottom:0}
.tk-banners{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);padding:0 var(--s4) var(--s3)}
.tk-banners .banner:first-child{grid-column:span 2;grid-row:span 2}
.tk-banners .banner:first-child .banner-img{height:auto;flex:1;min-height:212px}
.tk-banners .banner:first-child .banner-name{font-size:17px}
.banner{position:relative;display:flex;flex-direction:column;align-items:stretch;width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card-2);padding:0;margin:0;appearance:none}
.banner.pinned{border-color:var(--brass-dim);background:var(--shell-2);overflow:visible;margin-top:7px}
.banner.pinned .banner-meta{background:var(--shell-3)}
.banner.pinned .banner-cat{color:var(--brass-dim-t)}
.banner.pinned .banner-name{color:var(--brass-t)}
.banner.pinned .banner-sub{color:var(--steel)}
.banner-img{position:relative;width:100%;height:84px;flex:none;overflow:hidden;background:inherit}
.banner-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.banner-pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;background:var(--brass);color:var(--on-accent);
  font-variant-numeric:tabular-nums;font-size:11px;font-weight:500;letter-spacing:var(--track-wide);text-transform:uppercase;
  padding:3px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.banner-meta{padding:8px 9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.banner-cat{font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:var(--track);text-transform:uppercase;color:var(--label)}
.banner-name{font-family:'Bodoni Moda',serif;font-size:14px;line-height:1.22;color:var(--ink);overflow-wrap:break-word;hyphens:manual}
.banner-sub{font-size:11px;color:var(--steel)}
.tk-strip{display:flex;align-items:center;gap:10px;padding:0 var(--s4) var(--s3)}
.tk-similar-row{padding:0 var(--s4) var(--s3)}
.ps-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:6px 0 10px;padding:9px;border:0;border-top:1px solid var(--line);background:none;color:var(--brass-dim-t);font-size:13px;font-weight:500}
.ps-more svg{transition:transform var(--fast) var(--ease)}
.tk-similar{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;padding:10px 12px;border:1px solid var(--brass-dim);border-radius:12px;background:none;color:var(--ink);font-size:13px;font-weight:500}
.tk-similar .hint{font-weight:400;font-size:11px;color:var(--steel)}
.tk-strip>span:not(.tk-harmony){flex:1;height:7px;border-radius:6px}
.tk-harmony{flex:none;font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:var(--track);color:var(--metal);border:1px solid var(--metal);padding:3px 8px;border-radius:6px}
.tk-tuck-row{padding:0 14px 10px}
.tk-tuck{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.tk-tuck.on{border-style:solid;border-color:var(--brass);opacity:1;color:var(--brass-t)}
.tk-toggle{width:100%;background:var(--card-2);border:0;border-top:1px solid var(--line);padding:var(--s3);font:inherit;font-size:14px;color:var(--ink)}
.tk-toggle:hover{color:var(--ink)}
.tk-body{padding:14px 16px 16px;display:grid;grid-template-columns:1fr;gap:14px;border-top:1px solid var(--line)}
.tk-wheel{display:flex;justify-content:center}
.wheel circle[fill="var(--paper)"]{fill:var(--card)}
.tk-bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:88px 1fr 26px;align-items:center;gap:var(--s2)}
.bar-label{font-size:11px;color:var(--steel)}
.bar-track{height:5px;background:var(--card-2);border-radius:6px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--brass);border-radius:6px;transition:width var(--slow) var(--ease)}
.bar-num{font-size:11px;color:var(--steel);text-align:right}
.reasons{border-top:1px solid var(--line);padding-top:var(--s3);display:grid;gap:6px}
.reasons p{margin:0;font-size:13px;padding-left:14px;position:relative;color:var(--ink)}
.reasons p::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.reasons p.warn{color:var(--warn)}
.reasons p.warn::before{background:var(--warn)}

/* ── looks page ── */
.wear-list{display:flex;flex-direction:column;gap:var(--s2)}
.wear-row{display:flex;align-items:center;gap:var(--s3);background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-lift)}
.wear-date{font-size:11px;color:var(--steel);min-width:86px}
.wear-occ{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--on-accent);font-weight:500;font-size:11px;letter-spacing:var(--track);text-transform:uppercase}
.wear-items{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.wear-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--card-2);padding:3px 8px 3px 4px;border-radius:999px;color:var(--ink)}
.wear-item img{width:18px;height:18px;border-radius:50%;object-fit:cover}

/* ── insights ── */
.tabs{display:flex;gap:0;justify-content:space-between;border-bottom:1px solid var(--line-dark);margin-bottom:18px;overflow-x:auto}
.tabs.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.tabs.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px);mask-image:linear-gradient(90deg,transparent,#000 44px)}
.tabs.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 6px;font-size:14px;color:var(--cream-dim);white-space:nowrap}
.tab.on{color:var(--brass-t);border-bottom-color:var(--brass);font-weight:500}
/* the closet's category words (22 Oct 2026): Inter 14, the rest in the secondary tone, the active one in
   ink over a hairline; 44 tall each; the row scrolls sideways when it runs out */
.tabs.closet-tabs{justify-content:flex-start;column-gap:20px;border-bottom:0;margin:0 0 var(--s3)}
.closet-tabs .tab{min-height:44px;padding:0;border-bottom-width:1px;color:var(--steel);font-weight:400}
.closet-tabs .tab.on{color:var(--cream);border-bottom-color:var(--cream);font-weight:400}
.gap-list{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.gap{background:var(--card);border-left:3px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow-card);display:flex;flex-direction:column}
.gap.sev-high{border-left-color:var(--warn)}.gap.sev-med{border-left-color:var(--brass)}.gap.sev-low{border-left-color:var(--line)}
.gap-sev{font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--steel)}
.gap h3{font-size:22px;margin:4px 0 6px;color:var(--ink)}
.gap p{margin:0 0 10px;font-size:13px;color:var(--ink)}
.gap-buy{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.gap-buy-label{font-size:13px;color:var(--brass-dim-t);font-weight:500}
.gap-buy-what{font-size:13px;color:var(--ink);font-weight:500}
.gap-dots{display:inline-flex;gap:5px;align-items:center}
.gap-dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.gap-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--brass-dim-t);margin-top:var(--s2);text-decoration:none;border-bottom:1px solid transparent}
.gap-link:hover{color:var(--brass-t);border-bottom-color:var(--brass)}
/* 23 Oct 2026 (the new-user simulation): the ranked rows were cards with a lift shadow; they are
   hairline rows now, like What you wear. The name takes the room and stops before the tag; the
   sub line may wrap to two lines. The tag is coloured words, no fill. */
.capsule-list{display:flex;flex-direction:column;gap:0}

/* ── you + settings cards ── */

.frag-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}

/* 22 Oct 2026: the summary is three columns, a Bodoni 28 numeral over a tracked 11 caps label */
.ww-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin:0 0 var(--s5)}

/* 22 Sep: these four were .wear-row/.wear-note/.wear-occ/.wear-occ-pieces — the same
   names the calendar already used. The later rules won: the day card lost its cream,
   the WORK chip became a padding-less pill, and the stylist's reply picked up
   white-space:nowrap (the unwrapped grey bar). Insights gets its own prefix. */
.ww-row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:60px;padding:var(--s2) 0;background:none;border:0;border-bottom:1px solid var(--line-dark);color:inherit;font:inherit;text-align:left;cursor:pointer}

.chip.tag-chip.off{text-decoration:line-through;opacity:.55}

.frag-shelf .frag-tile{display:flex;align-items:center;justify-content:center;background:var(--card)}
.frag-glyph{font-size:34px;color:var(--cream,var(--cream));opacity:.9}
.frag-card{position:relative;background:transparent;border:0;border-radius:0;cursor:pointer;padding:0;text-align:left;color:inherit;font:inherit;width:100%}

.pc-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:start}
.pc-chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.cchip{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 14px 0 8px;border:1px solid var(--line);border-radius:999px;background:var(--card-2);font-size:14px;color:var(--ink)}

.pc-hint{margin:0 0 10px}

.pc-panel{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.pc-acts{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-top:var(--s3)}

input[type=range].hue::-webkit-slider-runnable-track{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);height:8px}
input[type=range].hue::-moz-range-track{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);height:8px}

/* ── modals ── */
.modal-back{position:fixed;inset:0;z-index:140;background:rgba(var(--shell-rgb),.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));animation:pageIn var(--move) var(--ease)}

.colour-now{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.colour-sw{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);flex:none}
.colour-name{font-size:14px;color:var(--ink);flex:1;min-width:0}
.fine-toggle{font-size:14px;min-height:44px}
.colour-fine{margin-top:var(--s3)}
.span2{grid-column:span 1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:var(--s4) var(--s5) var(--s5)}
.modal .ghost{border-color:var(--line);color:var(--ink)}
.modal p{color:var(--ink)}

/* ── bottom nav ── */
.bottomnav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;height:64px;border-radius:999px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;background:rgba(var(--panel-rgb),.94);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line-dark);box-shadow:inset 0 1px 0 rgba(var(--cream-rgb),.06)}

/* misc */
.ai-wait{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-size:13px;z-index:150;box-shadow:var(--shadow-float);max-width:88vw;text-align:center;pointer-events:none}
