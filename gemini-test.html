<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemini outfit-photo test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--card:#F6F1E6;--card2:#EFE9DA;--ink:#241B12;--steel:#7C7263;--line:#DCD3BF;--brass:#B08D52;--brass-dim:#8A6E42;--good:#4E6B45;--warn:#9A4A31;--shell:#1E1510}
*{box-sizing:border-box}
body{margin:0;background:var(--shell);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;background:var(--card);border-radius:16px;padding:18px}
h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:26px;margin:0 0 2px}
.sub{color:var(--steel);font-size:13px;margin:0 0 16px}
label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:8px;padding:11px 16px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.primary{background:var(--brass);border-color:var(--brass);color:#20160D;font-weight:600}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mono{font-family:'IBM Plex Mono',monospace}
.stat{background:var(--card2);border-radius:10px;padding:10px 12px;margin:14px 0;font-size:12.5px;line-height:1.6}
.stat b{font-weight:500}
.verdict{border-radius:10px;padding:12px;margin:14px 0;font-size:14px;line-height:1.45}
.verdict.ok{background:#E7EFE3;border:1px solid #C3D6BA}
.verdict.bad{background:#F3E3DE;border:1px solid #E0C3B9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--card2)}
.card .cap{padding:7px 9px;font-size:11.5px;line-height:1.35;color:var(--steel)}
.card .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 9px;border-top:1px solid var(--line)}
.badge.load{color:var(--good)}.badge.fail{color:var(--warn)}
details{margin-top:14px}
summary{font-size:13px;color:var(--steel);cursor:pointer}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--card2);padding:10px;border-radius:8px;max-height:340px;overflow:auto}
.err{color:var(--warn);font-size:13.5px;margin:12px 0}
.hint{color:var(--steel);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gemini outfit-photo test</h1>
  <p class="sub">One question: can Gemini search, read a page, and hand back <em>image URLs that actually load</em>? If yes, Atelier's 16¢ call gets much cheaper.</p>

  <label>Gemini API key</label>
  <input id="key" type="password" placeholder="AQ.… or AIza…" autocomplete="off">

  <label>Model <span class="hint" id="modelnote"></span></label>
  <select id="model"><option value="">Tap “Load models” →</option></select>
  <div class="row"><button id="loadModels">Load models</button></div>

  <label>Garment</label>
  <input id="piece" value="Ivory knit polo top">
  <label>Wardrobe</label>
  <select id="wardrobe"><option>Menswear</option><option>Womenswear</option></select>

  <div class="row">
    <button class="primary" id="run" disabled>Find outfit photos</button>
    <button id="clear">Clear</button>
  </div>

  <div id="out"></div>

  <details>
    <summary>Raw response</summary>
    <pre id="raw">—</pre>
  </details>
</div>

<script>
const $ = (id) => document.getElementById(id);
const out = $("out"), raw = $("raw");
const KEY_STORE = "gemini-test-key";
try { const k = localStorage.getItem(KEY_STORE); if (k) $("key").value = k; } catch {}
$("key").addEventListener("change", () => { try { localStorage.setItem(KEY_STORE, $("key").value.trim()); } catch {} });

function ready() { $("run").disabled = !($("key").value.trim() && $("model").value); }
$("key").addEventListener("input", ready);
$("model").addEventListener("change", ready);

/* Model names move fast, so ask the API which ones exist rather than hard-coding one. */
$("loadModels").onclick = async () => {
  const key = $("key").value.trim();
  if (!key) { out.innerHTML = '<p class="err">Paste the key first.</p>'; return; }
  $("loadModels").disabled = true; $("modelnote").textContent = "loading…";
  try {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models", { headers: { "x-goog-api-key": key } });
    const j = await r.json();
    if (j.error) throw new Error(j.error.message);
    const usable = (j.models || [])
      .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map((m) => m.name.replace("models/", ""))
      .filter((n) => !/embedding|aqa|imagen|veo|tts|image-generation/i.test(n));
    /* flash first: cheap is the whole point of this test */
    usable.sort((a, b) => (/flash/i.test(b) - /flash/i.test(a)) || a.localeCompare(b));
    $("model").innerHTML = usable.map((n) => `<option${/flash/i.test(n) && !/lite|thinking/i.test(n) ? " selected" : ""}>${n}</option>`).join("");
    $("modelnote").textContent = `${usable.length} available`;
  } catch (e) {
    $("modelnote").textContent = "";
    out.innerHTML = `<p class="err">${e.message}</p>`;
  }
  $("loadModels").disabled = false; ready();
};

$("clear").onclick = () => { out.innerHTML = ""; raw.textContent = "—"; };

$("run").onclick = async () => {
  const key = $("key").value.trim(), model = $("model").value;
  const piece = $("piece").value.trim(), wardrobe = $("wardrobe").value;
  $("run").disabled = true;
  out.innerHTML = '<p class="hint">Searching and reading pages… this can take 10–30s.</p>';
  const who = wardrobe === "Womenswear" ? "womenswear" : "menswear";
  const prompt = `Garment: "${piece}" (${who}). Find PHOTOGRAPHS OF COMPLETE OUTFITS worn by a person, featuring a garment like it.
Search for a page showing MANY outfit photos — a street style gallery, a lookbook, or a "how to wear" feature on a fashion publication. Prefer refined editorial sources over discount or SEO-collage sites. Then READ the best one or two pages and take photograph URLs from the page content.
An image URL must: come from a page you actually read; show a person wearing clothes (not a flat cut-out, logo or icon); be a direct link ending in jpg, jpeg, png or webp (query strings are fine).
Reply with ONLY JSON, no code fences:
{"looks":[{"image":"https://…","page":"https://…","what":"the outfit in 6-10 words"}]}
Up to 8, best first. If you cannot find real image URLs in page content, return {"looks":[]} rather than inventing any.`;
  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    tools: [{ google_search: {} }, { url_context: {} }],
    generationConfig: { maxOutputTokens: 3000 },
  };
  const t0 = Date.now();
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
      { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body: JSON.stringify(body) });
    const j = await r.json();
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    raw.textContent = JSON.stringify(j, null, 1).slice(0, 60000);
    if (j.error) { out.innerHTML = `<p class="err">${j.error.message}</p>`; $("run").disabled = false; return; }

    const cand = j.candidates?.[0];
    const text = (cand?.content?.parts || []).map((p) => p.text || "").join("");
    const um = j.usageMetadata || {};
    const gm = cand?.groundingMetadata || {};
    const uc = cand?.urlContextMetadata || cand?.url_context_metadata || {};
    const retrieved = (uc.urlMetadata || uc.url_metadata || []).map((u) => u.retrievedUrl || u.retrieved_url || u.url).filter(Boolean);
    const queries = gm.webSearchQueries || gm.web_search_queries || [];

    let looks = [];
    try { looks = (JSON.parse(text.replace(/```json|```/g, "").trim()).looks) || []; } catch {}
    const valid = looks.filter((l) => /^https?:\/\/\S+\.(jpe?g|png|webp)(\?|$)/i.test(l.image || ""));

    out.innerHTML = `
      <div class="stat mono">
        <b>${secs}s</b> · finish: ${cand?.finishReason || "—"}<br>
        tokens in <b>${um.promptTokenCount ?? "?"}</b> · out <b>${um.candidatesTokenCount ?? "?"}</b> · total <b>${um.totalTokenCount ?? "?"}</b><br>
        searches: ${queries.length ? queries.map((q) => `“${q}”`).join(", ") : "none reported"}<br>
        pages read: ${retrieved.length || 0}${retrieved.length ? "<br>" + retrieved.map((u) => "· " + u).join("<br>") : ""}<br>
        image URLs returned: <b>${looks.length}</b> · well-formed: <b>${valid.length}</b>
      </div>
      <div id="verdict"></div>
      <div class="grid" id="grid"></div>`;

    const grid = $("grid");
    let loaded = 0, failed = 0;
    const settle = () => {
      if (loaded + failed < valid.length) return;
      const v = $("verdict");
      if (loaded >= 3) v.innerHTML = `<div class="verdict ok"><b>It works.</b> ${loaded} of ${valid.length} images loaded. Gemini can do this job — worth switching the grid to it and comparing quality.</div>`;
      else if (valid.length && loaded > 0) v.innerHTML = `<div class="verdict bad"><b>Partly.</b> Only ${loaded} of ${valid.length} images loaded (${failed} broken or hotlink-blocked). Usable but thin — Claude currently returns ~8.</div>`;
      else v.innerHTML = `<div class="verdict bad"><b>No.</b> No usable image URLs came back${retrieved.length ? "" : ", and no page was actually read"}. The URL-context tool likely returns cleaned text without image links — so this path is a dead end and we keep Claude.</div>`;
    };
    if (!valid.length) settle();
    valid.forEach((l) => {
      const c = document.createElement("div"); c.className = "card";
      c.innerHTML = `<img loading="lazy" referrerpolicy="no-referrer" src="${l.image}" alt="">
        <div class="cap">${(l.what || "").replace(/</g, "&lt;")}</div>
        <div class="badge mono">checking…</div>`;
      grid.appendChild(c);
      const img = c.querySelector("img"), badge = c.querySelector(".badge");
      img.onload = () => { if (img.naturalWidth < 60) { img.onerror(); return; } loaded++; badge.textContent = `loaded ${img.naturalWidth}×${img.naturalHeight}`; badge.className = "badge mono load"; settle(); };
      img.onerror = () => { failed++; badge.textContent = "did not load"; badge.className = "badge mono fail"; c.querySelector("img").style.display = "none"; settle(); };
    });
    if (!looks.length && text) out.insertAdjacentHTML("beforeend", `<details open><summary>Model said</summary><pre>${text.slice(0, 2000).replace(/</g, "&lt;")}</pre></details>`);
  } catch (e) {
    out.innerHTML = `<p class="err">${e.message}${/Failed to fetch/i.test(e.message) ? " — if this says “Failed to fetch”, the browser blocked the call (CORS), which itself is an answer: the app would need a server for this path." : ""}</p>`;
  }
  $("run").disabled = false;
};
</script>
</body>
</html>
